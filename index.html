<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssembiX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
--primary:#F97316;
--primary-dark:#C2410C;
--accent:#FDBA74;
--dark:#7C2D12;
--bg-page:#FFF6EF;
--surface:#FFFFFF;
--border:#F3DCC9;
--border-soft:#F8EAE0;
--text:#431407;
--text-soft:#8B6F5E;
--text-faint:#C9AE9C;
--success:#15803D;
--success-bg:#DCFCE7;
--warning:#B45309;
--warning-bg:#FEF3C7;
--danger:#B91C1C;
--danger-bg:#FEE2E2;
--info:#1D4ED8;
--info-bg:#DBEAFE;
/* Chart series: validated for colour-blind separation. */
--fr:#E8743B;
--bb:#2A9D8F;
--prod:#5B6CD9;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-page);font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--text);min-height:100vh;}
h1,h2,h3,.brand-word,.btn,.nav-item,.content-h{font-family:"Plus Jakarta Sans",sans-serif;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.hidden{display:none !important;}
a{color:inherit;}

/* Quantity boxes: no spinner arrows. A stray scroll over a focused box
   silently changed the number, which here means a wrong count. */
input[type="number"]{-moz-appearance:textfield;appearance:textfield;}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

/* ===== LOGIN ===== */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(1200px 600px at 20% 10%,#9A3412 0%,transparent 60%),
radial-gradient(900px 500px at 90% 90%,#C2410C 0%,transparent 55%),#431407;}
.login-card{background:var(--surface);border-radius:18px;padding:36px 32px;width:100%;max-width:400px;
box-shadow:0 24px 60px rgba(67,20,7,0.35);text-align:center;}
.login-card .brand{justify-content:center;margin-bottom:22px;}
.login-card h2{font-weight:800;font-size:20px;margin:0 0 6px;color:var(--dark);}
.login-card p{margin:0 0 24px;color:var(--text-soft);font-size:13.5px;line-height:1.6;}
#g_id_signin{display:flex;justify-content:center;}
#login-status{margin-top:16px;font-size:12.5px;color:var(--text-soft);min-height:18px;line-height:1.5;}

/* ===== SHELL ===== */
.app-shell{display:flex;align-items:stretch;min-height:100vh;}
.sidebar{width:214px;flex-shrink:0;background:var(--dark);display:flex;flex-direction:column;padding:20px 14px;gap:22px;
position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-home{text-decoration:none;border-radius:9px;padding:4px 6px;margin:-4px 0;transition:background .15s ease;}
.brand-home:hover{background:rgba(255,255,255,0.07);}
.brand-mark{width:32px;height:32px;flex-shrink:0;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:800;font-size:15px;font-family:"Plus Jakarta Sans",sans-serif;}
.brand-word{font-weight:800;font-size:17px;letter-spacing:0.02em;color:#FFF7ED;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:#B98A6E;padding:12px 10px 5px;font-weight:700;}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;color:#EAD5C8;font-size:13.5px;
font-weight:500;cursor:pointer;text-decoration:none;transition:0.15s ease;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;}
.nav-count{font-size:11px;font-weight:700;background:rgba(255,255,255,0.14);border-radius:999px;padding:1px 7px;}
.nav-item.active .nav-count{background:rgba(255,255,255,0.28);}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.who{padding:0 10px;font-size:12px;color:#C8A18A;line-height:1.4;}
.who b{display:block;color:#FFF7ED;font-size:13px;font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;
justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.content-h{font-weight:700;font-size:19px;color:var(--dark);margin:0;}
.content-sub{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
.content{padding:26px 28px 40px;flex:1;}

/* A thin bar while anything is loading, instead of blanking the page. */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;overflow:hidden;pointer-events:none;}
.progress i{position:absolute;top:0;bottom:0;width:30%;background:var(--primary);border-radius:2px;animation:slide 1.1s ease-in-out infinite;}
@keyframes slide{0%{left:-30%}100%{left:100%}}

/* ===== COMPONENTS ===== */
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 15px;border-radius:8px;cursor:pointer;
font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:0.15s ease;white-space:nowrap;text-decoration:none;}
.btn:hover{background:#FFF7ED;border-color:var(--accent);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(124,45,18,0.04);}
.card + .card{margin-top:18px;}
.card-h{font-weight:700;font-size:15px;color:var(--dark);margin:0 0 4px;font-family:"Plus Jakarta Sans",sans-serif;}
.card-sub{font-size:12.5px;color:var(--text-soft);margin:0 0 16px;line-height:1.5;}

label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-soft);margin-bottom:6px;}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);
font-size:14px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(249,115,22,0.13);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
border:1px solid transparent;white-space:nowrap;line-height:1.35;}
.chip-ok{background:var(--success-bg);color:var(--success);}
.chip-warn{background:var(--warning-bg);color:var(--warning);}
.chip-bad{background:var(--danger-bg);color:var(--danger);}
.chip-info{background:var(--info-bg);color:var(--info);}
.chip-idle{background:#F5EBE3;color:var(--text-soft);}
/* Status chips take their colours from STATUS_STYLE, with a dot so identity
   never rests on colour alone — the words are always there. */
.st{background:var(--c-bg);color:var(--c-fg);}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-dot);flex-shrink:0;}

.prio{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;
padding:2px 7px;vertical-align:2px;margin-right:6px;}
.prio-u{background:#DC2626;color:#fff;}
.prio-h{background:#FFEDD5;color:#C2410C;border:1px solid #FDBA74;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;
color:var(--text-soft);font-weight:700;white-space:nowrap;}
td{padding:10px 11px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
th.r,td.r{text-align:right;}
.tbl-wrap{overflow-x:auto;}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}

.empty{border:1px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text-soft);font-size:13.5px;background:#FFFBF7;}
.note{background:#FFF7ED;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--text-soft);line-height:1.55;}
.note b{color:var(--text);}
.note-bad{background:var(--danger-bg);border-color:#FBCFCF;color:#8F2020;}

.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-soft);font-size:13.5px;}
@keyframes spin{to{transform:rotate(360deg);}}
#login-status .spinner{margin-bottom:8px;}
#login-restore{display:none;}
html.restoring #login-restore{display:block;}
html.restoring #login-form{display:none;}
#restore-actions{margin-top:14px;display:flex;gap:8px;justify-content:center;}
#restore-actions:empty{display:none;}

/* ===== SEARCH, SORT ===== */
.search-wrap{position:relative;display:inline-flex;align-items:center;}
.search-wrap input{padding:7px 30px 7px 32px;font-size:13px;border-radius:8px;width:240px;}
.search-wrap .s-icon{position:absolute;left:10px;width:15px;height:15px;stroke:var(--text-soft);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.search-wrap .s-clear{position:absolute;right:6px;border:none;background:none;cursor:pointer;color:var(--text-soft);font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;}
.search-count{font-size:11.5px;color:var(--text-soft);white-space:nowrap;}

.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.sortbar .lbl{font-size:11.5px;color:var(--text-soft);font-weight:600;margin-right:4px;}
.sortbtn{border:1px solid var(--border);background:var(--surface);color:var(--text-soft);border-radius:999px;padding:5px 12px;font-size:12px;
font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.sortbtn:hover{border-color:var(--accent);color:var(--text);}
.sortbtn.on{background:var(--dark);border-color:var(--dark);color:#fff;}
.sortbtn .ar{font-size:10px;}

/* ===== CONSIGNMENT CARDS — the same shape on every page ===== */
.consign-block{margin-bottom:24px;}
.consign-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px 9px;border-bottom:2px solid var(--border);margin-bottom:12px;}
.consign-head h2{margin:0;font-size:17px;font-weight:800;color:var(--dark);}
.consign-head .meta{font-size:12px;color:var(--text-soft);}
.model-block{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:15px 17px;margin-bottom:12px;
border-left:4px solid var(--border);box-shadow:0 1px 2px rgba(124,45,18,0.03);}
.model-block.prio-high{border-left-color:#F97316;background:linear-gradient(90deg,#FFF7ED 0,#FFFFFF 180px);}
.model-block.prio-urgent{border-left-color:#DC2626;border-color:#FBCFCF;background:linear-gradient(90deg,#FFF1F1 0,#FFFFFF 220px);}
.model-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.model-title{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14.5px;color:var(--dark);}
.model-title .fac{color:var(--text-soft);font-weight:500;}
.model-meta{font-size:12px;color:var(--text-soft);margin-top:3px;}
.model-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
.big-num{text-align:right;}
.big-num .k{font-size:11px;color:var(--text-soft);font-weight:700;}
.big-num .v{font-size:26px;font-weight:800;line-height:1;font-family:"Plus Jakarta Sans",sans-serif;}

.part-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px;}
.part-tile{border:1px solid var(--border);border-radius:11px;padding:11px 12px;background:#FFFCFA;}
.part-tile .pt-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap;}
.part-tile .pt-top b{font-size:12.5px;white-space:nowrap;}
.part-tile .pt-num{font-size:21px;font-weight:800;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;line-height:1;}
.part-tile .pt-num span{font-size:12px;color:var(--text-soft);font-weight:600;margin-left:3px;}
.part-tile .pt-bar{height:6px;background:#F6E7DB;border-radius:4px;margin:8px 0 6px;overflow:hidden;}
.part-tile .pt-bar i{display:block;height:100%;background:#10B981;border-radius:4px;}
.part-tile .pt-foot{font-size:11px;color:var(--text-soft);}
.part-tile.pt-in{background:#F0FBF5;border-color:#BBEBD0;}
.part-tile.pt-late{background:#FFF6F5;border-color:#FBCFCF;}
.part-tile.pt-late .pt-bar i{background:#EF4444;}

table.lines td{font-size:12.5px;}
tr.row-late td{background:#FFF8F7;}
tr.row-short td{background:#FFFBF0;}
tr.row-done td{color:var(--text-soft);}

/* ===== DASHBOARD ===== */
.dash-section{margin-bottom:28px;}
.dash-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.dash-head h2{margin:0;font-size:15.5px;font-weight:700;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;}
.dash-head .sub{font-size:12.5px;color:var(--text-soft);}

.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;}
.stile{display:flex;flex-direction:column;gap:5px;padding:13px 13px 12px;border-radius:12px;background:var(--c-bg);border:1px solid transparent;
text-decoration:none;color:var(--c-fg);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;min-height:92px;}
a.stile:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,20,7,0.08);border-color:var(--c-dot);}
.stile .sv{font-size:25px;font-weight:800;line-height:1;font-family:"Plus Jakarta Sans",sans-serif;}
.stile .sl{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.stile .sl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-dot);}
.stile .sf{font-size:11px;opacity:.8;margin-top:auto;}
.stile.zero{opacity:.5;}
.stile.factory{box-shadow:inset 0 0 0 2px var(--c-dot);}

.ftiles{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
@media (max-width:1280px){.ftiles{grid-template-columns:repeat(4,1fr);}}
@media (max-width:640px){.ftiles{grid-template-columns:repeat(2,1fr);}}
.ftile{display:flex;flex-direction:column;gap:6px;padding:15px;border-radius:13px;background:var(--surface);border:1px solid var(--border);
border-top:4px solid var(--c-dot);text-decoration:none;color:inherit;transition:transform .12s ease,box-shadow .12s ease;}
a.ftile:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,20,7,0.08);}
.ftile .fl{font-size:12.5px;font-weight:700;color:var(--text-soft);}
.ftile .fv{font-size:28px;font-weight:800;line-height:1;color:var(--c-fg);font-family:"Plus Jakarta Sans",sans-serif;}
.ftile .ff{font-size:11px;color:var(--text-soft);}
.ftile.zero .fv{color:var(--text-faint);}
.flow-arrow{display:none;}

.cust-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:760px){.cust-grid{grid-template-columns:1fr;}}
.cust{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 18px;
border-top:4px solid var(--border);}
.cust-fr{border-top-color:var(--fr);}
.cust-bb{border-top-color:var(--bb);}
.cust .c-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.cust .c-code{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:18px;}
.cust-fr .c-code{color:#B4521F;}
.cust-bb .c-code{color:#1D7268;}
.cust .c-tag{font-size:11.5px;color:var(--text-soft);}
.cust .c-main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cust .c-num{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--dark);}
.cust .c-lab{font-size:11px;color:var(--text-soft);margin-top:5px;line-height:1.4;}

.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.gtile{display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
border-left:4px solid var(--border);text-decoration:none;color:inherit;transition:box-shadow .12s ease;}
a.gtile:hover{box-shadow:0 4px 12px rgba(67,20,7,0.08);}
.gtile.prio-urgent{border-left-color:#DC2626;background:#FFF8F8;}
.gtile.prio-high{border-left-color:#F97316;}
.gtile.late{border-color:#FBCFCF;}
.gtile .g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.gtile .g-model{font-weight:700;font-size:13.5px;font-family:"Plus Jakarta Sans",sans-serif;color:var(--dark);}
.gtile .g-meta{font-size:11.5px;color:var(--text-soft);}
.gtile .g-parts{display:flex;gap:5px;flex-wrap:wrap;}
.gtile .g-stats{display:flex;gap:14px;font-size:11.5px;color:var(--text-soft);margin-top:auto;}
.gtile .g-stats b{color:var(--text);font-size:13px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}
.two-col .card + .card{margin-top:0;}

.mini-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);text-decoration:none;color:inherit;}
.mini-row:last-child{border-bottom:none;}
a.mini-row:hover .mr-title{color:var(--primary-dark);}
.mini-row .mr-date{flex:0 0 52px;text-align:center;border-radius:9px;background:#FFF1E6;padding:5px 0;}
.mini-row .mr-date b{display:block;font-size:16px;line-height:1;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;}
.mini-row .mr-date span{font-size:10px;color:var(--text-soft);text-transform:uppercase;font-weight:700;letter-spacing:.05em;}
.mini-row .mr-body{flex:1;min-width:0;}
.mini-row .mr-title{font-size:13px;font-weight:600;}
.mini-row .mr-sub{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
.mini-row .mr-end{text-align:right;font-size:12px;color:var(--text-soft);white-space:nowrap;}
.mini-row .mr-end b{display:block;color:var(--text);font-size:13.5px;}

.arrive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.arrive-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;
gap:7px;text-decoration:none;color:inherit;border-left:4px solid var(--c-dot,var(--border));}
a.arrive-tile:hover{box-shadow:0 4px 12px rgba(67,20,7,0.08);}
.arrive-tile.late{background:#FFF8F7;border-color:#FBCFCF;border-left-color:#EF4444;}
.arrive-tile .a-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.arrive-tile .a-model{font-size:13.5px;font-weight:700;font-family:"Plus Jakarta Sans",sans-serif;color:var(--dark);}
.arrive-tile .a-meta{font-size:11.5px;color:var(--text-soft);}
.arrive-tile .a-parts{display:flex;gap:5px;flex-wrap:wrap;}

/* Charts */
.chart-wrap{position:relative;}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible;}
.chart-wrap .grid line{stroke:#F1E3D8;stroke-width:1;}
.chart-wrap .axis text{fill:var(--text-soft);font-size:10.5px;font-family:"IBM Plex Sans",sans-serif;}
.tip{position:absolute;pointer-events:none;background:#2B1206;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;white-space:nowrap;
transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,0.18);z-index:5;line-height:1.45;}
.tip b{font-weight:700;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--text-soft);align-items:center;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px;}
.dbar{margin-bottom:14px;}
.dbar:last-child{margin-bottom:0;}
.dbar .db-label{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;margin-bottom:6px;}
.dbar .db-label span:last-child{font-weight:500;color:var(--text-soft);font-size:11.5px;}
.dbar .db-line{display:grid;grid-template-columns:24px 1fr 86px;align-items:center;gap:8px;margin-bottom:4px;font-size:11.5px;}
.dbar .db-line .who{font-weight:700;padding:0;color:var(--text-soft);font-size:11px;}
.dbar .db-track{height:12px;background:#F7ECE3;border-radius:4px;position:relative;overflow:hidden;cursor:default;}
.dbar .db-sent{position:absolute;inset:0 auto 0 0;border-radius:4px;opacity:.35;}
.dbar .db-done{position:absolute;inset:0 auto 0 0;border-radius:4px;}
.dbar .db-val{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}

/* Needs attention + activity */
.att{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border-soft);text-decoration:none;color:inherit;}
.att:last-child{border-bottom:none;}
a.att:hover .att-title{color:var(--primary-dark);}
.att-ico{flex:0 0 28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.sev-high .att-ico{background:var(--danger-bg);color:var(--danger);}
.sev-mid .att-ico{background:var(--warning-bg);color:var(--warning);}
.sev-low .att-ico{background:var(--info-bg);color:var(--info);}
.att-title{font-size:13px;font-weight:600;line-height:1.35;}
.att-sub{font-size:11.5px;color:var(--text-soft);margin-top:3px;line-height:1.45;}
.act-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.act-item:last-child{border-bottom:none;}
.act-when{color:var(--text-soft);font-size:11.5px;white-space:nowrap;flex:0 0 108px;}
.act-where{color:var(--text-soft);font-size:11.5px;}

.sync-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);
border-radius:12px;padding:12px 16px;margin-bottom:18px;}
.sync-bar .s-text{font-size:13px;color:var(--text-soft);}
.sync-bar .s-text b{color:var(--text);font-weight:600;}

.master-search{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:24px;}
.master-search .ms-input{position:relative;display:flex;align-items:center;}
.master-search .ms-input input{padding:11px 14px 11px 38px;font-size:14.5px;}
.master-search .ms-input svg{position:absolute;left:13px;width:17px;height:17px;stroke:var(--text-soft);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.ms-results{margin-top:14px;}
.ms-results:empty{display:none;}
.ms-group{margin-bottom:16px;}
.ms-group:last-child{margin-bottom:0;}
.ms-group h4{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;}
.ms-hit{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--border);
border-radius:9px;margin-bottom:6px;font-size:13px;text-decoration:none;color:var(--text);background:#FFFBF7;}
.ms-hit:hover{border-color:var(--accent);background:#FFF7ED;}
.ms-hit .h-meta{font-size:11.5px;color:var(--text-soft);}
.ms-more{font-size:11.5px;color:var(--text-soft);padding:3px 2px;}

/* Forms inside cards */
.row-form{display:flex;gap:8px;align-items:center;justify-content:flex-end;}
.row-form input{width:84px;padding:7px 9px;font-size:13px;}
.dlv-form{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.dlv-cust-field{flex:0 0 130px;}
.dlv-actions{display:flex;flex-direction:column;gap:7px;padding-top:23px;}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:6px;}
.dlv-actions .hint{margin-top:0;}
.prio-pick{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.prio-pick button{border:none;background:var(--surface);font-size:11.5px;font-weight:700;padding:5px 10px;cursor:pointer;color:var(--text-soft);font-family:inherit;}
.prio-pick button + button{border-left:1px solid var(--border);}
.prio-pick button.on-normal{background:#F5EBE3;color:var(--text);}
.prio-pick button.on-high{background:#FFEDD5;color:#C2410C;}
.prio-pick button.on-urgent{background:#DC2626;color:#fff;}
.status-line{margin-top:10px;}


/* ===== SORT TOOLBAR (card pages) ===== */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;
padding:8px 10px 8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:11px;}
.tb-count{font-size:13px;font-weight:700;color:var(--dark);}
.tb-count span{font-weight:500;color:var(--text-soft);}
.tb-sort{display:flex;align-items:center;gap:8px;}
.tb-sort label{margin:0;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;}
.select-wrap{position:relative;}
.select-wrap::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--text-soft);
border-bottom:1.6px solid var(--text-soft);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
.select-wrap select{appearance:none;-webkit-appearance:none;padding:6px 28px 6px 11px;font-size:13px;font-weight:600;width:auto;
border-radius:8px;background:#FFFBF7;cursor:pointer;}
.dir-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;
padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.dir-btn:hover{border-color:var(--accent);background:#FFF7ED;}
.cons-tag{display:inline-block;font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;color:#7C2D12;background:#FFEAD5;
border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px;}

/* ===== DATA TABLES with sortable headings ===== */
.table-card{padding:0;overflow:hidden;}
.table-card .tbl-wrap{overflow-x:auto;}
.data-table thead th{position:sticky;top:0;background:#FFF9F4;z-index:1;padding:0;border-bottom:1px solid var(--border);}
.data-table th.r .th-btn{justify-content:flex-end;}
.th-btn{display:flex;align-items:center;gap:4px;width:100%;border:none;background:none;cursor:pointer;padding:10px 9px;
font:inherit;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-soft);font-weight:700;white-space:nowrap;text-align:left;}
.th-btn:hover{color:var(--dark);background:#FFF1E6;}
.th-ind{width:11px;height:14px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;background:#F6E7DB;
flex-shrink:0;position:relative;}
.th-ind::before,.th-ind::after{content:"";position:absolute;left:2.5px;border-left:3px solid transparent;border-right:3px solid transparent;}
.th-ind::before{top:2.5px;border-bottom:3.5px solid #C9AE9C;}
.th-ind::after{bottom:2.5px;border-top:3.5px solid #C9AE9C;}
th.asc .th-ind,th.desc .th-ind{background:var(--primary);}
th.asc .th-ind::before{border-bottom-color:#fff;}
th.asc .th-ind::after{border-top-color:rgba(255,255,255,0.35);}
th.desc .th-ind::after{border-top-color:#fff;}
th.desc .th-ind::before{border-bottom-color:rgba(255,255,255,0.35);}
th.asc .th-btn,th.desc .th-btn{color:var(--dark);}
.data-table td{padding:10px 9px;font-size:12.5px;vertical-align:middle;}
.data-table td.model-cell{min-width:118px;max-width:150px;}
.data-table td.nw{white-space:nowrap;}
.data-table code{white-space:nowrap;font-size:11.5px;}
.data-table .eta-chip{margin-top:4px;}
.data-table .eta-chip .chip{margin:0;}
.data-table tbody tr:hover td{background:#FFFAF5;}
.data-table .sub{font-size:11px;color:var(--text-soft);margin-top:2px;}
.data-table .sub-bad{color:var(--danger);font-weight:600;max-width:260px;white-space:normal;}
tr.prio-row-urgent td{background:#FFF4F4;}
tr.prio-row-urgent td:first-child{box-shadow:inset 4px 0 0 #DC2626;}
tr.prio-row-high td{background:#FFF9F2;}
tr.prio-row-high td:first-child{box-shadow:inset 4px 0 0 #F97316;}
tr.row-cancel td{color:var(--text-faint);}
tr.row-cancel td code{text-decoration:line-through;}
.prio-sel{width:auto;padding:5px 26px 5px 9px;font-size:12px;font-weight:700;border-radius:7px;appearance:none;-webkit-appearance:none;cursor:pointer;
background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;}
.prio-sel-normal{background-color:#F5EBE3;color:var(--text-soft);border-color:#EADBCF;}
.prio-sel-high{background-color:#FFEDD5;color:#C2410C;border-color:#FDBA74;}
.prio-sel-urgent{background-color:#DC2626;color:#fff;border-color:#DC2626;}


/* The first column stays put while a wide table scrolls sideways, so the
   packaging code of each row is always in view. */
.data-table th:first-child,.data-table td:first-child{position:sticky;left:0;z-index:2;}
.data-table thead th:first-child{z-index:3;background:#FFF9F4;}
.data-table tbody td:first-child{background:#fff;box-shadow:1px 0 0 var(--border-soft);}
.data-table tbody tr:hover td:first-child{background:#FFFAF5;}
.data-table tbody tr.row-late td:first-child{background:#FFF8F7;}
.data-table tbody tr.prio-row-high td:first-child{background:#FFF9F2;box-shadow:inset 4px 0 0 #F97316,1px 0 0 var(--border-soft);}
.data-table tbody tr.prio-row-urgent td:first-child{background:#FFF4F4;box-shadow:inset 4px 0 0 #DC2626,1px 0 0 var(--border-soft);}

/* ===== DASHBOARD ROW 1: status board ===== */
.phases{display:grid;grid-template-columns:1fr 1.2fr 1fr 0.85fr;gap:12px;align-items:stretch;}
@media (max-width:1180px){.phases{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.phases{grid-template-columns:1fr;}}
.phase{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 12px 8px;display:flex;flex-direction:column;}
.ph-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;border-bottom:1px dashed var(--border);margin-bottom:6px;}
.ph-step{width:20px;height:20px;border-radius:6px;background:#FFF1E6;color:var(--primary-dark);font-size:11px;font-weight:800;
display:inline-flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif;}
.ph-name{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:13px;color:var(--dark);}
.ph-total{margin-left:auto;font-size:11.5px;color:var(--text-soft);}
.ph-row{display:grid;grid-template-columns:10px 1fr auto 34px;align-items:center;gap:9px;padding:8px 8px;border-radius:9px;
text-decoration:none;color:var(--text);transition:background .12s ease;}
a.ph-row:hover{background:var(--c-bg);}
.ph-dot{width:10px;height:10px;border-radius:50%;background:var(--c-dot);box-shadow:0 0 0 3px var(--c-bg);}
.ph-label{font-size:13px;font-weight:600;}
.ph-lines{font-size:11px;color:var(--text-soft);}
.ph-count{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:15px;text-align:center;color:var(--c-fg);
background:var(--c-bg);border-radius:7px;padding:3px 0;}
.ph-row.is-zero{opacity:.45;}
.ph-row.is-zero .ph-count{background:#F6EEE8;color:var(--text-faint);}
.phase-hero{text-decoration:none;color:var(--c-fg);background:linear-gradient(160deg,var(--c-bg) 0%,#FFFFFF 85%);border-color:var(--c-dot);}
.phase-hero .ph-head{border-bottom-color:rgba(5,150,105,0.25);}
.phase-hero .ph-step{background:var(--c-dot);color:#fff;}
.phase-hero .ph-hero-v{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:44px;line-height:1;margin:14px 4px 6px;}
.phase-hero .ph-hero-l{font-size:13px;font-weight:700;margin:0 4px;}
.phase-hero .ph-hero-f{font-size:11.5px;margin:6px 4px 8px;opacity:.8;}
a.phase-hero:hover{box-shadow:0 6px 16px rgba(5,150,105,0.14);}
.phase-hero.is-zero{opacity:.55;}

/* ===== DASHBOARD ROW 2: process strip ===== */
.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;}
@media (max-width:1280px){.flow{grid-template-columns:repeat(4,1fr);}}
@media (max-width:640px){.flow{grid-template-columns:repeat(2,1fr);}}
.flow-step{position:relative;display:flex;flex-direction:column;padding:14px 14px 13px;border-radius:14px;text-decoration:none;color:inherit;
background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(124,45,18,0.04);
transition:transform .12s ease,box-shadow .12s ease;}
a.flow-step:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(67,20,7,0.09);border-color:var(--c);}
.flow-step::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c);}
@media (min-width:1281px){
  .flow-step:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:10px;height:10px;margin-top:-5px;
  border-top:2px solid #E5C9B5;border-right:2px solid #E5C9B5;transform:rotate(45deg);}
}
.fs-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.fs-icon{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--cf);}
.fs-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.fs-num{font-size:10.5px;font-weight:800;color:var(--text-faint);font-family:"Plus Jakarta Sans",sans-serif;}
.fs-value{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:30px;line-height:1;color:var(--cf);}
.fs-label{font-size:13px;font-weight:700;color:var(--dark);margin-top:6px;}
.fs-foot{font-size:11px;color:var(--text-soft);margin-top:3px;line-height:1.4;}
.flow-step.is-zero .fs-value{color:var(--text-faint);}
.flow-step.is-zero .fs-icon{background:#F6EEE8;color:var(--text-faint);}
.flow-step.is-zero::before{background:#EAD9CC;}

.done-section{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
.done-section summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.done-section .ds-title{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14px;color:var(--dark);}
.done-section .ds-sub{font-size:12px;color:var(--text-soft);}

/* ===== Sidebar icons ===== */
.nav-item .ni{display:inline-flex;align-items:center;gap:10px;}
.nav-item .ni svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}

@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

@media (max-width:820px){
.app-shell{flex-direction:column;}
.sidebar{width:100%;height:auto;position:static;}
.nav{flex-direction:row;flex-wrap:wrap;}
.nav-item{width:auto;}
.nav-label{display:none;}
.sidebar-foot{margin-top:14px;flex-direction:row;align-items:center;justify-content:space-between;}
.content{padding:16px;}
.topbar{padding:12px 16px;position:static;}
.search-wrap input{width:100%;}
.search-wrap{width:100%;}
.act-when{flex:0 0 88px;}
.cust .c-main{grid-template-columns:1fr 1fr 1fr;}
}
</style>
</head>

     screen. The sign-in card used to flash up for the few seconds the data

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDAt4paCuEsZ0HZG4eWyWAMX_AVevyEBNVdUPyM6t6EJoMi8r1fpEc-R3epfe5XmMv/exec";
const GOOGLE_CLIENT_ID = "766825494798-2vq54u2u9kmfegir98uig2ubr9gr6hj4.apps.googleusercontent.com";

/* `filter` puts the filter box in the top bar. The Dashboard has its own
   master search and Reports searches the server, so neither gets one — two
   search boxes on one screen fought each other. `hidden` pages are reached
   from links, not the sidebar. */
const PAGES = [
  { id: 'dashboard',    label: 'Dashboard',    group: 'Overview',  filter: false },
  { id: 'consignments', label: 'Consignments', group: 'Incoming',  filter: true, sort: true },
  { id: 'receiving',    label: 'Receiving',    group: 'Warehouse', filter: true, sort: true, count: () => countReceiving() },
  { id: 'assembly',     label: 'Assembly',     group: 'Warehouse', filter: true, sort: true, count: () => countAssembly() },
  { id: 'delivery',     label: 'Delivery',     group: 'Output',    filter: true, sort: true, count: () => countDelivery() },
  { id: 'acceptance',   label: 'Acceptance',   group: 'Output',    filter: true, sort: true, count: () => countAcceptance() },
  { id: 'needsreview',  label: 'Needs review', group: 'Output',    filter: true, count: () => (APP.needsReview || []).length },
  { id: 'reports',      label: 'Reports',      group: 'Output',    filter: false },
  { id: 'activity',     label: 'Your activity', hidden: true,      filter: true },
  { id: 'tile',         label: 'Details',       hidden: true,      filter: true, sort: true }
];

/* ---------- Colours ----------
   Each status has a soft background, a deep text colour and a dot. The
   journey runs cool to warm to green: grey and violet before production,
   blues while it travels, yellow at the border, greens once it is here, and
   a strong emerald for Factory received — the one the website owns. */
const STATUS_STYLE = {
  'Cancel':            { bg: '#F1F1F3', fg: '#5F6170', dot: '#A1A1AA' },
  'Formal order':      { bg: '#EEF2F7', fg: '#3F4E63', dot: '#94A3B8' },
  'Production await':  { bg: '#F4EFFC', fg: '#62419E', dot: '#B79CF2' },
  'Production':        { bg: '#EDE8FE', fg: '#5130B0', dot: '#8B5CF6' },
  'Short load':        { bg: '#FFF1DB', fg: '#8F5200', dot: '#F59E0B' },
  'Loaded':            { bg: '#E5EEFF', fg: '#1D4AAF', dot: '#3B82F6' },
  'Foreign banking':   { bg: '#E7E9FF', fg: '#373CA8', dot: '#6366F1' },
  'Local banking':     { bg: '#E0F2FE', fg: '#0A5A84', dot: '#0EA5E9' },
  'Clearance':         { bg: '#FDF4D3', fg: '#7A5B00', dot: '#EAB308' },
  'On road':           { bg: '#DCF5F5', fg: '#0B666C', dot: '#14B8A6' },
  'Recently received': { bg: '#EAF7DD', fg: '#3C6612', dot: '#84CC16' },
  'Already received':  { bg: '#DEF5E7', fg: '#166236', dot: '#22C55E' },
  'Factory received':  { bg: '#D3F2E6', fg: '#075A41', dot: '#059669' }
};
const SHEET_STATUSES = ['Cancel', 'Formal order', 'Production await', 'Production', 'Short load', 'Loaded',
  'Foreign banking', 'Local banking', 'Clearance', 'On road', 'Recently received', 'Already received'];
const STATUS_TILES = SHEET_STATUSES.concat(['Factory received']);

/* ---------- State ---------- */

// Old versions kept the Google token here; it expires after an hour, which
// is what sent people back to the login screen on refresh.
try { localStorage.removeItem('assembix_idToken'); } catch (e) {}
let session = null;
try { session = localStorage.getItem('assembix_session'); } catch (e) {}
let pendingIdToken = null;
let user = null;
let APP = null;
let currentPage = 'dashboard';
let currentQuery = {};
const SORT = {};
let inFlight = 0;

function setSession(tok) {
  session = tok || null;
  try {
    if (session) localStorage.setItem('assembix_session', session);
    else localStorage.removeItem('assembix_session');
  } catch (e) {}
}

function busy(on) {
  inFlight = Math.max(0, inFlight + (on ? 1 : -1));
  const bar = document.getElementById('progress');
  if (bar) bar.classList.toggle('hidden', inFlight === 0);
}

/* ---------- Talking to the server ---------- */

async function apiCall(action, payload = {}) {
  const body = Object.assign({ action }, payload);
  if (session) body.session = session;
  else if (pendingIdToken) body.idToken = pendingIdToken;
  else return { ok: false, authFailed: true, error: 'Not signed in.' };

  busy(true);
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data && data.session) { setSession(data.session); pendingIdToken = null; }
    // Only a real "you are not signed in" logs you out. A slow connection or
    // a server hiccup used to wipe the session and loop back to login.
    if (data && data.authFailed) handleSessionExpiry(data.error);
    return data;
  } catch (e) {
    return { ok: false, network: true, error: 'Could not reach the server. Check your connection and try again.' };
  } finally {
    busy(false);
  }
}

/* Every save hands back fresh data in the same response, so the page redraws
   at once from it instead of making a second slow round trip. */
function takeApp(res) {
  if (res && res.app) { APP = res.app; return true; }
  return false;
}

async function reload() {
  const res = await apiCall('getAppData');
  if (res.ok) { APP = res; route(); }
  else if (!res.authFailed) toast(res.error || 'Could not refresh.');
  return res;
}

/* ---------- Sign-in ---------- */

function initGoogleSignIn() {
  if (typeof google === 'undefined') { handleGsiLoadError(); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large', width: 260 });
  if (!session && !user) google.accounts.id.prompt();
}

function handleGsiLoadError() {
  if (session) return; // not needed while the saved session is good
  document.getElementById('login-status').innerText = "Could not load Google Sign-In. The page must be served over https:// with a working connection.";
}

function handleCredentialResponse(response) {
  pendingIdToken = response.credential;
  setSession(null);
  completeLogin();
}

function showSignInForm(message) {
  document.documentElement.classList.remove('restoring');
  document.getElementById('login-status').innerText = message || '';
  try { if (typeof google !== 'undefined' && google.accounts && !user) google.accounts.id.prompt(); } catch (e) {}
}

async function completeLogin() {
  const restoring = !!session && !pendingIdToken;
  const statusEl = document.getElementById('login-status');
  if (restoring) {
    document.documentElement.classList.add('restoring');
    document.getElementById('restore-msg').innerText = 'Loading your consignments.';
    document.getElementById('restore-actions').innerHTML = '';
    statusEl.innerText = '';
  } else {
    statusEl.innerHTML = `<div class="spinner"></div>Signing you in…`;
  }

  const res = await apiCall('getAppData');

  if (res.ok) {
    APP = res;
    user = res.user;
    statusEl.innerText = '';
    document.documentElement.classList.remove('restoring');
    document.getElementById('scr-login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('who-name').innerText = user.name || user.email;
    document.getElementById('who-role').innerText = roleLabel(user.level);
    if (!window.__routed) { window.addEventListener('hashchange', route); window.__routed = true; }
    route();
    return;
  }

  if (res.network) {
    // Keep the session: the server was unreachable, not the sign-in wrong.
    if (restoring) {
      document.getElementById('restore-msg').innerText = res.error;
      document.getElementById('restore-actions').innerHTML =
        '<button class="btn btn-sm btn-primary" onclick="completeLogin()">Try again</button>';
    } else {
      statusEl.innerHTML = esc(res.error) +
        '<div style="margin-top:12px;"><button class="btn btn-sm" onclick="completeLogin()">Try again</button></div>';
    }
    return;
  }
  showSignInForm(res.error || 'Sign-in failed.');
}

function handleSessionExpiry(message) {
  setSession(null);
  pendingIdToken = null;
  user = null;
  APP = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('scr-login').classList.remove('hidden');
  showSignInForm(message || 'Please sign in again.');
}

function roleLabel(level) {
  if (level === 0) return 'Director';
  if (level === 1) return 'Manager';
  return 'Staff';
}

function doLogout() {
  const tok = session;
  if (tok) {
    fetch(APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'logout', session: tok }) }).catch(() => {});
  }
  setSession(null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  setTimeout(() => location.reload(), 150);
}

// A saved session signs you straight in — no Google popup, no waiting for it.
if (session) completeLogin(); else document.documentElement.classList.remove('restoring');

function renderNav() {
  const nav = document.getElementById('nav');
  let html = '', lastGroup = null;
  PAGES.forEach(p => {
    if (p.hidden) return;
    if (p.group !== lastGroup) { html += `<div class="nav-label">${esc(p.group)}</div>`; lastGroup = p.group; }
    const n = p.count && APP ? p.count() : 0;
    html += `<a class="nav-item${p.id === currentPage ? ' active' : ''}" href="#/${p.id}">
      <span class="ni"><svg viewBox="0 0 24 24">${NAV_ICONS[p.id] || ''}</svg>${esc(p.label)}</span>${n ? `<span class="nav-count">${n}</span>` : ''}</a>`;
  });
  nav.innerHTML = html;
}

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '') || 'dashboard';
  const qIdx = raw.indexOf('?');
  const id = (qIdx === -1 ? raw : raw.slice(0, qIdx)) || 'dashboard';
  const query = {};
  if (qIdx !== -1) {
    raw.slice(qIdx + 1).split('&').forEach(kv => {
      const i = kv.indexOf('=');
      if (i === -1) return;
      try { query[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); }
      catch (e) { query[kv.slice(0, i)] = kv.slice(i + 1); }
    });
  }
  return { id, query };
}

function route() {
  if (!user || !APP) return;
  const { id, query } = parseHash();
  const page = PAGES.find(p => p.id === id);
  if (!page) { window.location.hash = '#/dashboard'; return; }

  const samePage = page.id === currentPage && JSON.stringify(query) === JSON.stringify(currentQuery);
  const keepScroll = samePage ? window.scrollY : 0;
  const typed = document.getElementById('page-search');
  const keepFilter = samePage && typed ? typed.value : (query.q || '');

  currentPage = page.id;
  currentQuery = query;

  const head = PAGE_HEAD[page.id] ? PAGE_HEAD[page.id](query) : { title: page.label, sub: '' };
  document.getElementById('page-title').innerText = head.title;
  document.getElementById('page-sub').innerText = head.sub || '';

  document.getElementById('page-actions').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${page.filter ? `
      <div class="search-wrap">
        <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="page-search" placeholder="Filter this page" autocomplete="off">
        <button class="s-clear hidden" id="page-search-clear" title="Clear" aria-label="Clear search">×</button>
      </div>
      <span class="search-count" id="page-search-count"></span>` : ''}
      <button class="btn btn-sm" id="page-refresh">Refresh</button>
    </div>`;
  document.getElementById('page-refresh').onclick = async () => {
    const b = document.getElementById('page-refresh');
    b.disabled = true; b.innerText = 'Refreshing…';
    await reload();
  };

  renderNav();
  document.getElementById('content').innerHTML = RENDERERS[page.id](query);
  wirePageHandlers(page.id);
  wirePageSearch();

  const input = document.getElementById('page-search');
  if (input && keepFilter) {
    input.value = keepFilter;
    document.getElementById('page-search-clear').classList.remove('hidden');
    applyPageFilter(keepFilter.toLowerCase());
  }
  if (keepScroll) window.scrollTo(0, keepScroll);
}

/* Redraw this page from APP without going to the server, keeping the filter
   and scroll where they were. Used after sorting, and after every save. */
function reRender() {
  const input = document.getElementById('page-search');
  const q = input ? input.value.trim().toLowerCase() : '';
  const y = window.scrollY;
  renderNav();
  document.getElementById('content').innerHTML = RENDERERS[currentPage](currentQuery);
  wirePageHandlers(currentPage);
  if (q) applyPageFilter(q);
  window.scrollTo(0, y);
}

function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2B1206;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;';
    document.body.appendChild(el);
  }
  el.innerText = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4200);
}

/* ---------- Filter ----------

   Works on the card shape every page shares: consignment → model → line.
   Anything carrying class `fx` can be matched; its own heading is the `.fh`
   directly inside it.

   The old filter matched blocks and rows separately. Typing "tony" matched
   the Tony model card but none of its part rows — so the card showed with
   every row inside it hidden. Now a match at any level shows that thing
   whole, and a match further down shows just the path to it. */

function wirePageSearch() {
  const input = document.getElementById('page-search');
  const clear = document.getElementById('page-search-clear');
  if (!input) return;
  const run = () => {
    const q = input.value.trim().toLowerCase();
    clear.classList.toggle('hidden', !q);
    applyPageFilter(q);
    if (!q && window.location.hash.indexOf('q=') !== -1) {
      const { id, query } = parseHash();
      delete query.q;
      const rest = Object.keys(query).map(k => k + '=' + encodeURIComponent(query[k])).join('&');
      history.replaceState(null, '', '#/' + id + (rest ? '?' + rest : ''));
      currentQuery = query;
    }
  };
  input.oninput = run;
  input.onkeydown = e => { if (e.key === 'Escape') { input.value = ''; run(); } };
  clear.onclick = () => { input.value = ''; run(); input.focus(); };
}

function applyPageFilter(q) {
  const content = document.getElementById('content');
  const countEl = document.getElementById('page-search-count');
  if (!content) return;

  const all = [...content.querySelectorAll('.fx')];
  const kidsOf = node => all.filter(k => k.parentElement.closest('.fx') === node);
  const tops = all.filter(n => !n.parentElement.closest('.fx'));
  const own = node => {
    const head = [...node.children].find(c => c.classList.contains('fh'));
    return (head || node).textContent.toLowerCase();
  };

  const visit = (node, forced) => {
    const kids = kidsOf(node);
    const self = forced || !q || own(node).indexOf(q) !== -1;
    let anyKid = false;
    kids.forEach(k => { if (visit(k, self)) anyKid = true; });
    const visible = kids.length ? (self || anyKid) : self;
    node.classList.toggle('hidden', !visible);
    return visible;
  };
  tops.forEach(t => visit(t, false));

  let msg = content.querySelector('#page-search-empty');
  const models = [...content.querySelectorAll('.model-block.fx')];
  const shown = models.length
    ? models.filter(m => !m.classList.contains('hidden')).length
    : all.filter(n => !kidsOf(n).length && !n.classList.contains('hidden')).length;

  if (q && !shown) {
    if (!msg) {
      msg = document.createElement('div');
      msg.id = 'page-search-empty';
      msg.className = 'empty';
      content.prepend(msg);
    }
    msg.innerText = 'Nothing on this page matches “' + q + '”.';
  } else if (msg) {
    msg.remove();
  }
  if (countEl) {
    countEl.innerText = q ? (shown + (models.length ? ' model' : ' match') + (shown === 1 ? '' : (models.length ? 's' : 'es'))) : '';
  }
}

/* ---------- Sort ----------

   Card pages get one small sort control above the cards: a "Sort by" menu
   and a direction button that says in words which way it runs.

   The old row of pill buttons looked like it sorted but mostly didn't: the
   cards stayed bunched under their consignment headings, so sorting by Model
   or ETA barely moved anything. Now "Consignment" is the only order that
   groups; every other order lays the models out as one list, each card
   carrying its consignment name, so the order you pick is the order you see. */

const SORT_KEYS = [
  { k: 'consignment', label: 'Consignment', up: 'A → Z',              down: 'Z → A' },
  { k: 'urgency',     label: 'Most urgent', up: 'Most urgent first',  down: 'Least urgent first' },
  { k: 'eta',         label: 'ETA',         up: 'Soonest first',      down: 'Latest first' },
  { k: 'status',      label: 'Status',      up: 'Least advanced first', down: 'Furthest along first' },
  { k: 'priority',    label: 'Priority',    up: 'Urgent first',       down: 'Normal first' },
  { k: 'model',       label: 'Model',       up: 'A → Z',              down: 'Z → A' },
  { k: 'supplier',    label: 'Supplier',    up: 'A → Z',              down: 'Z → A' }
];

// Receiving opens most-urgent-first (late and ready lines on top); the
// other card pages open grouped by consignment.
const DEFAULT_SORT = { receiving: 'urgency', tile: 'urgency' };
function sortState() {
  return SORT[currentPage] || { key: DEFAULT_SORT[currentPage] || 'consignment', dir: 1 };
}

function sortBar(n) {
  const s = sortState();
  const def = SORT_KEYS.find(x => x.k === s.key) || SORT_KEYS[0];
  return `
    <div class="toolbar">
      <div class="tb-count">${n != null ? n + ' model' + (n === 1 ? '' : 's') : ''}${
        s.key === 'consignment' ? ' <span>· grouped by consignment</span>' : ''}</div>
      <div class="tb-sort">
        <label for="sort-key">Sort by</label>
        <div class="select-wrap">
          <select id="sort-key">${SORT_KEYS.map(x =>
            `<option value="${x.k}"${x.k === s.key ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}</select>
        </div>
        <button class="dir-btn" id="sort-dir" title="Reverse the order" aria-label="Reverse the order">
          <svg viewBox="0 0 24 24" class="icon" style="width:14px;height:14px;">${s.dir === 1
            ? '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>'
            : '<path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/>'}</svg>
          ${esc(s.dir === 1 ? def.up : def.down)}
        </button>
      </div>
    </div>`;
}

function wireSortBar() {
  const sel = document.getElementById('sort-key');
  const dir = document.getElementById('sort-dir');
  if (sel) sel.onchange = () => { SORT[currentPage] = { key: sel.value, dir: 1 }; reRender(); };
  if (dir) dir.onclick = () => { const st = sortState(); SORT[currentPage] = { key: st.key, dir: -st.dir }; reRender(); };
}

const PRIO_RANK = { Urgent: 2, High: 1, Normal: 0 };

function urgencyScore(g) {
  return (PRIO_RANK[g.priority] || 0) * 10000 +
    (g.overdueParts ? 5000 + g.worstDaysLate : 0) +
    (g.awaitingFactory ? 1000 : 0) +
    (g.needsCount ? 800 : 0) +
    (g.buildableUnits ? 400 : 0) +
    (g.readyToSend ? 200 : 0) +
    (g.pendingAcceptance ? 100 : 0);
}

function sortGroups(groups) {
  const { key, dir } = sortState();
  const cmp = (x, y) => String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' });
  const stable = (x, y) => cmp(x.consignmentGroup, y.consignmentGroup) || cmp(x.factoryModel, y.factoryModel);
  return groups.slice().sort((x, y) => {
    // Missing dates always go last, whichever way the list runs.
    if (key === 'eta') {
      const ex = x.nextEta || x.eta, ey = y.nextEta || y.eta;
      if (!ex !== !ey) return ex ? -1 : 1;
      return (cmp(ex || '', ey || '') * dir) || stable(x, y);
    }
    let r = 0;
    if (key === 'urgency') r = urgencyScore(y) - urgencyScore(x);
    else if (key === 'consignment') r = cmp(x.consignmentGroup, y.consignmentGroup);
    else if (key === 'model') r = cmp(plainModel(x), plainModel(y));
    else if (key === 'supplier') r = cmp(x.supplier, y.supplier);
    else if (key === 'status') r = (x.importStageRank || 0) - (y.importStageRank || 0);
    else if (key === 'priority') r = (PRIO_RANK[y.priority] || 0) - (PRIO_RANK[x.priority] || 0);
    return (r * dir) || stable(x, y);
  });
}

/* ---------- Small helpers ---------- */

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

function styleVars(st) { return st ? `--c-bg:${st.bg};--c-fg:${st.fg};--c-dot:${st.dot};` : ''; }

function statusChip(status, extra) {
  if (!status) return '<span class="chip chip-idle">—</span>';
  const st = STATUS_STYLE[status] || { bg: '#F5EBE3', fg: '#8B6F5E', dot: '#C9AE9C' };
  return `<span class="chip st" style="${styleVars(st)}">${esc(status)}${extra || ''}</span>`;
}

function pipeChip(p) {
  const st = PIPE_STYLE[p] || STATUS_STYLE[p] || { bg: '#F5EBE3', fg: '#8B6F5E', dot: '#C9AE9C' };
  return `<span class="chip st" style="${styleVars(st)}">${esc(p)}</span>`;
}

function prioTag(g) {
  if (g.priority === 'Urgent') return '<span class="prio prio-u">Urgent</span>';
  if (g.priority === 'High') return '<span class="prio prio-h">High</span>';
  return '';
}

function parseYmd(v) {
  if (!v) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function fmtDay(v) {
  const d = parseYmd(v);
  if (!d) return '—';
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}

function relDays(v) {
  const d = parseYmd(v);
  if (!d) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 86400000);
  if (days === 0) return { days, text: 'today', cls: 'chip-warn' };
  if (days === 1) return { days, text: 'tomorrow', cls: 'chip-warn' };
  if (days > 1) return { days, text: 'in ' + days + ' days', cls: days <= 7 ? 'chip-warn' : 'chip-idle' };
  if (days === -1) return { days, text: 'yesterday', cls: 'chip-info' };
  return { days, text: Math.abs(days) + ' days ago', cls: 'chip-info' };
}

// ETA chip for a line: nothing once it is here, red and plain-spoken if late.
function etaChip(l) {
  if (!l.eta || l.factoryReceived || l.receivedOnSheet || l.cancelled) return '';
  if (l.overdue) return ` <span class="chip chip-bad">${l.daysLate} days late</span>`;
  const rel = relDays(l.eta);
  return rel ? ` <span class="chip ${rel.cls}">${esc(rel.text)}</span>` : '';
}

function modelLabel(g) {
  const sig = g.signatureModel || g.modelName || '';
  const fac = g.factoryModel || '';
  if (sig && fac && sig !== fac) return esc(sig) + ' <span class="fac">(' + esc(fac) + ')</span>';
  return esc(sig || fac || '—');
}

function plainModel(g) { return g.signatureModel || g.factoryModel || g.modelName || '—'; }

function groupsAll() { return APP.consignments || []; }

// Consignment → its models, in the order the models arrive in.
function byConsignment(groups) {
  const order = [], map = {};
  groups.forEach(g => {
    const c = g.consignmentGroup;
    if (!map[c]) { map[c] = []; order.push(c); }
    map[c].push(g);
  });
  return order.map(c => ({ consignment: c, models: map[c] }));
}

function allLinesOf(g) {
  const lines = [];
  g.parts.forEach(p => p.lines.forEach(l => lines.push(l)));
  (g.cancelledLines || []).forEach(l => lines.push(l));
  return lines;
}

/* ---------- The card ----------
   Every page is built from these two: a consignment block holding one card
   per model. What goes inside a model card depends on the page. */

function consignBlock(consignment, models, bodyFor) {
  const late = models.filter(g => g.overdueParts > 0).length;
  const containers = [];
  models.forEach(g => (g.containers || []).forEach(c => { if (containers.indexOf(c) === -1) containers.push(c); }));
  return `
    <section class="consign-block fx">
      <div class="consign-head fh">
        <h2>${esc(consignment)}</h2>
        <span class="meta">${models.length} model${models.length === 1 ? '' : 's'}${
          containers.length ? ' · ' + esc(containers.join(', ')) : ''}</span>
        ${late ? `<span class="chip chip-bad">${late} late</span>` : ''}
      </div>
      ${models.map(bodyFor).join('')}
    </section>`;
}

function modelBlock(g, right, body) {
  const ids = (g.uniqueIds || []).join(', ');
  return `
    <div class="model-block fx prio-${esc(String(g.priority || 'Normal').toLowerCase())}" data-groupkey="${esc(g.groupKey)}">
      <div class="model-head fh">
        <div>
          <div class="model-title">${prioTag(g)}${modelLabel(g)}${CARD_FLAT
            ? ` <span class="cons-tag">${esc(g.consignmentGroup)}</span>` : ''}</div>
          <div class="model-meta">${esc(g.supplier || '—')} · ${esc(g.product || '—')}${ids ? ' · ID ' + esc(ids) : ''}${
            g.totalQty ? ' · ' + g.totalQty + ' units (FR ' + (g.frQty || 0) + ' · BB ' + (g.bbQty || 0) + ')' : ''}</div>
        </div>
        <div class="model-right">${right || ''}</div>
      </div>
      ${body}
    </div>`;
}

function partTiles(g) {
  return `<div class="part-row">${g.parts.map(p => {
    const pct = p.qtyExpected ? Math.round((p.qtyReceived / p.qtyExpected) * 100) : 0;
    const cls = p.fullyIn ? 'pt-in' : (p.overdue ? 'pt-late' : '');
    const foot = p.fullyIn ? 'all factory received'
      : p.overdue ? p.daysLate + ' days late'
      : p.awaitingFactory ? p.awaitingFactory + ' line' + (p.awaitingFactory === 1 ? '' : 's') + ' waiting for factory receipt'
      : p.needsCount ? 'short load to count'
      : p.nextEta ? 'due ' + fmtDay(p.nextEta)
      : (p.qtyReceived ? 'part received' : 'not here yet');
    return `
      <div class="part-tile ${cls}">
        <div class="pt-top"><b>Part ${esc(p.partLetter)}</b>${statusChip(p.importStatus)}</div>
        <div class="pt-num">${p.qtyReceived}<span>/ ${p.qtyExpected}</span></div>
        <div class="pt-bar"><i style="width:${pct}%;"></i></div>
        <div class="pt-foot">${esc(foot)}</div>
      </div>`;
  }).join('')}</div>`;
}

function linesTable(lines) {
  if (!lines.length) return '';
  return `
    <div class="tbl-wrap"><table class="lines">
      <thead><tr><th>Part</th><th>Packaging</th><th>Status</th><th>ETD</th><th>ETA</th>
        <th class="r">FR</th><th class="r">BB</th><th class="r">Total</th><th class="r">Received</th></tr></thead>
      <tbody>${lines.map(l => `
        <tr class="fx ${l.overdue ? 'row-late' : (l.shortLoad && !l.factoryReceived ? 'row-short' : '')}">
          <td><b>${esc(l.partLetter || '—')}</b></td>
          <td><code>${esc(l.packaging)}</code>${l.uniqueId ? `<div class="hint" style="margin-top:2px;">${esc(l.uniqueId)}</div>` : ''}</td>
          <td>${statusChip(l.status)}</td>
          <td>${esc(fmtDay(l.etd))}</td>
          <td style="white-space:nowrap;">${esc(fmtDay(l.eta))}${etaChip(l)}</td>
          <td class="r">${l.fr || '—'}</td>
          <td class="r">${l.bb || '—'}</td>
          <td class="r"><b>${l.total || '—'}</b></td>
          <td class="r">${l.factoryReceived ? `<b style="color:#075A41;">${l.qtyReceived}</b>` : '—'}</td>
        </tr>
        ${l.sheetNote ? `<tr class="fx"><td></td><td colspan="8"><div class="note note-bad" style="padding:7px 11px;">${esc(l.sheetNote)}</div></td></tr>` : ''}`).join('')}
      </tbody>
    </table></div>`;
}

// The card shown by the dashboard's drill-downs and the Consignments page.
function summaryCard(g, lineFilter) {
  const lines = allLinesOf(g).filter(lineFilter || (() => true));
  const right = `${pipeChip(g.pipeline)}${g.buildableUnits ? `
    <div class="big-num"><div class="k">Can build</div><div class="v" style="color:#15803D;">${g.buildableUnits}</div></div>` : ''}`;
  const warn = [];
  if (g.quantityNote) warn.push(g.quantityNote);
  return modelBlock(g, right,
    (g.parts.length ? partTiles(g) : '') +
    linesTable(lines) +
    (warn.length ? `<div class="note note-bad status-line">${esc(warn.join(' '))}</div>` : ''));
}

// Grouped under consignment headings when sorting by consignment; one flat
// list in the chosen order otherwise, each card naming its consignment.
let CARD_FLAT = false;
function cardsFor(groups, bodyFor) {
  const sorted = sortGroups(groups);
  if (sortState().key === 'consignment') {
    CARD_FLAT = false;
    return byConsignment(sorted).map(b => consignBlock(b.consignment, b.models, bodyFor)).join('');
  }
  CARD_FLAT = true;
  const html = `<div class="flat-list">${sorted.map(bodyFor).join('')}</div>`;
  CARD_FLAT = false;
  return html;
}

// Receiving's badge counts what someone can act on now: lines China Master
// says are in the country but the factory has not received, and short loads.
function countReceiving() {
  let n = 0;
  groupsAll().forEach(g => g.parts.forEach(p => p.lines.forEach(l => {
    if (!l.factoryReceived && (l.receivedOnSheet || l.shortLoad)) n++;
  })));
