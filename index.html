function reportRows(events) {
  if (!events.length) return `<tr><td colspan="6" style="color:var(--text-soft);padding:22px 12px;">No events logged.</td></tr>`;
  return events.map(e => `<tr><td>${esc(e.Timestamp)}</td><td>${esc(e.ConsignmentGroup)}</td><td>${esc(e.PartLetter)}</td><td>${esc(e.EventType)}</td><td>${esc(e.Qty)}</td><td>${esc(e.User)}</td></tr>`).join('');
}

/* =========================
   MODELS & PARTS
   ========================= */

function renderModels() {
  const dropboxCard = (user && user.level <= 1) ? `
    <div class="card" style="border:1px solid var(--primary);">
      <h3 class="card-h">China Master sync</h3>
      <p class="card-sub">Last synced ${APP.lastSync ? esc(new Date(APP.lastSync).toLocaleString()) : 'never'}.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="dbx-sync-btn">Sync now</button>
        <button class="btn btn-sm" id="dbx-check-btn">Check connection</button>
      </div>
      <div id="dbx-status" class="note hidden" style="margin-top:12px;"></div>
    </div>` : '';

  const seedCard = (user && user.level === 0) ? `
    <div class="card">
      <h3 class="card-h">Sample data</h3>
      <button class="btn btn-sm" id="seed-sample-btn">Load sample data</button>
      <div id="seed-sample-status" class="note hidden" style="margin-top:12px;"></div>
    </div>` : '';

  const models = APP.models || [];
  const listHtml = models.length ? `
    <div class="card">
      <h3 class="card-h">Existing models</h3>
      <p class="card-sub">Part names and per-unit counts only. What a unit actually needs comes from China Master.</p>
      <table><thead><tr><th>Model</th><th>Sheet code</th><th>Parts</th></tr></thead><tbody>
        ${models.map(m => `<tr><td>${esc(m.modelName)}</td><td><code>${esc(m.sheetCode)}</code></td>
          <td>${m.parts.map(p => `<span class="chip chip-idle">${esc(p.partLetter)} · ${esc(p.partName)} · ${p.qtyPerUnit}/unit</span>`).join(' ')}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  return `
    ${dropboxCard}
    ${seedCard}
    ${listHtml}
    <div class="card">
      <h3 class="card-h">New model</h3>
      <div class="form-row">
        <div class="field"><label>Model name</label><input id="mdl-name" type="text"></div>
        <div class="field"><label>Sheet code</label><input id="mdl-sheetcode" type="text"></div>
        <div class="field"><label>Product line</label><input id="mdl-line" type="text"></div>
      </div>
      <table id="mdl-parts-table">
        <thead><tr><th style="width:90px">Letter</th><th>Part name</th><th style="width:120px">Code prefix</th><th style="width:100px">Per unit</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-primary" id="mdl-save">Save model</button>
        <button class="btn btn-sm" id="mdl-addpart">+ Add part</button>
      </div>
      <div id="mdl-status" class="note hidden" style="margin-top:12px;"></div>
    </div>`;
}

function addModelPartRow(letter, name, prefix, qty) {
  const tbody = document.querySelector('#mdl-parts-table tbody');
  const row = document.createElement('tr');
  row.innerHTML = `
    <td><input type="text" maxlength="1" value="${esc(letter || '')}"></td>
    <td><input type="text" value="${esc(name || '')}"></td>
    <td><input type="text" value="${esc(prefix || '')}"></td>
    <td><input type="number" value="${qty || 1}" min="1"></td>
    <td><button class="btn btn-sm" onclick="this.closest('tr').remove()">×</button></td>`;
  tbody.appendChild(row);
}

/* =========================
   RENDERERS MAP
   ========================= */

const RENDERERS = {
  dashboard: renderDashboard,
  consignments: renderConsignments,
  receiving: renderReceiving,
  assembly: renderAssembly,
  delivery: renderDelivery,
  needsreview: renderNeedsReview,
  reports: renderReports,
  models: renderModels
};

/* =========================
   SYNC (shared by Dashboard and Models & parts)
   ========================= */

function wireSyncButtons(syncId, checkId, statusId) {
  const syncBtn = document.getElementById(syncId);
  const checkBtn = document.getElementById(checkId);
  const el = document.getElementById(statusId);
  if (!el) return;

  if (checkBtn) {
    checkBtn.onclick = async () => {
      checkBtn.disabled = true;
      el.classList.remove('hidden');
      el.innerText = 'Checking…';
      const res = await apiCall('testDropbox');
      if (!res.ok) {
        el.innerText = "Couldn't reach the file. " + (res.error || '');
      } else {
        const when = res.modified ? new Date(res.modified).toLocaleString() : 'unknown';
        const last = res.lastSync ? new Date(res.lastSync).toLocaleString() : 'never';
        el.innerText = 'Connected to "' + res.name + '", changed ' + when + '. Last sync: ' + last + '.';
      }
      checkBtn.disabled = false;
    };
  }

  if (syncBtn) {
    syncBtn.onclick = async () => {
      const original = syncBtn.innerText;
      syncBtn.disabled = true;
      syncBtn.innerText = 'Syncing…';
      el.classList.remove('hidden');
      el.innerText = 'Fetching China Master…';

      const res = await apiCall('syncFromDropbox');
      if (!res.ok) {
        el.innerText = 'Sync failed: ' + (res.error || 'unknown error');
        syncBtn.disabled = false;
        syncBtn.innerText = original;
        return;
      }
      let msg = res.added + ' new line(s), ' + res.updated + ' updated.';
      if (res.needsReview > 0) msg += ' ' + res.needsReview + ' need review.';
      if (res.skipped > 0) msg += ' ' + res.skipped + ' blank row(s) ignored.';
      if (res.staleCount > 0) msg += ' ' + res.staleCount + ' line(s) are no longer in the file — check them by hand.';
      el.innerText = msg;
      syncBtn.disabled = false;
      syncBtn.innerText = original;
      await reload();
    };
  }
}

/* =========================
   PAGE HANDLER WIRING
   ========================= */

/* =========================
   MASTER SEARCH (Dashboard)

   Looks across every part of the file at once — packaging lines, models,
   deliveries and the event log — and links straight to the page that holds
   each hit. Different from the topbar box, which only filters what is
   already on screen.
   ========================= */

function msHit(href, title, meta) {
  return `<a class="ms-hit" href="${href}"><span>${title}</span><span class="h-meta">${meta}</span></a>`;
}

function msGroup(name, hits, total) {
  if (!hits.length) return '';
  return `
    <div class="ms-group">
      <h4>${esc(name)} · ${total}</h4>
      ${hits.join('')}
      ${total > hits.length ? `<div class="ms-more">${total - hits.length} more — open the page to see them all.</div>` : ''}
    </div>`;
}

function runMasterSearch(q) {
  const el = document.getElementById('ms-results');
  if (!el) return;

  if (!q) { el.innerHTML = ''; return; }

  const has = (...vals) => vals.some(v => String(v == null ? '' : v).toLowerCase().indexOf(q) !== -1);
  const LIMIT = 5;

  // Models (consignment + factory model)
  const models = (APP.consignments || []).filter(g =>
    has(g.consignmentGroup, g.factoryModel, g.signatureModel, g.modelName, g.supplier, g.product, g.container, g.status, g.importStage));
  const modelHits = models.slice(0, LIMIT).map(g => msHit(
    '#/assembly',
    esc(plainModel(g)) + ' <span style="color:var(--text-soft);">' + esc(g.consignmentGroup) + '</span>',
    esc(g.supplier) + ' · ' + g.buildableUnits + ' buildable · ' + esc(g.status)));

  // Packaging lines
  const lines = (APP.rows || []).filter(r =>
    has(r.packaging, r.supplier, r.product, r.factoryModel, r.signatureModel, r.consignmentGroup, r.importStatus, r.container, r.mgr, r.partLetter));
  const lineHits = lines.slice(0, LIMIT).map(r => msHit(
    '#/consignments',
    '<code>' + esc(r.packaging) + '</code> ' + esc(r.signatureModel || ''),
    esc(r.importStatus) + (r.shortLoad ? ' · short load' : '') + ' · ETA ' + esc(fmtDay(r.eta))));

  // Deliveries
  const dels = (APP.deliveries || []).filter(d =>
    has(d.GroupKey, d.CustomerCode, d.Status, d.DeliveryID));
  const delHits = dels.slice(0, LIMIT).map(d => msHit(
    '#/delivery',
    esc(String(d.GroupKey).replace('::', ' · ')) + ' → ' + esc(d.CustomerCode),
    d.QtyOut + ' out · ' + esc(d.Status) + ' · ' + esc(d.Timestamp || '')));

  // Event log
  const evs = (APP.events || []).filter(e =>
    has(e.ConsignmentGroup, e.EventType, e.User, e.PartLetter, e.Qty));
  const evHits = evs.slice(0, LIMIT).map(e => msHit(
    '#/reports',
    esc(e.EventType) + (e.Qty !== '' && e.Qty != null ? ' · ' + esc(e.Qty) : ''),
    esc(e.ConsignmentGroup || 'whole file') + ' · ' + esc(e.Timestamp || '')));

  const total = models.length + lines.length + dels.length + evs.length;
  if (!total) {
    el.innerHTML = `<div class="empty" style="padding:26px 20px;">Nothing matches “${esc(q)}”.</div>`;
    return;
  }

  el.innerHTML =
    msGroup('Models', modelHits, models.length) +
    msGroup('Packaging lines', lineHits, lines.length) +
    msGroup('Deliveries', delHits, dels.length) +
    msGroup('Activity', evHits, evs.length);
}

function wirePageHandlers(pageId) {
  if (pageId === 'dashboard') {
    wireSyncButtons('dash-sync', 'dash-check', 'dash-sync-status');

    const ms = document.getElementById('ms-q');
    if (ms) {
      const go = () => runMasterSearch(ms.value.trim().toLowerCase());
      ms.oninput = go;
      ms.onkeydown = e => { if (e.key === 'Escape') { ms.value = ''; go(); } };
    }
  }

  if (pageId === 'consignments') {
    const s = document.getElementById('cn-sort');
    if (s) {
      s.value = window.__consignSort || 'urgency';
      // reRender puts the active filter back. Re-rendering directly used to
      // bring all 17 rows back while the search box still said "tony".
      s.onchange = () => { window.__consignSort = s.value; reRender(); };
    }
  }

  if (pageId === 'models') {
    wireSyncButtons('dbx-sync-btn', 'dbx-check-btn', 'dbx-status');

    const seedBtn = document.getElementById('seed-sample-btn');
    if (seedBtn) {
      seedBtn.onclick = async () => {
        seedBtn.disabled = true;
        seedBtn.innerText = 'Loading…';
        const res = await apiCall('seedSampleData');
        const statusEl = document.getElementById('seed-sample-status');
        statusEl.classList.remove('hidden');
        statusEl.innerText = !res.ok ? ('Error: ' + res.error)
          : (res.alreadySeeded ? res.message : `Loaded ${res.parsedCount} row(s). ${res.needsReviewCount} need review.`);
        seedBtn.disabled = false;
        seedBtn.innerText = 'Load sample data';
        await reload();
      };
    }

    addModelPartRow('A', '', '', 1);
    document.getElementById('mdl-addpart').onclick = () => addModelPartRow();
    document.getElementById('mdl-save').onclick = async () => {
      const parts = [...document.querySelectorAll('#mdl-parts-table tbody tr')].map(row => {
        const inputs = row.querySelectorAll('input');
        return { partLetter: inputs[0].value, partName: inputs[1].value, partCodePrefix: inputs[2].value, qtyPerUnit: Number(inputs[3].value) || 1 };
      });
      const res = await apiCall('saveModel', {
        modelName: document.getElementById('mdl-name').value,
        sheetCode: document.getElementById('mdl-sheetcode').value,
        productLine: document.getElementById('mdl-line').value,
        parts
      });
      const statusEl = document.getElementById('mdl-status');
      statusEl.classList.remove('hidden');
      statusEl.innerText = res.ok ? 'Model saved.' : ('Error: ' + res.error);
      if (res.ok) await reload();
    };
  }

  if (pageId === 'needsreview') {
    document.querySelectorAll('.nr-resolve').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('tr');
        const res = await apiCall('resolveNeedsReview', {
          rowId: row.dataset.rowid,
          correctedSheetRowName: row.querySelector('.nr-fix').value
        });
        if (res.ok) await reload(); else alert('Error: ' + res.error);
      };
    });
  }

  if (pageId === 'receiving') {
    document.querySelectorAll('.rcv-btn').forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest('tr');
        const statusEl = btn.closest('.model-block').querySelector('.rcv-status');
        const input = tr.querySelector('.rcv-qty');
        const qty = Number(input.value);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many are on the floor.'; return; }

        btn.disabled = true;
        btn.innerText = 'Saving…';
        const res = await apiCall('recordReceipt', { rowId: btn.dataset.rowid, qty });
        if (res.ok) {
          await reload();
        } else {
          statusEl.innerText = res.error || 'Could not save.';
          btn.disabled = false;
          btn.innerText = 'Receive';
        }
      };
    });
  }

  if (pageId === 'assembly') {
    document.querySelectorAll('.asm-btn').forEach(btn => {
      btn.onclick = async () => {
        const block = btn.closest('.model-block');
        const statusEl = block.querySelector('.asm-status');
        const qty = Number(block.querySelector('.asm-qty').value);
        const max = Number(btn.dataset.max);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many units to build.'; return; }
        if (qty > max) { statusEl.innerText = 'Only ' + max + ' can be built from the parts on hand.'; return; }

        btn.disabled = true;
        btn.innerText = 'Building…';
        const res = await apiCall('recordBuild', { groupKey: btn.dataset.groupkey, qty, remarks: '' });
        if (res.ok) {
          await reload();
        } else {
          statusEl.innerText = res.error || 'Could not save.';
          btn.disabled = false;
          btn.innerText = 'Build units';
        }
      };
    });
  }

  if (pageId === 'delivery') {
    document.querySelectorAll('.dlv-btn').forEach(btn => {
      btn.onclick = async () => {
        const block = btn.closest('.model-block');
        const statusEl = block.querySelector('.dlv-status');
        const qty = Number(block.querySelector('.dlv-qty').value);
        const customerCode = block.querySelector('.dlv-cust').value;
        const max = Number(btn.dataset.max);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many units are going out.'; return; }
        if (qty > max) { statusEl.innerText = 'Only ' + max + ' built unit(s) are waiting to go out.'; return; }

        btn.disabled = true;
        btn.innerText = 'Sending…';
        const res = await apiCall('markOut', { groupKey: btn.dataset.groupkey, customerCode, qty });
        if (res.ok) {
          await reload();
        } else {
          statusEl.innerText = res.error || 'Could not save.';
          btn.disabled = false;
          btn.innerText = 'Mark out';
        }
      };
    });

    document.querySelectorAll('.cfm-btn').forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest('tr');
        const statusEl = document.getElementById('cfm-status');
        const confirmedQty = Number(tr.querySelector('.cfm-qty').value);
        btn.disabled = true;
        btn.innerText = 'Saving…';
        const res = await apiCall('confirmDelivery', { deliveryId: btn.dataset.deliveryid, confirmedQty });
        if (res.ok) {
          await reload();
        } else {
          if (statusEl) { statusEl.classList.remove('hidden'); statusEl.innerText = res.error || 'Could not save.'; }
          btn.disabled = false;
          btn.innerText = 'Confirm';
        }
      };
    });
  }

  if (pageId === 'reports') {
    document.getElementById('rp-filter').onclick = async () => {
      const search = document.getElementById('rp-search').value;
      const res = await apiCall('getReports', { search });
      document.getElementById('rp-body').innerHTML = res.ok ? reportRows(res.events) : `<tr><td colspan="6">Error: ${esc(res.error)}</td></tr>`;
    };
  }
}

</script>
