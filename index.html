<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assembix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"
onerror="handleGsiLoadError()"></script>
<style>
:root{
--primary:#F97316;
--primary-dark:#C2410C;
--secondary:#A8877D;
--accent:#FDBA74;
--dark:#7C2D12;
--dark-2:#9A3412;
--bg-page:#FFF4EC;
--surface:#FFFFFF;
--border:#F3DCC9;
--text:#431407;
--text-soft:#8B6F5E;
--text-faint:#D9BBA5;
--success:#15803D;
--success-bg:#DCFCE7;
--warning:#B45309;
--warning-bg:#FEF3C7;
--danger:#B91C1C;
--danger-bg:#FEE2E2;
--info:#1D4ED8;
--info-bg:#DBEAFE;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--bg-page);
font-family:"IBM Plex Sans",system-ui,sans-serif;
color:var(--text);
min-height:100vh;
}
h1,h2,h3,.brand-word,.btn,.nav-item,.content-h,.stat-value{font-family:"Plus Jakarta Sans",sans-serif;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.hidden{display:none !important;}

/* ===== LOGIN ===== */
.login-screen{
min-height:100vh;
display:flex;align-items:center;justify-content:center;
padding:24px;
background-image:
linear-gradient(rgba(67,20,7,0.72), rgba(67,20,7,0.86)),
url('login-bg.jpg');
background-size:cover;
background-position:center;
}
.login-card{
background:var(--surface);
border-radius:18px;
padding:36px 32px;
width:100%;max-width:400px;
box-shadow:0 24px 60px rgba(67,20,7,0.35);
text-align:center;
}
.login-card .brand{justify-content:center;margin-bottom:22px;}
.login-card h2{font-weight:800;font-size:20px;margin:0 0 6px;color:var(--dark);}
.login-card p{margin:0 0 24px;color:var(--text-soft);font-size:13.5px;line-height:1.6;}
#g_id_signin{display:flex;justify-content:center;}
#login-status{margin-top:16px;font-size:12.5px;color:var(--text-soft);min-height:18px;}

/* ===== APP SHELL ===== */
.app-shell{display:flex;align-items:stretch;min-height:100vh;}
.sidebar{
width:214px;flex-shrink:0;background:var(--dark);
display:flex;flex-direction:column;padding:20px 14px;gap:22px;
position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
width:32px;height:32px;flex-shrink:0;border-radius:9px;background:var(--primary);
display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
font-family:"Plus Jakarta Sans",sans-serif;
}
.brand-word{font-weight:800;font-size:17px;letter-spacing:0.02em;color:#FFF7ED;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-label{
font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;
color:#B98A6E;padding:12px 10px 5px;font-weight:700;
}
.nav-item{
display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
color:#EAD5C8;font-size:13.5px;font-weight:500;cursor:pointer;
text-decoration:none;transition:0.15s ease;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.who{padding:0 10px;font-size:12px;color:#C8A18A;line-height:1.4;}
.who b{display:block;color:#FFF7ED;font-size:13px;font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
background:var(--surface);border-bottom:1px solid var(--border);
padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.content-h{font-weight:700;font-size:19px;color:var(--dark);margin:0;}
.content-sub{font-size:13px;color:var(--text-soft);margin:3px 0 0;}
.content{padding:28px;flex:1;}

/* ===== COMPONENTS ===== */
.btn{
border:1px solid var(--border);background:var(--surface);color:var(--text);
padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
display:inline-flex;align-items:center;gap:7px;transition:0.15s ease;white-space:nowrap;
}
.btn:hover{background:#FFF7ED;border-color:var(--accent);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}

.card{
background:var(--surface);border:1px solid var(--border);border-radius:13px;
padding:20px;box-shadow:0 1px 3px rgba(124,45,18,0.04);
}
.card + .card{margin-top:18px;}
.card-h{font-weight:700;font-size:15px;color:var(--dark);margin:0 0 4px;font-family:"Plus Jakarta Sans",sans-serif;}
.card-sub{font-size:12.5px;color:var(--text-soft);margin:0 0 16px;line-height:1.5;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);font-weight:600;}
.stat-value{font-size:26px;font-weight:800;color:var(--dark);margin-top:5px;line-height:1;}
.stat-note{font-size:12px;color:var(--text-soft);margin-top:6px;}

label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
color:var(--text-soft);margin-bottom:6px;}
input,select,textarea{
width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(249,115,22,0.13);}
.field{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;}

.chip{
display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
font-size:11.5px;font-weight:600;border:1px solid transparent;
}
.chip-ok{background:var(--success-bg);color:var(--success);}
.chip-warn{background:var(--warning-bg);color:var(--warning);}
.chip-bad{background:var(--danger-bg);color:var(--danger);}
.chip-info{background:var(--info-bg);color:var(--info);}
.chip-idle{background:#F5EBE3;color:var(--text-soft);}

table{width:100%;border-collapse:collapse;}
th{
text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);font-weight:700;
}
td{padding:12px;border-bottom:1px solid #F8EDE4;font-size:13.5px;}
tbody tr:last-child td{border-bottom:none;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
font-size:12.5px;font-weight:600;color:var(--text-soft);cursor:pointer;transition:0.15s ease;
}
.tab:hover{border-color:var(--accent);color:var(--text);}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.empty{
border:1px dashed var(--border);border-radius:12px;padding:44px 20px;text-align:center;
color:var(--text-soft);font-size:13.5px;background:#FFFBF7;
}
.note{
background:#FFF7ED;border:1px solid var(--border);border-radius:10px;
padding:12px 15px;font-size:12.5px;color:var(--text-soft);line-height:1.55;
}
.note b{color:var(--text);}

.spinner{
width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);
border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;
}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-soft);font-size:13.5px;}
@keyframes spin{to{transform:rotate(360deg);}}
#login-status .spinner{margin-bottom:8px;}

@media (max-width:820px){
.app-shell{flex-direction:column;}
.sidebar{width:100%;height:auto;position:static;flex-direction:column;}
.nav{flex-direction:row;flex-wrap:wrap;}
.nav-item{width:auto;}
.nav-label{display:none;}
.sidebar-foot{margin-top:14px;}
.content{padding:18px;}
.topbar{padding:14px 18px;}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="scr-login" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-word" style="color:var(--dark)">Assembix</div>
    </div>
    <h2>Sign in</h2>
    <p>Use your authorised Google account to continue.</p>
    <div id="g_id_signin"></div>
    <div id="login-status"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app-shell hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-word">Assembix</div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="who"><b id="who-name">—</b><span id="who-role">—</span></div>
      <button class="nav-item" onclick="doLogout()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 class="content-h" id="page-title">Dashboard</h1>
        <p class="content-sub" id="page-sub"></p>
      </div>
      <div id="page-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* Fill APPS_SCRIPT_URL after deploying the Assembix Apps Script project. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDAt4paCuEsZ0HZG4eWyWAMX_AVevyEBNVdUPyM6t6EJoMi8r1fpEc-R3epfe5XmMv/exec";
const GOOGLE_CLIENT_ID = "766825494798-2vq54u2u9kmfegir98uig2ubr9gr6hj4.apps.googleusercontent.com";

const PAGES = [
  { id: 'dashboard',    label: 'Dashboard',     group: 'Overview',  sub: 'Where everything stands right now.' },
  { id: 'consignments', label: 'Consignments',  group: 'Incoming',  sub: 'Everything on its way from China Master, soonest arrival first.' },
  { id: 'receiving',    label: 'Receiving',     group: 'Warehouse', sub: 'Record what actually turned up, part by part.' },
  { id: 'assembly',     label: 'Assembly',      group: 'Warehouse', sub: 'Parts on hand, and how many complete units they make.' },
  { id: 'delivery',     label: 'Delivery',      group: 'Output',    sub: 'Units out to FR and BB, counted against what each is owed.' },
  { id: 'needsreview',  label: 'Needs review',  group: 'Output',    sub: "Lines from China Master that couldn't be read automatically." },
  { id: 'reports',      label: 'Reports',       group: 'Output',    sub: 'Every event per consignment and part, filterable.' },
  { id: 'models',       label: 'Models & parts', group: 'Setup',    sub: 'Sync China Master from Dropbox, and define each model\'s parts.' }
];

let idToken = localStorage.getItem('assembix_idToken') || null;
let user = null;
let currentPage = 'dashboard';
let cache = { models: [], customers: [] }; // small lookups reused across pages

// Apps Script round-trips are inherently a couple seconds (cold execution +
// opening the spreadsheet) — that latency can't be removed client-side. What
// we CAN fix is the perceived wait: cache each page's last-rendered HTML and
// paint it instantly on revisit, then quietly refetch and swap in the real
// thing underneath. First-ever visit to a page still shows the spinner.
let pageCache = {};

// Google ID tokens are only valid for about an hour. On a long working day a
// tab left open will start failing, and the old behaviour was to keep firing
// requests with no token and surface the backend's "Missing idToken" as if it
// were a data problem. Instead: detect an expired session and ask the user to
// sign in again, once, without losing the page they were on.
let sessionExpired = false;

function handleSessionExpiry() {
  if (sessionExpired) return;
  sessionExpired = true;
  idToken = null;
  localStorage.removeItem('assembix_idToken');
  user = null;
  groupCache = { data: null, at: 0 };
  pageCache = {};

  const app = document.getElementById('app');
  const login = document.getElementById('scr-login');
  if (app) app.classList.add('hidden');
  if (login) {
    login.classList.remove('hidden');
    const statusEl = document.getElementById('login-status');
    if (statusEl) statusEl.innerText = 'Your session expired. Please sign in again.';
  }
  try {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.disableAutoSelect();
      google.accounts.id.prompt();
    }
  } catch (e) { /* the sign-in button is still on screen regardless */ }
}

const AUTH_ERRORS = ['Missing idToken', 'Email not allowlisted or invalid token', 'User is not active'];

async function apiCall(action, payload = {}) {
  if (!idToken) { handleSessionExpiry(); return { ok: false, error: 'Session expired', authFailed: true }; }
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, idToken, ...payload })
    });
    const data = await res.json();
    if (!data.ok && AUTH_ERRORS.indexOf(String(data.error)) !== -1) {
      handleSessionExpiry();
      return { ok: false, error: 'Session expired', authFailed: true };
    }
    return data;
  } catch (e) {
    return { ok: false, error: 'Could not reach the server. Check your connection and try again.' };
  }
}

/* =========================
   AUTH
   ========================= */

function initGoogleSignIn() {
  if (typeof google === 'undefined') { handleGsiLoadError(); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large', width: 260 });
  if (idToken) completeLogin();
  else google.accounts.id.prompt();
}

function handleGsiLoadError() {
  document.getElementById('login-status').innerText = "Could not load Google Sign-In. The page must be served over https:// with a working connection.";
}

function handleCredentialResponse(response) {
  sessionExpired = false;
  idToken = response.credential;
  localStorage.setItem('assembix_idToken', idToken);
  completeLogin();
}

let bootstrapDashboard = null; // dashboard data fetched during login, reused for first paint

async function completeLogin() {
  const statusEl = document.getElementById('login-status');
  statusEl.innerHTML = `<div class="spinner"></div>Signing you in…`;
  try {
    // One round-trip for user + models + customers + dashboard.
    const result = await apiCall('bootstrap');
    if (!result.ok) {
      // Most common cause here: a stale/expired saved token. Clear it and
      // send the user back to a fresh sign-in instead of showing a blank app.
      statusEl.innerText = result.error || "Authorization failed";
      idToken = null;
      localStorage.removeItem('assembix_idToken');
      if (google && google.accounts) google.accounts.id.prompt();
      return;
    }

    user = result.user;
    cache.models = result.models || [];
    cache.customers = result.customers || [];
    bootstrapDashboard = result.dashboard || null;

    statusEl.innerText = "";
    document.getElementById('scr-login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('who-name').innerText = user.name;
    document.getElementById('who-role').innerText = roleLabel(user.level);

    renderNav();
    window.addEventListener('hashchange', route);
    await route();
    prefetchPages(); // warm the rest in the background — navigation then feels instant
  } catch (e) {
    // Network/parse failure — don't leave a blank screen. Reset to login.
    statusEl.innerText = "Could not reach the server. Try signing in again.";
    idToken = null;
    localStorage.removeItem('assembix_idToken');
    if (google && google.accounts) google.accounts.id.prompt();
  }
}

function roleLabel(level) {
  if (level === 0) return 'Director';
  if (level === 1) return 'Manager';
  return 'Staff';
}

function doLogout() {
  idToken = null;
  localStorage.removeItem('assembix_idToken');
  user = null;
  google.accounts.id.disableAutoSelect();
  location.reload();
}

/* =========================
   SHELL
   ========================= */

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = "";
  let lastGroup = null;
  PAGES.forEach(p => {
    if (p.group !== lastGroup) {
      nav.insertAdjacentHTML('beforeend', `<div class="nav-label">${p.group}</div>`);
      lastGroup = p.group;
    }
    nav.insertAdjacentHTML('beforeend', `<a class="nav-item${p.id === currentPage ? ' active' : ''}" href="#/${p.id}">${p.label}</a>`);
  });
}

async function route() {
  if (!user || !idToken) return;
  const id = window.location.hash.replace(/^#\/?/, '') || 'dashboard';
  const page = PAGES.find(p => p.id === id);
  if (!page) { window.location.hash = '#/dashboard'; return; }

  currentPage = page.id;
  document.getElementById('page-title').innerText = page.label;
  document.getElementById('page-sub').innerText = page.sub;
  document.getElementById('page-actions').innerHTML =
    `<button class="btn btn-sm" id="page-refresh" title="Fetch the latest data">Refresh</button>`;
  const refreshBtn = document.getElementById('page-refresh');
  if (refreshBtn) {
    refreshBtn.onclick = async () => {
      refreshBtn.disabled = true;
      refreshBtn.innerText = 'Refreshing…';
      invalidateGroups();
      await route();
    };
  }
  renderNav();

  const content = document.getElementById('content');
  const renderer = RENDERERS[page.id];
  const requestedPage = page.id; // guard against a slow fetch landing after the user has moved on

  const cached = pageCache[requestedPage];
  if (cached) {
    // Instant paint of what we last knew, wired up and clickable right away.
    content.innerHTML = cached;
    wirePageHandlers(requestedPage);
  } else {
    content.innerHTML = `<div class="loading-wrap"><div class="spinner"></div>Loading…</div>`;
  }

  const html = renderer ? await renderer() : '';
  if (currentPage !== requestedPage) return; // user already navigated elsewhere — drop this response

  content.innerHTML = html;
  pageCache[requestedPage] = html;
  wirePageHandlers(requestedPage);
  prefetchPages(); // keep the other pages warm as the user moves around
}

async function refreshModels() {
  const res = await apiCall('listModels');
  if (res.ok) cache.models = res.models;
}
async function refreshCustomers() {
  const res = await apiCall('listCustomers');
  if (res.ok) cache.customers = res.customers;
}

function chip(status) {
  const map = {
    'Fully Pending': 'chip-idle', 'Partial Pending': 'chip-warn', 'Assembly Pending': 'chip-info',
    'Ready to Deliver': 'chip-info', 'Delivered': 'chip-ok', 'Delivery discrepancy': 'chip-bad'
  };
  let cls = map[status];
  if (!cls) cls = status.indexOf('Towards') === 0 ? 'chip-warn' : 'chip-idle';
  return `<span class="chip ${cls}">${status}</span>`;
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* =========================
   DASHBOARD
   ========================= */

async function renderDashboard() {
  // The dashboard is built from the same group data the warehouse pages use,
  // so opening it warms the cache for Receiving, Assembly and Delivery too.
  let groups, dash;
  try {
    const dashPromise = bootstrapDashboard
      ? Promise.resolve(bootstrapDashboard)
      : apiCall('getDashboard');
    bootstrapDashboard = null;
    [groups, dash] = await Promise.all([getGroups(), dashPromise]);
  } catch (e) {
    return `<div class="empty">Could not load dashboard: ${esc(e.message)}</div>`;
  }
  if (!dash.ok) return `<div class="empty">Could not load dashboard: ${esc(dash.error)}</div>`;

  if (!groups.length) {
    return `<div class="empty" style="padding:60px 24px;">
      <div style="font-size:15px;color:var(--text);font-weight:600;margin-bottom:8px;">Nothing loaded yet</div>
      Sync China Master from the <a href="#/models">Models &amp; parts</a> page to pull consignments in from Dropbox.
    </div>`;
  }

  const buildableNow = groups.reduce((s, g) => s + g.buildableUnits, 0);
  const readyToSend  = groups.reduce((s, g) => s + Math.max(0, g.totalBuilt - g.totalOut), 0);
  const awaitingParts = groups.filter(g => g.parts.some(p => p.qtyReceived > 0) && g.buildableUnits <= 0).length;

  // Arrivals inside a fortnight — the number that decides warehouse planning.
  const upcoming = groups
    .filter(g => g.nextEta)
    .map(g => ({ g, rel: relDays(g.nextEta) }))
    .filter(x => x.rel && x.rel.days >= -3 && x.rel.days <= 21)
    .sort((a, b) => a.rel.days - b.rel.days);

  const demand = { FR: 0, BB: 0 }, confirmed = { FR: 0, BB: 0 };
  groups.forEach(g => {
    demand.FR += g.frQty || 0; demand.BB += g.bbQty || 0;
    ['FR','BB'].forEach(c => { const d = g.deliveredTo && g.deliveredTo[c]; if (d) confirmed[c] += d.confirmed; });
  });

  const s = dash.stats;

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat"><div class="stat-label">Can build now</div>
        <div class="stat-value" style="color:${buildableNow ? 'var(--success)' : 'var(--dark)'};">${buildableNow}</div>
        <div class="stat-note">complete units from parts on hand</div></div>
      <div class="stat"><div class="stat-label">Ready to send</div>
        <div class="stat-value">${readyToSend}</div><div class="stat-note">built, not yet out</div></div>
      <div class="stat"><div class="stat-label">Waiting on parts</div>
        <div class="stat-value" style="color:${awaitingParts ? 'var(--warning)' : 'var(--dark)'};">${awaitingParts}</div>
        <div class="stat-note">partly arrived, blocked</div></div>
      <div class="stat"><div class="stat-label">Arriving in 3 weeks</div>

/* =========================
   SHARED CONSIGNMENT DATA
   Receiving, Assembly and Delivery are three views of the same underlying
   group data, so they share one fetch. Navigating between them after the
   first load is instant instead of a fresh 2-4s Apps Script round-trip.
   ========================= */

let groupCache = { data: null, at: 0 };
const GROUP_TTL = 45 * 1000;

async function getGroups(force) {
  const fresh = groupCache.data && (Date.now() - groupCache.at < GROUP_TTL);
  if (fresh && !force) return groupCache.data;
  const res = await apiCall('listConsignments');
  if (!res.ok) throw new Error(res.error || 'Could not load consignments');
  groupCache = { data: res.consignments, at: Date.now() };
  return res.consignments;
}
function invalidateGroups() {
  groupCache = { data: null, at: 0 };
  pageCache = {};
  bootstrapDashboard = null;
}

function fmtDay(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}

// How far away a date is, in plain words, so staff can plan around it
// without doing arithmetic in their heads.
function relDays(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const then = new Date(d); then.setHours(0, 0, 0, 0);
  const days = Math.round((then - today) / 86400000);
  if (days === 0) return { days, text: 'today', cls: 'chip-warn' };
  if (days === 1) return { days, text: 'tomorrow', cls: 'chip-warn' };
  if (days > 1) return { days, text: 'in ' + days + ' days', cls: days <= 7 ? 'chip-warn' : 'chip-idle' };
  if (days === -1) return { days, text: 'yesterday', cls: 'chip-info' };
  return { days, text: Math.abs(days) + ' days ago', cls: 'chip-info' };
}

function importChip(status) {
  const map = {
    'Production': 'chip-idle', 'Loaded': 'chip-info', 'F-Bank': 'chip-info',
    'L-Bank': 'chip-info', 'Clearance': 'chip-warn', 'Received': 'chip-ok'
  };
  return `<span class="chip ${map[status] || 'chip-idle'}">${esc(status || '—')}</span>`;
}

async function renderReceiving() {
  let groups;
  try { groups = await getGroups(); }
  catch (e) { return `<div class="empty">Could not load: ${esc(e.message)}</div>`; }
  if (!groups.length) return `<div class="empty">Nothing to receive yet — sync China Master first.</div>`;

  groups.sort((a, b) => {
    const ax = a.nextEta ? new Date(a.nextEta).getTime() : Infinity;
    const bx = b.nextEta ? new Date(b.nextEta).getTime() : Infinity;
    return ax - bx;
  });

  const cards = groups.map(g => {
    const partRows = g.parts.map(p => {
      const rel = relDays(p.eta);
      const outstanding = Math.max(0, p.qtyExpected - p.qtyReceived);
      return `
        <tr data-rowid="${esc(p.rowId || '')}">
          <td><b>Part ${esc(p.partLetter)}</b><div style="color:var(--text-soft);font-size:11.5px;">${esc(p.partName)}</div></td>
          <td>${importChip(p.importStatus)}</td>
          <td>${esc(fmtDay(p.eta))}${rel ? ` <span class="chip ${rel.cls}">${esc(rel.text)}</span>` : ''}</td>
          <td style="text-align:right;">${p.qtyExpected || '—'}</td>
          <td style="text-align:right;"><b>${p.qtyReceived}</b></td>
          <td style="text-align:right;${outstanding > 0 ? 'color:var(--warning);font-weight:600;' : ''}">${outstanding || '—'}</td>
          <td style="white-space:nowrap;">
            <input type="number" min="1" class="rcv-qty" placeholder="qty" style="width:92px;display:inline-block;">
            <button class="btn btn-sm rcv-btn" data-rowid="${esc(p.rowId || '')}" ${p.rowId ? '' : 'disabled'}>Receive</button>
          </td>
        </tr>`;
    }).join('');

    const rel = relDays(g.nextEta);
    return `
      <div class="card">
        <h3 class="card-h">${esc(g.consignmentGroup)} · ${esc(g.signatureModel || g.modelName)}</h3>
        <p class="card-sub">
          ${esc(g.supplier)} · ${esc(g.product || '—')} · target ${g.totalQty || '—'} units
          ${g.nextEta ? ` · next part arrives ${esc(fmtDay(g.nextEta))}${rel ? ` (${esc(rel.text)})` : ''}` : ''}
        </p>
        <table>
          <thead><tr>
            <th>Part</th><th>Import status</th><th>ETA</th>
            <th style="text-align:right;">Expected</th><th style="text-align:right;">Received</th>
            <th style="text-align:right;">Outstanding</th><th style="width:190px;">Record arrival</th>
          </tr></thead>
          <tbody>${partRows}</tbody>
        </table>
        <div class="rcv-status note hidden" style="margin-top:12px;"></div>
      </div>`;
  }).join('');

  return `
    <div class="note" style="margin-bottom:18px;">
      <b>This is the one page where your team types.</b> When a shipment lands, enter how many
      of that part actually arrived. Everything else on the site is calculated from these numbers.
      Quantities add up, so recording 50 then 30 gives 80 — they are never overwritten by a Dropbox sync.
    </div>
    ${cards}`;
}

async function renderAssembly() {
  let groups;
  try { groups = await getGroups(); }
  catch (e) { return `<div class="empty">Could not load: ${esc(e.message)}</div>`; }

  const active = groups.filter(g => g.parts.some(p => p.qtyReceived > 0));
  const buildable = active.filter(g => g.buildableUnits > 0);
  const blocked = active.filter(g => g.buildableUnits <= 0);

  if (!active.length) {
    return `<div class="empty">Nothing to assemble yet. Record some arrivals on the
      <a href="#/receiving">Receiving</a> page and buildable units will appear here.</div>`;
  }

  const partBar = p => {
    const units = Math.floor(p.qtyReceived / (p.qtyPerUnit || 1));
    return `
      <div style="border:1px solid var(--border);border-radius:10px;padding:12px;">
        <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);font-weight:700;">Part ${esc(p.partLetter)}</div>
        <div style="font-size:22px;font-weight:800;color:var(--dark);margin-top:4px;line-height:1;">${p.qtyReceived}</div>
        <div style="font-size:11.5px;color:var(--text-soft);margin-top:5px;">on hand → ${units} unit${units === 1 ? '' : 's'}</div>
      </div>`;
  };

  const card = g => {
    const canBuild = g.buildableUnits > 0;
    const blockMsg = g.blockingPart
      ? `Held up by <b>part ${esc(g.blockingPart.partLetter)}</b> — ${g.blockingPart.shortfallUnits} more unit${g.blockingPart.shortfallUnits === 1 ? '' : 's'} worth would unlock the rest.`
      : 'Waiting on parts to arrive.';

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
          <div>
            <h3 class="card-h">${esc(g.consignmentGroup)} · ${esc(g.signatureModel || g.modelName)}</h3>
            <p class="card-sub" style="margin-bottom:0;">${esc(g.supplier)} · ${esc(g.product || '—')} · ${g.totalBuilt} built so far</p>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);font-weight:700;">Can build now</div>
            <div style="font-size:30px;font-weight:800;line-height:1;color:${canBuild ? 'var(--success)' : 'var(--text-soft)'};">${g.buildableUnits}</div>
          </div>
        </div>

        <div class="grid grid-4" style="margin:16px 0;">${g.parts.map(partBar).join('')}</div>

        ${canBuild ? `
          <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:0 0 150px;">
              <label>Units to build</label>
              <input type="number" class="asm-qty" min="1" max="${g.buildableUnits}" value="${g.buildableUnits}">
            </div>
            <button class="btn btn-primary asm-btn" data-group="${esc(g.consignmentGroup)}" data-max="${g.buildableUnits}">Build units</button>
          </div>
        ` : `<div class="note">${blockMsg}</div>`}
        <div class="asm-status note hidden" style="margin-top:12px;"></div>
      </div>`;
  };

  const totalBuildable = buildable.reduce((s, g) => s + g.buildableUnits, 0);

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat"><div class="stat-label">Ready to build</div><div class="stat-value">${totalBuildable}</div><div class="stat-note">units, across ${buildable.length} consignment${buildable.length === 1 ? '' : 's'}</div></div>
      <div class="stat"><div class="stat-label">Waiting on parts</div><div class="stat-value">${blocked.length}</div><div class="stat-note">partly arrived, can't build yet</div></div>
      <div class="stat"><div class="stat-label">Built to date</div><div class="stat-value">${active.reduce((s, g) => s + g.totalBuilt, 0)}</div><div class="stat-note">complete units</div></div>
    </div>

    ${buildable.length ? `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin:0 0 12px;">Ready to build</h3>${buildable.map(card).join('')}` : ''}
    ${blocked.length ? `<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin:26px 0 12px;">Waiting on parts</h3>${blocked.map(card).join('')}` : ''}`;
}

async function renderDelivery() {
  let groups, delRes;
  try {
    [groups, delRes] = await Promise.all([getGroups(), apiCall('listDeliveries')]);
  } catch (e) { return `<div class="empty">Could not load: ${esc(e.message)}</div>`; }

  const deliveries = (delRes && delRes.ok) ? delRes.deliveries : [];

  // Demand comes straight from China Master's FR / BB columns.
  const demand = { FR: 0, BB: 0 }, sent = { FR: 0, BB: 0 }, confirmed = { FR: 0, BB: 0 };
  groups.forEach(g => {
    demand.FR += g.frQty || 0;
    demand.BB += g.bbQty || 0;
    ['FR', 'BB'].forEach(c => {
      const d = g.deliveredTo && g.deliveredTo[c];
      if (d) { sent[c] += d.out; confirmed[c] += d.confirmed; }
    });
  });

  const custCard = c => {
    const owed = Math.max(0, demand[c] - confirmed[c]);
    const pct = demand[c] ? Math.min(100, Math.round((confirmed[c] / demand[c]) * 100)) : 0;
    return `
      <div class="card">
        <h3 class="card-h">${c}</h3>
        <p class="card-sub">Demand taken from China Master, so it updates itself on every sync.</p>
        <div style="height:9px;background:#F5EBE3;border-radius:999px;overflow:hidden;margin-bottom:14px;">
          <div style="height:100%;width:${pct}%;background:var(--success);"></div>
        </div>
        <div class="grid grid-3">
          <div><div class="stat-label">Owed</div><div class="stat-value">${demand[c]}</div></div>
          <div><div class="stat-label">Sent</div><div class="stat-value">${sent[c]}</div></div>
          <div><div class="stat-label">Still to go</div><div class="stat-value" style="color:${owed ? 'var(--warning)' : 'var(--success)'};">${owed}</div></div>
        </div>
      </div>`;
  };

  const ready = groups.filter(g => g.totalBuilt - g.totalOut > 0);
  const readyCards = ready.length ? ready.map(g => {
    const available = g.totalBuilt - g.totalOut;
    return `
      <div class="card">
        <h3 class="card-h">${esc(g.consignmentGroup)} · ${esc(g.signatureModel || g.modelName)}</h3>
        <p class="card-sub">${available} built unit${available === 1 ? '' : 's'} ready to send. FR needs ${g.frQty || 0}, BB needs ${g.bbQty || 0}.</p>
        <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
          <div style="flex:0 0 130px;">
            <label>Customer</label>
            <select class="dlv-cust"><option value="FR">FR</option><option value="BB">BB</option></select>
          </div>
          <div style="flex:0 0 130px;">
            <label>Units out</label>
            <input type="number" class="dlv-qty" min="1" max="${available}" value="${available}">
          </div>
          <button class="btn btn-primary dlv-btn" data-group="${esc(g.consignmentGroup)}" data-max="${available}">Mark out</button>
        </div>
        <div class="dlv-status note hidden" style="margin-top:12px;"></div>
      </div>`;
  }).join('') : `<div class="empty">No built units waiting to go out. Build some on the <a href="#/assembly">Assembly</a> page.</div>`;

  const pending = deliveries.filter(d => d.Status === 'pending');
  const pendingTable = pending.length ? `
    <div class="card">
      <h3 class="card-h">Awaiting customer confirmation</h3>
      <p class="card-sub">Sent out but not yet confirmed received. Until FR and BB get their own portals, your team confirms on their behalf.</p>
      <table>
        <thead><tr><th>Consignment</th><th>Customer</th><th style="text-align:right;">Sent</th><th>When</th><th style="width:230px;">Confirm received</th></tr></thead>
        <tbody>
          ${pending.map(d => `
            <tr data-deliveryid="${esc(d.DeliveryID)}">
              <td><code>${esc(d.ConsignmentGroup)}</code></td>
              <td><b>${esc(d.CustomerCode)}</b></td>
              <td style="text-align:right;">${esc(d.QtyOut)}</td>
              <td>${esc(fmtDay(d.Timestamp))}</td>
              <td style="white-space:nowrap;">
                <input type="number" class="cfm-qty" min="0" value="${esc(d.QtyOut)}" style="width:92px;display:inline-block;">
                <button class="btn btn-sm cfm-btn" data-deliveryid="${esc(d.DeliveryID)}">Confirm</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div id="cfm-status" class="note hidden" style="margin-top:12px;"></div>
    </div>` : '';

  return `
    <div class="grid grid-2" style="margin-bottom:18px;">${custCard('FR')}${custCard('BB')}</div>
    <h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-soft);margin:0 0 12px;">Ready to send</h3>
    ${readyCards}
    ${pendingTable}`;
}

/* =========================
   NEEDS REVIEW
   ========================= */

async function renderNeedsReview() {
  const res = await apiCall('getNeedsReview');
  if (!res.ok) return `<div class="empty">Could not load: ${esc(res.error)}</div>`;
  if (!res.rows.length) return `<div class="empty">Nothing needs review.</div>`;
  return `
    <div class="card">
      <h3 class="card-h">Unresolved rows</h3>
      <p class="card-sub">These didn't match a known sheet code + part letter, or had no hyphen to split on. Correct the name to resolve.</p>
      <table>
        <thead><tr><th>Original name</th><th>Reason</th><th>Corrected name</th><th></th></tr></thead>
        <tbody>
          ${res.rows.map(r => `
            <tr data-rowid="${esc(r.RowID)}">
              <td><code>${esc(r.SheetRowName)}</code></td>
              <td style="color:var(--warning);">${esc(r.ReviewReason)}</td>
              <td><input type="text" class="nr-fix" placeholder="e.g. Careline-3A" style="max-width:180px;"></td>
              <td><button class="btn btn-sm nr-resolve">Resolve</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* =========================
   REPORTS
   ========================= */

async function renderReports() {
  const res = await apiCall('getReports', {});
  if (!res.ok) return `<div class="empty">Could not load: ${esc(res.error)}</div>`;
  return `
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <input id="rp-search" type="text" placeholder="Search consignment, part or event" style="max-width:280px;">
        <button class="btn" id="rp-filter">Search</button>
      </div>
      <table>
        <thead><tr><th>When</th><th>Consignment</th><th>Part</th><th>Event</th><th>Qty</th><th>By</th></tr></thead>
        <tbody id="rp-body">
          ${reportRows(res.events)}
        </tbody>
      </table>
    </div>`;
}

function reportRows(events) {
  if (!events.length) return `<tr><td colspan="6" style="color:var(--text-soft);padding:22px 12px;">No events logged.</td></tr>`;
  return events.map(e => `<tr><td>${esc(fmtDate(e.Timestamp))}</td><td>${esc(e.ConsignmentGroup)}</td><td>${esc(e.PartLetter)}</td><td>${esc(e.EventType)}</td><td>${esc(e.Qty)}</td><td>${esc(e.User)}</td></tr>`).join('');
}

/* =========================
   PREFETCH
   Apps Script round-trips are 2-4s and that latency cannot be removed from
   the client side. What can be removed is the *waiting*: once the first page
   is on screen, quietly render the others into pageCache so switching pages
   is instant. Runs one at a time so it never competes with a click the user
   actually made.
   ========================= */

let prefetching = false;

async function prefetchPages() {
  if (prefetching || !user || !idToken) return;
  prefetching = true;
  try {
    for (const id of ['consignments', 'receiving', 'assembly', 'delivery']) {
      if (pageCache[id]) continue;
      if (currentPage === id) continue;
      try {
        const html = await RENDERERS[id]();
        pageCache[id] = html;
      } catch (e) { /* a failed prefetch is invisible — the page just loads normally */ }
    }
  } finally {
    prefetching = false;
  }
}

/* =========================
   RENDERERS MAP
   ========================= */

const RENDERERS = {
  dashboard: renderDashboard,
  consignments: renderConsignments,
  receiving: renderReceiving,
  assembly: renderAssembly,
  delivery: renderDelivery,
  needsreview: renderNeedsReview,
  reports: renderReports,
  models: renderModels
};

/* =========================
   PAGE HANDLER WIRING
   (runs after each page's HTML is injected)
   ========================= */

function wirePageHandlers(pageId) {
  if (pageId === 'models') {
    const dbxSync = document.getElementById('dbx-sync-btn');
    const dbxCheck = document.getElementById('dbx-check-btn');
    const dbxStatus = () => document.getElementById('dbx-status');

    if (dbxCheck) {
      dbxCheck.onclick = async () => {
        const el = dbxStatus();
        dbxCheck.disabled = true;
        el.classList.remove('hidden');
        el.innerText = 'Checking…';
        const res = await apiCall('testDropbox');
        if (!res.ok) {
          el.innerText = "Couldn't reach the file. " + (res.error || '');
        } else {
          const when = res.modified ? new Date(res.modified).toLocaleString() : 'unknown';
          const last = res.lastSync ? new Date(res.lastSync).toLocaleString() : 'never';
          el.innerText = 'Connected. Found "' + res.name + '", last changed in Dropbox ' + when + '. Last sync: ' + last + '.';
        }
        dbxCheck.disabled = false;
      };
    }

    if (dbxSync) {
      dbxSync.onclick = async () => {
        const el = dbxStatus();
        dbxSync.disabled = true;
        dbxSync.innerText = 'Syncing…';
        el.classList.remove('hidden');
        el.innerText = 'Fetching China Master from Dropbox — this takes a few seconds.';

        const res = await apiCall('syncFromDropbox');
        if (!res.ok) {
          el.innerText = 'Sync failed: ' + (res.error || 'unknown error');
        } else {
          let msg = res.added + ' new row(s), ' + res.updated + ' updated.';
          if (res.needsReview > 0) {
            msg += ' ' + res.needsReview + " row(s) couldn't be read and are waiting in Needs review.";
          }
          if (res.skipped > 0) msg += ' ' + res.skipped + ' blank row(s) ignored.';
          el.innerText = msg;
          // Consignment data changed underneath every page — drop all caches
          // so the dashboard and boards re-fetch rather than showing stale counts.
          pageCache = {};
          bootstrapDashboard = null;
          await refreshModels();
        }
        dbxSync.disabled = false;
        dbxSync.innerText = 'Sync now';
      };
    }

    const seedBtn = document.getElementById('seed-sample-btn');
    if (seedBtn) {
      seedBtn.onclick = async () => {
        seedBtn.disabled = true;
        seedBtn.innerText = 'Loading…';
        const res = await apiCall('seedSampleData');
        const statusEl = document.getElementById('seed-sample-status');
        statusEl.classList.remove('hidden');
        if (!res.ok) {
          statusEl.innerText = 'Error: ' + res.error;
        } else if (res.alreadySeeded) {
          statusEl.innerText = res.message;
        } else {
          statusEl.innerText = `Loaded ${res.parsedCount} row(s). ${res.needsReviewCount} row(s) went to Needs Review.`;
        }
        seedBtn.disabled = false;
        seedBtn.innerText = 'Load sample data';
        await refreshModels();
        pageCache = {};            // sample data touches Models/ConsignmentRows/Dashboard
        bootstrapDashboard = null; // don't reuse the login-time snapshot — it predates the seed
        route();
      };
    }
    addModelPartRow('A', '', '', 1);
    document.getElementById('mdl-addpart').onclick = () => addModelPartRow();
    document.getElementById('mdl-save').onclick = async () => {
      const parts = [...document.querySelectorAll('#mdl-parts-table tbody tr')].map(row => {
        const inputs = row.querySelectorAll('input');
        return { partLetter: inputs[0].value, partName: inputs[1].value, partCodePrefix: inputs[2].value, qtyPerUnit: Number(inputs[3].value) || 1 };
      });
      const res = await apiCall('saveModel', {
        modelName: document.getElementById('mdl-name').value,
        sheetCode: document.getElementById('mdl-sheetcode').value,
        productLine: document.getElementById('mdl-line').value,
        parts
      });
      const statusEl = document.getElementById('mdl-status');
      statusEl.classList.remove('hidden');
      statusEl.innerText = res.ok ? 'Model saved.' : ('Error: ' + res.error);
      if (res.ok) { await refreshModels(); route(); }
    };
  }

  if (pageId === 'needsreview') {
    document.querySelectorAll('.nr-resolve').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('tr');
        const rowId = row.dataset.rowid;
        const corrected = row.querySelector('.nr-fix').value;
        const res = await apiCall('resolveNeedsReview', { rowId, correctedSheetRowName: corrected });
        if (res.ok) route(); else alert('Error: ' + res.error);
      };
    });
  }

  // Receiving: the one page where staff type. Each row records an arrival
  // against a specific packaging line.
  if (pageId === 'receiving') {
    document.querySelectorAll('.rcv-btn').forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest('tr');
        const card = btn.closest('.card');
        const statusEl = card.querySelector('.rcv-status');
        const input = tr.querySelector('.rcv-qty');
        const qty = Number(input.value);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many units arrived.'; return; }

        btn.disabled = true;
        const prev = btn.innerText;
        btn.innerText = 'Saving…';
        const res = await apiCall('recordReceipt', { rowId: btn.dataset.rowid, qty });
        if (res.ok) {
          statusEl.innerText = 'Recorded. ' + res.totalReceived + ' received in total for this part.';
          input.value = '';
          invalidateGroups();
          await route();
        } else {
          statusEl.innerText = 'Could not save: ' + (res.error || 'unknown error');
          btn.disabled = false;
          btn.innerText = prev;
        }
      };
    });
  }

  if (pageId === 'assembly') {
    document.querySelectorAll('.asm-btn').forEach(btn => {
      btn.onclick = async () => {
        const card = btn.closest('.card');
        const statusEl = card.querySelector('.asm-status');
        const qty = Number(card.querySelector('.asm-qty').value);
        const max = Number(btn.dataset.max);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many units to build.'; return; }
        if (qty > max) { statusEl.innerText = 'Only ' + max + ' can be built with the parts on hand.'; return; }

        btn.disabled = true;
        btn.innerText = 'Building…';
        const res = await apiCall('recordBuild', { consignmentGroup: btn.dataset.group, qty, remarks: '' });
        if (res.ok) {
          statusEl.innerText = qty + ' unit' + (qty === 1 ? '' : 's') + ' built.';
          invalidateGroups();
          await route();
        } else {
          statusEl.innerText = 'Could not save: ' + (res.error || 'unknown error');
          btn.disabled = false;
          btn.innerText = 'Build units';
        }
      };
    });
  }

  if (pageId === 'delivery') {
    document.querySelectorAll('.dlv-btn').forEach(btn => {
      btn.onclick = async () => {
        const card = btn.closest('.card');
        const statusEl = card.querySelector('.dlv-status');
        const qty = Number(card.querySelector('.dlv-qty').value);
        const customerCode = card.querySelector('.dlv-cust').value;
        const max = Number(btn.dataset.max);

        statusEl.classList.remove('hidden');
        if (!qty || qty <= 0) { statusEl.innerText = 'Enter how many units are going out.'; return; }
        if (qty > max) { statusEl.innerText = 'Only ' + max + ' built unit(s) are available.'; return; }

        btn.disabled = true;
        btn.innerText = 'Sending…';
        const res = await apiCall('markOut', { consignmentGroup: btn.dataset.group, customerCode, qty });
        if (res.ok) {
          statusEl.innerText = qty + ' unit(s) marked out to ' + customerCode + '.';
          invalidateGroups();
          await route();
        } else {
          statusEl.innerText = 'Could not save: ' + (res.error || 'unknown error');
          btn.disabled = false;
          btn.innerText = 'Mark out';
        }
      };
    });

    document.querySelectorAll('.cfm-btn').forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest('tr');
        const statusEl = document.getElementById('cfm-status');
        const confirmedQty = Number(tr.querySelector('.cfm-qty').value);
        btn.disabled = true;
        btn.innerText = 'Saving…';
        const res = await apiCall('confirmDelivery', { deliveryId: btn.dataset.deliveryid, confirmedQty });
        if (statusEl) statusEl.classList.remove('hidden');
        if (res.ok) {
          if (statusEl) {
            statusEl.innerText = res.status === 'discrepancy'
              ? 'Confirmed, but fewer units than were sent — flagged as a discrepancy.'
              : 'Delivery confirmed.';
          }
          invalidateGroups();
          await route();
        } else {
          if (statusEl) statusEl.innerText = 'Could not save: ' + (res.error || 'unknown error');
          btn.disabled = false;
          btn.innerText = 'Confirm';
        }
      };
    });
  }

  if (pageId === 'reports') {
    document.getElementById('rp-filter').onclick = async () => {
      const search = document.getElementById('rp-search').value;
      const res = await apiCall('getReports', { search });
      document.getElementById('rp-body').innerHTML = res.ok ? reportRows(res.events) : `<tr><td colspan="6">Error: ${esc(res.error)}</td></tr>`;
    };
  }
}

</script>
</body>
</html>
