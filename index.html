}
function countAssembly() { return groupsAll().filter(g => g.buildableUnits > 0).length; }
function countDelivery() { return groupsAll().filter(g => g.readyToSend > 0).length; }
function countAcceptance() { return (APP.deliveries || []).filter(d => d.Status === 'pending').length; }

/* ---------- Page headings ---------- */

const PAGE_HEAD = {
  dashboard: () => ({ title: 'Dashboard', sub: '' }),
  consignments: () => {
    const lines = []; groupsAll().forEach(g => allLinesOf(g).forEach(l => lines.push(l)));
    const coming = lines.filter(l => !l.cancelled && !l.factoryReceived && !l.receivedOnSheet).length;
    const late = lines.filter(l => l.overdue).length;
    const short = lines.filter(l => l.shortLoad && !l.factoryReceived).length;
    return { title: 'Consignments', sub: lines.length + ' lines in China Master · ' + coming + ' still to arrive' +
      (late ? ' · ' + late + ' late' : '') + (short ? ' · ' + short + ' short load' + (short === 1 ? '' : 's') : '') +
      ' · click any heading to sort' };
  },
  receiving: () => ({ title: 'Receiving', sub: 'Factory receive a line when it is physically on the floor. Nothing reaches Assembly without it.' }),
  assembly: () => ({ title: 'Assembly', sub: 'Only models you can build right now.' }),
  delivery: () => ({ title: 'Delivery', sub: 'Assembled units ready to go out to FR and BB.' }),
  acceptance: () => ({ title: 'Acceptance', sub: 'Units sent out, waiting for the customer to accept them.' }),
  needsreview: () => ({ title: 'Needs review', sub: 'Lines in China Master whose packaging code could not be read.' }),
  reports: () => ({ title: 'Reports', sub: 'Everything anyone has recorded.' }),
  activity: () => ({ title: 'Your activity', sub: 'Everything you have recorded, newest first.' }),
  tile: q => {
    const t = tileDef(q.k);
    return { title: t ? t.title : 'Details', sub: t ? t.sub : '' };
  }
};

/* ---------- Drill-down from a dashboard tile ---------- */

function linesWithStatus(g, s) { return allLinesOf(g).filter(l => l.status === s); }

function tileDef(k) {
  if (!k) return null;
  const [kind, name] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
  if (kind === 'status') {
    const groups = groupsAll().filter(g => linesWithStatus(g, name).length);
    const lines = groups.reduce((s, g) => s + linesWithStatus(g, name).length, 0);
    return {
      title: name,
      sub: groups.length + ' model' + (groups.length === 1 ? '' : 's') + ' · ' + lines + ' line' + (lines === 1 ? '' : 's') + ' at this status',
      groups: groups,
      lineFilter: l => l.status === name
    };
  }
  if (kind === 'flow') {
    const f = FLOW_TILES.find(x => x.k === name);
    if (!f) return null;
    const groups = groupsAll().filter(f.pred);
    const total = groups.reduce((s, g) => s + f.value(g), 0);
    return {
      title: f.label,
      sub: (f.unit === 'units' ? total + ' units across ' : '') + groups.length + ' model' + (groups.length === 1 ? '' : 's') + ' — ' + f.foot,
      groups: groups,
      lineFilter: null
    };
  }
  return null;
}

function renderTile(q) {
  const t = tileDef(q.k);
  if (!t) return `<div class="empty">That view no longer exists. <a href="#/dashboard">Back to the dashboard</a></div>`;
  if (!t.groups.length) return `<div class="empty">Nothing here right now. <a href="#/dashboard">Back to the dashboard</a></div>`;
  return sortBar(t.groups.length) + cardsFor(t.groups, g => summaryCard(g, t.lineFilter));
}

/* ---------- Consignments ---------- */

/* ---------- Tables with sortable headings ----------
   Every column heading is a small button. First click sorts that column
   A→Z / low→high, the second reverses it, the third goes back to the page's
   own order. Empty cells always sink to the bottom. Each cell can carry a
   data-v with the value to sort on, so a status sorts by where it is in the
   journey rather than alphabetically, and a date by the date. */

const TSORT = {};

function th(label, type, cls) {
  return `<th class="sortable ${cls || ''}" data-type="${type || 'text'}" aria-sort="none">
    <button type="button" class="th-btn">${label}<span class="th-ind" aria-hidden="true"></span></button></th>`;
}

function wireTableSort(table) {
  if (!table || !table.tHead || !table.tBodies[0]) return;
  const key = currentPage + ':' + (table.id || 'table');
  const heads = [...table.tHead.rows[0].cells];
  const tbody = table.tBodies[0];
  const original = [...tbody.rows];

  const apply = () => {
    const st = TSORT[key];
    heads.forEach((h, i) => {
      h.classList.remove('asc', 'desc');
      if (h.classList.contains('sortable')) h.setAttribute('aria-sort', 'none');
      if (st && st.col === i) {
        h.classList.add(st.dir === 1 ? 'asc' : 'desc');
        h.setAttribute('aria-sort', st.dir === 1 ? 'ascending' : 'descending');
      }
    });
    const rows = original.slice();
    if (st) {
      const type = heads[st.col].dataset.type;
      const val = r => {
        const c = r.cells[st.col];
        if (!c) return '';
        return c.dataset.v !== undefined ? c.dataset.v : c.textContent.trim();
      };
      rows.sort((x, y) => {
        const a = val(x), b = val(y);
        if ((a === '') !== (b === '')) return a === '' ? 1 : -1;
        const r = type === 'num' ? (Number(a) - Number(b))
          : a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        return r * st.dir;
      });
    }
    rows.forEach(r => tbody.appendChild(r));
  };

  heads.forEach((h, i) => {
    const btn = h.querySelector('.th-btn');
    if (!btn) return;
    btn.onclick = () => {
      const st = TSORT[key];
      if (!st || st.col !== i) TSORT[key] = { col: i, dir: 1 };
      else if (st.dir === 1) TSORT[key] = { col: i, dir: -1 };
      else delete TSORT[key];
      apply();
    };
  });
  apply();
}

/* ---------- Consignments ----------
   One table, one row per line in China Master — the layout it had before —
   with a sort button on every heading. The page's own order, before any
   heading is clicked, is most urgent first: late lines, then by priority,
   then what is still coming by ETA, then what has landed. */

const STATUS_ORDER = {};
STATUS_TILES.forEach((st, i) => { STATUS_ORDER[st] = i + 1; });
STATUS_ORDER['Cancel'] = 99;

function prioControl(g) {
  const p = g.priority || 'Normal';
  if (!user || user.level > 1) {
    return p === 'Normal' ? '<span class="hint" style="margin:0;">Normal</span>' : prioTag(g);
  }
  return `<select class="prio-sel prio-sel-${esc(p.toLowerCase())}" data-groupkey="${esc(g.groupKey)}" aria-label="Priority for ${esc(plainModel(g))}">
    ${['Normal', 'High', 'Urgent'].map(x => `<option${x === p ? ' selected' : ''}>${x}</option>`).join('')}</select>`;
}

function consignmentRows() {
  const rows = [];
  groupsAll().forEach(g => allLinesOf(g).forEach(l => rows.push({ g, l })));
  const bucket = ({ l }) => l.cancelled ? 4 : l.overdue ? 0 : (l.factoryReceived || l.receivedOnSheet) ? 3 : 1;
  rows.sort((x, y) =>
    bucket(x) - bucket(y) ||
    (x.l.overdue && y.l.overdue ? y.l.daysLate - x.l.daysLate : 0) ||
    (PRIO_RANK[y.g.priority] || 0) - (PRIO_RANK[x.g.priority] || 0) ||
    String(x.l.eta || '9999').localeCompare(String(y.l.eta || '9999')) ||
    String(x.l.packaging).localeCompare(String(y.l.packaging)));
  return rows;
}

function renderConsignments() {
  const rows = consignmentRows();
  if (!rows.length) return `<div class="empty">No consignments yet. Sync China Master from the <a href="#/dashboard">Dashboard</a>.</div>`;

  const body = rows.map(({ g, l }) => {
    const sig = l.signatureModel || g.signatureModel || g.factoryModel;
    const partial = l.factoryReceived && !l.done;
    const cls = ['fx', 'prio-row-' + String(g.priority || 'Normal').toLowerCase()];
    if (l.overdue) cls.push('row-late');
    if (l.cancelled) cls.push('row-cancel');
    return `
      <tr class="${cls.join(' ')}">
        <td data-v="${esc(l.packaging)}"><code>${esc(l.packaging)}</code>
          ${l.uniqueId ? `<div class="sub">${esc(l.uniqueId)}</div>` : ''}
          ${l.sheetNote ? `<div class="sub sub-bad">${esc(l.sheetNote)}</div>` : ''}</td>
        <td>${esc(g.supplier || '—')}</td>
        <td>${esc(g.product || '—')}</td>
        <td data-v="${esc(sig)}" class="model-cell">${prioTag(g)}<b>${esc(sig)}</b><div class="sub">${esc(g.factoryModel || '')}</div></td>
        <td class="r" data-v="${l.fr || ''}">${l.fr || '—'}</td>
        <td class="r" data-v="${l.bb || ''}">${l.bb || '—'}</td>
        <td class="r" data-v="${l.total || ''}"><b>${l.total || '—'}</b></td>
        <td data-v="${STATUS_ORDER[l.status] || 50}" class="nw">${statusChip(l.status, partial ? ` · ${l.qtyReceived}/${l.total}` : '')}</td>
        <td data-v="${esc(l.etd || '')}" class="nw">${esc(fmtDay(l.etd))}</td>
        <td data-v="${esc(l.eta || '')}" class="nw">${esc(fmtDay(l.eta))}${etaChip(l) ? `<div class="eta-chip">${etaChip(l)}</div>` : ''}</td>
        <td>${esc(g.mgr || '—')}</td>
        <td data-v="${PRIO_RANK[g.priority] || 0}">${prioControl(g)}</td>
      </tr>`;
  }).join('');

  return `
    <div class="card table-card">
      <div class="tbl-wrap">
        <table class="data-table" id="cons-table">
          <thead><tr>
            ${th('Packaging')}${th('Supplier')}${th('Product')}${th('Model')}
            ${th('FR', 'num', 'r')}${th('BB', 'num', 'r')}${th('Total', 'num', 'r')}
            ${th('Status', 'num')}${th('ETD')}${th('ETA')}${th('MGR')}${th('Priority', 'num')}
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

/* ---------- Receiving ----------
   One row per line — a line is one shipment in China Master, and each one is
   factory received on its own. A line stays here until its whole total is
   counted; a short load's count is final, so one count finishes it. */

function receivingRow(l, done) {
  const cls = done ? 'row-done' : (l.overdue ? 'row-late' : (l.shortLoad ? 'row-short' : ''));
  const partial = l.factoryReceived && !l.done;
  return `
    <tr class="fx ${cls}">
      <td><b>${esc(l.partLetter)}</b></td>
      <td><code>${esc(l.packaging)}</code>${l.uniqueId ? `<div class="hint" style="margin-top:2px;">${esc(l.uniqueId)}</div>` : ''}</td>
      <td>${statusChip(l.status, partial ? ` · ${l.qtyReceived}/${l.total}` : '')}</td>
      <td style="white-space:nowrap;">${esc(fmtDay(l.eta))}${etaChip(l)}</td>
      <td class="r"><b>${l.total}</b></td>
      <td class="r">${l.factoryReceived ? `<b style="color:#075A41;">${l.qtyReceived}</b>` : '—'}</td>
      <td>
        <div class="row-form">
          <input type="number" min="1" max="${l.total || ''}" class="rcv-qty" inputmode="numeric"
            placeholder="${l.factoryReceived ? l.qtyReceived : 'count'}" aria-label="Count for ${esc(l.packaging)}">
          <button class="btn btn-sm ${!done && (l.receivedOnSheet || l.shortLoad || partial) ? 'btn-primary' : ''} rcv-btn" data-rowid="${esc(l.rowId)}"
            data-pk="${esc(l.packaging)}">${done ? 'Correct' : (partial ? 'Update count' : 'Factory receive')}</button>
        </div>
      </td>
    </tr>`;
}

function receivingTable(rows) {
  return `<div class="tbl-wrap"><table class="lines">
    <thead><tr><th>Part</th><th>Packaging</th><th>Status</th><th>ETA</th><th class="r">Total</th><th class="r">Counted</th><th style="width:240px;"></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function receivingCard(g) {
  const open = [], done = [];
  g.parts.forEach(p => p.lines.forEach(l => (l.done ? done : open).push(l)));
  const act = l => (l.receivedOnSheet || l.shortLoad || l.factoryReceived) ? 0 : 1;
  open.sort((a, b) => act(a) - act(b) || String(a.eta || '9999').localeCompare(String(b.eta || '9999')));
  const waiting = open.filter(l => !l.factoryReceived && (l.receivedOnSheet || l.shortLoad)).length;
  const right = waiting
    ? `<span class="chip st" style="${styleVars(STATUS_STYLE['Already received'])}">${waiting} ready to receive</span>`
    : pipeChip(g.pipeline);
  return modelBlock(g, right,
    (open.length ? receivingTable(open.map(l => receivingRow(l, false)).join('')) : '') +
    (done.length ? `<details style="margin-top:8px;"><summary class="hint" style="cursor:pointer;">${done.length} line${done.length === 1 ? '' : 's'} already factory received — correct a count</summary>
      ${receivingTable(done.map(l => receivingRow(l, true)).join(''))}</details>` : '') +
    `<div class="card-status note hidden status-line"></div>`);
}

function renderReceiving() {
  const live = groupsAll().filter(g => !g.fullyCancelled);
  const hasOpen = g => g.parts.some(p => p.lines.some(l => !l.done));
  const open = live.filter(hasOpen);
  const finished = live.filter(g => !hasOpen(g));

  /* One list, sorted as a whole. It used to be split into "ready" and "on the
     way" and each half sorted on its own, so choosing ETA put a line due in
     late August below one due in September. The default order, Most urgent,
     already brings late and ready-to-receive lines to the top. */
  let html = `<div class="note" style="margin-bottom:14px;">The count you type <b>replaces</b> the one on the line — it is how many are
    physically on the floor, not how many more turned up. To correct a count, type the right number again.</div>`;
  html += open.length
    ? sortBar(open.length) + cardsFor(open, receivingCard)
    : `<div class="empty" style="margin-bottom:24px;">Nothing is waiting to be received.</div>`;

  if (finished.length) {
    html += `<details class="done-section"><summary><span class="ds-title">Fully factory received</span>
      <span class="ds-sub">${finished.length} model${finished.length === 1 ? '' : 's'} · open to correct a count</span></summary>
      <div style="margin-top:14px;">${cardsFor(finished, receivingCard)}</div></details>`;
  }
  return html;
}

/* ---------- Assembly ---------- */

function renderAssembly() {
  const groups = groupsAll().filter(g => g.buildableUnits > 0);
  if (!groups.length) {
    const waiting = groupsAll().filter(g => g.anyArrived && !g.allArrived).length;
    return `<div class="empty">Nothing can be built right now.${waiting ? ' ' + waiting + ' model' + (waiting === 1 ? ' is' : 's are') +
      ' waiting on parts — see <a href="#/tile?k=flow:arriving">Arriving</a>.' : ''}</div>`;
  }
  return sortBar(groups.length) + cardsFor(groups, g => {
    const right = `<div class="big-num"><div class="k">Can build</div><div class="v" style="color:#15803D;">${g.buildableUnits}</div></div>`;
    return modelBlock(g, right, partTiles(g) + `
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:0 0 150px;">
          <label>Units to build</label>
          <input type="number" class="asm-qty" min="1" max="${g.buildableUnits}" value="${g.buildableUnits}" inputmode="numeric">
        </div>
        <button class="btn btn-primary asm-btn" data-groupkey="${esc(g.groupKey)}" data-max="${g.buildableUnits}">Build units</button>
        <span class="hint" style="padding-bottom:10px;">${g.totalBuilt} built so far</span>
      </div>
      <div class="card-status note hidden status-line"></div>`);
  });
}

/* ---------- Delivery ---------- */

function renderDelivery() {
  const groups = groupsAll().filter(g => g.readyToSend > 0);
  if (!groups.length) return `<div class="empty">No assembled units waiting to go out.</div>`;
  return sortBar(groups.length) + cardsFor(groups, g => {
    const available = g.readyToSend;
    const fr = (g.deliveredTo && g.deliveredTo.FR) || { confirmed: 0, pending: 0 };
    const bb = (g.deliveredTo && g.deliveredTo.BB) || { confirmed: 0, pending: 0 };
    const frLeft = Math.max(0, (g.frQty || 0) - fr.confirmed - fr.pending);
    const bbLeft = Math.max(0, (g.bbQty || 0) - bb.confirmed - bb.pending);
    const right = `<div class="big-num"><div class="k">On the floor</div><div class="v" style="color:#C2410C;">${available}</div></div>`;
    return modelBlock(g, right, `
      <div class="dlv-form">
        <div class="dlv-cust-field">
          <label>To FR</label>
          <input type="number" class="dlv-fr" min="0" max="${available}" placeholder="0" inputmode="numeric" aria-label="Units to FR">
          <div class="hint">${frLeft ? frLeft + ' still owed' : 'nothing owed'}</div>
        </div>
        <div class="dlv-cust-field">
          <label>To BB</label>
          <input type="number" class="dlv-bb" min="0" max="${available}" placeholder="0" inputmode="numeric" aria-label="Units to BB">
          <div class="hint">${bbLeft ? bbLeft + ' still owed' : 'nothing owed'}</div>
        </div>
        <div class="dlv-actions">
          <button class="btn btn-primary dlv-btn" data-groupkey="${esc(g.groupKey)}" data-max="${available}">Send out</button>
          <div class="hint dlv-left" data-available="${available}">${available} on the floor</div>
        </div>
      </div>
      <div class="card-status note hidden status-line"></div>`);
  });
}

/* ---------- Acceptance ---------- */

function renderAcceptance() {
  const pending = (APP.deliveries || []).filter(d => d.Status === 'pending');
  if (!pending.length) return `<div class="empty">Nothing is waiting for a customer to accept it.</div>`;
  const keys = [];
  pending.forEach(d => { if (keys.indexOf(d.GroupKey) === -1) keys.push(d.GroupKey); });
  const groups = groupsAll().filter(g => keys.indexOf(g.groupKey) !== -1);
  return sortBar(groups.length) + cardsFor(groups, g => {
    const mine = pending.filter(d => d.GroupKey === g.groupKey);
    const total = mine.reduce((s, d) => s + (Number(d.QtyOut) || 0), 0);
    const right = `<div class="big-num"><div class="k">Awaiting</div><div class="v" style="color:#5130B0;">${total}</div></div>`;
    return modelBlock(g, right, `
      <div class="tbl-wrap"><table class="lines">
        <thead><tr><th>Customer</th><th class="r">Sent</th><th>Sent on</th><th>By</th><th style="width:260px;">Accepted</th></tr></thead>
        <tbody>${mine.map(d => `
          <tr class="fx">
            <td><span class="chip" style="background:${d.CustomerCode === 'FR' ? '#FDEBDD' : '#DDF1EE'};color:${d.CustomerCode === 'FR' ? '#9A4318' : '#1D6158'};font-weight:800;">${esc(d.CustomerCode)}</span></td>
            <td class="r"><b>${esc(d.QtyOut)}</b></td>
            <td>${esc(fmtDay(d.TimestampDay))}</td>
            <td class="hint" style="margin:0;">${esc(d.MarkedBy || '')}</td>
            <td>
              <div class="row-form" style="justify-content:flex-start;">
                <input type="number" class="acc-qty" min="0" max="${esc(d.QtyOut)}" value="${esc(d.QtyOut)}" inputmode="numeric" aria-label="Units accepted">
                <button class="btn btn-sm btn-primary acc-btn" data-deliveryid="${esc(d.DeliveryID)}" data-sent="${esc(d.QtyOut)}">Accept</button>

/* ======================================================================

   ====================================================================== */

/* Row 1 — China Master status, as a board of four stages. Each status is a
   row inside its stage: dot, name, lines, models. It reads like the
   journey itself, left to right, and looks nothing like the flow row below. */

const PHASES = [
  { name: 'Ordering',      statuses: ['Formal order', 'Production await', 'Production', 'Cancel'] },
  { name: 'Shipping',      statuses: ['Loaded', 'Short load', 'Foreign banking', 'Local banking', 'Clearance', 'On road'] },
  { name: 'Arrived',       statuses: ['Recently received', 'Already received'] },
  { name: 'At the factory', statuses: ['Factory received'] }
];

function statusTiles() {
  const groups = groupsAll();
  const stat = st => {
    const models = groups.filter(g => linesWithStatus(g, st).length);
    return { models: models.length, lines: models.reduce((n, g) => n + linesWithStatus(g, st).length, 0) };
  };
  const link = st => '#/tile?k=' + encodeURIComponent('status:' + st);

  return `<div class="phases">${PHASES.map((ph, pi) => {
    const inPhase = groups.filter(g => ph.statuses.some(st => linesWithStatus(g, st).length)).length;

    if (ph.statuses.length === 1) {
      const st = ph.statuses[0], v = stat(st), c = STATUS_STYLE[st];
      const inner = `
        <div class="ph-head"><span class="ph-step">${pi + 1}</span><span class="ph-name">${esc(ph.name)}</span></div>
        <div class="ph-hero-v">${v.models}</div>
        <div class="ph-hero-l">model${v.models === 1 ? '' : 's'} factory received</div>
        <div class="ph-hero-f">${v.lines} line${v.lines === 1 ? '' : 's'} counted on the website</div>`;
      return v.models
        ? `<a class="phase phase-hero" style="${styleVars(c)}" href="${link(st)}">${inner}</a>`
        : `<div class="phase phase-hero is-zero" style="${styleVars(c)}">${inner}</div>`;
    }

    return `
      <div class="phase">
        <div class="ph-head"><span class="ph-step">${pi + 1}</span><span class="ph-name">${esc(ph.name)}</span>
          <span class="ph-total">${inPhase} model${inPhase === 1 ? '' : 's'}</span></div>
        ${ph.statuses.map(st => {
          const v = stat(st), c = STATUS_STYLE[st];
          const inner = `<span class="ph-dot"></span><span class="ph-label">${esc(st)}</span>
            <span class="ph-lines">${v.lines ? v.lines + ' line' + (v.lines === 1 ? '' : 's') : ''}</span>
            <span class="ph-count">${v.models}</span>`;
          return v.models
            ? `<a class="ph-row" style="${styleVars(c)}" href="${link(st)}">${inner}</a>`
            : `<div class="ph-row is-zero" style="${styleVars(c)}">${inner}</div>`;
        }).join('')}
      </div>`;
  }).join('')}</div>`;
}

/* Row 2 — factory to customer, as a numbered process strip: an icon, a big
   number and an arrow on to the next step. */

const FLOW_ICONS = {
  arriving:   '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  received:   '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M9 14.5l2 2 4-4"/>',
  canbuild:   '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  assembled:  '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
  pending:    '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  acceptance: '<path d="M9 4h6v3H9z"/><path d="M8 5H6v16h12V5h-2"/><path d="M9 14l2 2 4-4"/>',
  delivered:  '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'
};

function flowTiles() {
  const groups = groupsAll();
  return `<div class="flow">${FLOW_TILES.map((f, i) => {
    const hit = groups.filter(f.pred);
    const v = hit.reduce((sum, g) => sum + f.value(g), 0);
    const inner = `
      <div class="fs-top">
        <span class="fs-icon"><svg viewBox="0 0 24 24">${FLOW_ICONS[f.k] || ''}</svg></span>
        <span class="fs-num">${i + 1}</span>
      </div>
      <div class="fs-value">${v}</div>
      <div class="fs-label">${esc(f.label)}</div>
      <div class="fs-foot">${f.unit === 'units' ? 'units' : 'models'} ${esc(f.foot)}</div>`;
    const style = `--c:${f.color};--cf:${f.fg};`;
    return hit.length
      ? `<a class="flow-step" style="${style}" href="#/tile?k=${encodeURIComponent('flow:' + f.k)}">${inner}</a>`
      : `<div class="flow-step is-zero" style="${style}">${inner}</div>`;
  }).join('')}</div>`;
}

function customerStats(code) {
  let ordered = 0, delivered = 0, awaiting = 0, owedLanded = 0;
  groupsAll().forEach(g => {
    if (g.fullyCancelled) return;
    const want = code === 'FR' ? (g.frQty || 0) : (g.bbQty || 0);
    const got = (g.deliveredTo && g.deliveredTo[code]) || { confirmed: 0, pending: 0 };
    ordered += want;
    delivered += got.confirmed || 0;
    awaiting += got.pending || 0;
    if (g.anyArrived) owedLanded += Math.max(0, want - (got.confirmed || 0) - (got.pending || 0));
  });
  return { ordered, delivered, awaiting, owedLanded };
}

function customerBoxes() {
  const onFloor = groupsAll().reduce((s, g) => s + (g.readyToSend || 0), 0);
  const box = (code, cls) => {
    const c = customerStats(code);
    return `
      <a class="cust ${cls}" href="#/delivery">
        <div class="c-top"><span class="c-code">${code}</span><span class="c-tag">${c.ordered} ordered in total</span></div>
        <div class="c-main">
          <div><div class="c-num">${c.owedLanded}</div><div class="c-lab">still to deliver from stock that has landed</div></div>
          <div><div class="c-num" style="color:#5130B0;">${c.awaiting}</div><div class="c-lab">sent, awaiting acceptance</div></div>
          <div><div class="c-num" style="color:#0B666C;">${c.delivered}</div><div class="c-lab">delivered</div></div>
        </div>
      </a>`;
  };
  return `
    <div class="dash-section">
      <div class="dash-head"><h2>FR and BB</h2>
        <span class="sub">${onFloor ? onFloor + ' assembled unit' + (onFloor === 1 ? '' : 's') + ' on the floor, ready to send' : 'nothing assembled on the floor right now'}</span></div>
      <div class="cust-grid">${box('FR', 'cust-fr')}${box('BB', 'cust-bb')}</div>
    </div>`;
}

function partChips(g) {
  return g.parts.map(p => {

    return `<span class="chip ${cls}">${esc(p.partLetter)} ${p.qtyReceived}/${p.qtyExpected}</span>`;

function atAGlance() {

function waitingOnParts() {
  const groups = groupsAll().filter(g => g.anyArrived && !g.allArrived && !g.fullyCancelled);
  const rows = groups.map(g => {
    const missing = g.parts.filter(p => !p.fullyIn);

function upcomingParts() {
  const items = [];
  const today = APP.today || '';
  groupsAll().forEach(g => g.parts.forEach(p => p.lines.forEach(l => {
    if (l.factoryReceived || l.receivedOnSheet || l.cancelled || !l.eta || l.eta < today) return;
    items.push({ g, l });
  })));
  items.sort((a, b) => String(a.l.eta).localeCompare(String(b.l.eta)));
  const shown = items.slice(0, 8);
  const rows = shown.map(({ g, l }) => {
    const d = parseYmd(l.eta);
    const rel = relDays(l.eta);
    return `
      <a class="mini-row" href="#/receiving?q=${encodeURIComponent(l.packaging)}">
        <div class="mr-date"><b>${d ? d.getDate() : '—'}</b><span>${d ? d.toLocaleDateString(undefined, { month: 'short' }) : ''}</span></div>
        <div class="mr-body">
          <div class="mr-title">${prioTag(g)}${modelLabel(g)} · Part ${esc(l.partLetter)}</div>
          <div class="mr-sub">${esc(g.consignmentGroup)} · ${rel ? esc(rel.text) : ''}</div>

        <div class="mr-end">${statusChip(l.status)}<b style="margin-top:4px;">${l.total}</b></div>

      <h3 class="card-h">Upcoming parts</h3>

      ${rows || '<div class="empty" style="padding:24px;">Nothing with a future ETA.</div>'}
    </div>`;
}

/* ---------- Charts ---------- */

// Units assembled per day, last 30 days. One series, so no legend: the title names it.
function productionChart() {
  const data = APP.buildsByDay || [];
  const W = 560, H = 220, L = 34, R = 14, T = 14, B = 28;
  const total = data.reduce((s, d) => s + d.units, 0);
  const rawMax = Math.max(0, ...data.map(d => d.units));
  const step = rawMax <= 5 ? 1 : rawMax <= 20 ? 5 : rawMax <= 100 ? 20 : rawMax <= 500 ? 100 : Math.pow(10, Math.floor(Math.log10(rawMax)));
  const max = Math.max(step * 2, Math.ceil(rawMax / step) * step || 4);
  const n = Math.max(1, data.length - 1);
  const x = i => L + i * (W - L - R) / n;
  const y = v => T + (1 - v / max) * (H - T - B);

  const ticks = [0, max / 2, max];
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('');
  const yLabels = ticks.map(t => `<text x="${L - 7}" y="${y(t) + 3.5}" text-anchor="end">${Math.round(t)}</text>`).join('');
  const xLabels = data.map((d, i) => {
    if (i % 7 !== (data.length - 1) % 7) return '';
    const dt = parseYmd(d.day);
    return `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${dt ? dt.getDate() + ' ' + dt.toLocaleDateString(undefined, { month: 'short' }) : ''}</text>`;
  }).join('');

  const pts = data.map((d, i) => x(i).toFixed(1) + ',' + y(d.units).toFixed(1));
  const line = pts.length ? 'M' + pts.join(' L') : '';
  const area = pts.length ? `M${x(0)},${y(0)} L${pts.join(' L')} L${x(data.length - 1)},${y(0)} Z` : '';
  const dots = data.map((d, i) => d.units > 0
    ? `<circle cx="${x(i)}" cy="${y(d.units)}" r="3.5" fill="var(--prod)" stroke="#fff" stroke-width="2"/>` : '').join('');

  return `
    <div class="card">
      <h3 class="card-h">Units assembled per day</h3>
      <p class="card-sub">${total ? total + ' units in the last 30 days' : 'Nothing assembled in the last 30 days yet.'}</p>
      <div class="chart-wrap" id="prod-chart" data-w="${W}" data-h="${H}" data-l="${L}" data-r="${R}" data-t="${T}" data-b="${B}" data-n="${n}" data-max="${max}">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Units assembled per day over the last 30 days, ${total} in total">
          <g class="grid">${grid}</g>
          <g class="axis">${yLabels}${xLabels}</g>
          <path d="${area}" fill="var(--prod)" opacity="0.10"/>
          <path d="${line}" fill="none" stroke="var(--prod)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${dots}
          <line id="prod-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#C9AE9C" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
          <circle id="prod-dot" r="5" fill="var(--prod)" stroke="#fff" stroke-width="2" visibility="hidden"/>
          <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="prod-hit"/>
        </svg>
        <div class="tip hidden" id="prod-tip"></div>
      </div>
    </div>`;
}

function wireProductionChart() {
  const wrap = document.getElementById('prod-chart');
  if (!wrap) return;
  const data = APP.buildsByDay || [];
  const svg = wrap.querySelector('svg');
  const hit = document.getElementById('prod-hit');
  const tip = document.getElementById('prod-tip');
  const cross = document.getElementById('prod-cross');
  const dot = document.getElementById('prod-dot');
  const W = +wrap.dataset.w, H = +wrap.dataset.h, L = +wrap.dataset.l, R = +wrap.dataset.r,
        T = +wrap.dataset.t, B = +wrap.dataset.b, n = +wrap.dataset.n, max = +wrap.dataset.max;
  const vb = svg.viewBox.baseVal;
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const sx = (ev.clientX - rect.left) * (vb.width / rect.width);
    const i = Math.max(0, Math.min(data.length - 1, Math.round((sx - L) / ((W - L - R) / n))));
    const d = data[i];
    if (!d) return;
    const px = L + i * (W - L - R) / n;
    const cy = T + (1 - d.units / max) * (H - T - B);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', px); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    const dt = parseYmd(d.day);
    tip.innerHTML = `<b>${d.units}</b> unit${d.units === 1 ? '' : 's'}<br>${dt ? dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : ''}`;
    tip.style.left = (px * rect.width / vb.width) + 'px';
    tip.style.top = (cy * rect.height / vb.height) + 'px';
    tip.classList.remove('hidden');
  };
  const leave = () => { tip.classList.add('hidden'); cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', leave);
}

// Per model, one FR line and one BB line: the track is what that customer
// ordered, the solid fill is what they have accepted, the pale fill is what
// has been sent and is waiting for acceptance.
function deliveryChart() {
  const groups = groupsAll().filter(g => !g.fullyCancelled && (g.frQty || g.bbQty));
  const lineFor = (g, code, color) => {
    const want = code === 'FR' ? (g.frQty || 0) : (g.bbQty || 0);
    const got = (g.deliveredTo && g.deliveredTo[code]) || { confirmed: 0, pending: 0 };
    const done = got.confirmed || 0, sent = done + (got.pending || 0);
    const pct = v => want > 0 ? Math.min(100, (v / want) * 100) : 0;
    const tip = `${code} · ${plainModel(g)}: ${done} delivered${got.pending ? ', ' + got.pending + ' awaiting acceptance' : ''} of ${want} ordered`;
    return `
      <div class="db-line">
        <span class="who">${code}</span>
        <div class="db-track" data-tip="${esc(tip)}" role="img" aria-label="${esc(tip)}">
          <div class="db-sent" style="width:${pct(sent)}%;background:${color};"></div>
          <div class="db-done" style="width:${pct(done)}%;background:${color};"></div>
        </div>
        <span class="db-val">${done} / ${want}</span>
      </div>`;
  };
  return `
    <div class="card">
      <h3 class="card-h">Delivered to FR and BB</h3>
      <p class="card-sub">Per model, against what each customer ordered.</p>
      <div class="legend">
        <span><i style="background:var(--fr);"></i>FR</span>
        <span><i style="background:var(--bb);"></i>BB</span>
        <span><i style="background:var(--fr);opacity:.35;"></i>paler — sent, awaiting acceptance</span>
      </div>
      <div class="chart-wrap" id="dlv-chart">
        ${groups.map(g => `
          <div class="dbar">
            <div class="db-label"><span>${modelLabel(g)}</span><span>${esc(g.consignmentGroup)}</span></div>
            ${g.frQty ? lineFor(g, 'FR', 'var(--fr)') : ''}
            ${g.bbQty ? lineFor(g, 'BB', 'var(--bb)') : ''}
          </div>`).join('') || '<div class="empty">No orders yet.</div>'}
        <div class="tip hidden" id="dlv-tip"></div>
      </div>
    </div>`;
}

function wireDeliveryChart() {
  const wrap = document.getElementById('dlv-chart');
  if (!wrap) return;
  const tip = document.getElementById('dlv-tip');
  wrap.querySelectorAll('.db-track').forEach(t => {
    t.addEventListener('mousemove', ev => {
      const r = wrap.getBoundingClientRect();
      tip.innerText = t.dataset.tip;
      tip.style.left = (ev.clientX - r.left) + 'px';
      tip.style.top = (ev.clientY - r.top - 6) + 'px';
      tip.classList.remove('hidden');
    });
    t.addEventListener('mouseleave', () => tip.classList.add('hidden'));
  });
}

/* ---------- Still to arrive ---------- */

function stillToArrive() {

  return `
    <div class="dash-section">
      <div class="dash-head"><h2>Still to arrive</h2>
        <span class="sub">${groups.length} model${groups.length === 1 ? '' : 's'}${late ? ' · ' + late + ' with a late part' : ''}</span></div>
      ${groups.length ? `<div class="arrive-grid">${groups.map(g => {
        const stage = STATUS_STYLE[g.importStage];
        return `
          <a class="arrive-tile${g.overdueParts ? ' late' : ''}" style="${stage ? '--c-dot:' + stage.dot : ''}" href="#/receiving?q=${encodeURIComponent(g.consignmentGroup)}">

}

/* ---------- Needs attention ---------- */

function attentionItems() {
  const items = [];
  groupsAll().forEach(g => {
    const name = plainModel(g) + ' · ' + g.consignmentGroup;
    const q = encodeURIComponent(g.consignmentGroup);
    const lines = allLinesOf(g);

    const awaiting = lines.filter(l => l.receivedOnSheet && !l.factoryReceived && !l.cancelled);
    if (awaiting.length) items.push({ rank: 3, sev: 'high', ico: '!', href: '#/receiving?q=' + q,
      title: name + ' — received in China Master, not factory received',
      sub: awaiting.map(l => l.packaging).join(', ') + '. It cannot go to Assembly until it is.' });

    const shorts = lines.filter(l => l.shortLoad && !l.factoryReceived && !l.cancelled);
    if (shorts.length) items.push({ rank: 2, sev: 'mid', ico: 'S', href: '#/receiving?q=' + q,
      title: name + ' — short load to count',
      sub: shorts.map(l => l.packaging + ' (' + l.total + ' on the line)').join(', ') });

    if (g.buildableUnits > 0) items.push({ rank: 2, sev: 'mid', ico: 'A', href: '#/assembly?q=' + q,
      title: name + ' — received but not assembled',
      sub: g.buildableUnits + ' unit' + (g.buildableUnits === 1 ? '' : 's') + ' can be built from parts on the floor.' });

    (g.sheetNotes || []).forEach(n => items.push({ rank: 3, sev: 'high', ico: 'Δ', href: '#/consignments?q=' + q,
      title: name + ' — ' + (n.note.indexOf('No longer') === 0 ? 'removed from China Master' : 'changed in China Master after factory receipt'),
      sub: n.packaging + ': ' + n.note }));

    if (g.totalsDisagree) items.push({ rank: 2, sev: 'mid', ico: '≠', href: '#/consignments?q=' + q,
      title: name + ' — parts disagree on quantity', sub: g.quantityNote });

    if (g.hasDiscrepancy) items.push({ rank: 3, sev: 'high', ico: '!', href: '#/consignments?q=' + q,
      title: name + ' — delivery discrepancy', sub: 'A customer accepted fewer units than were sent.' });
  });

  (APP.syncWarnings || []).forEach(w => items.push({
    rank: w.type === 'uid' ? 3 : 1, sev: w.type === 'uid' ? 'high' : 'low', ico: 'ID',
    href: '#/consignments?q=' + encodeURIComponent(w.uniqueId || ''),
    title: w.type === 'uid' ? 'Unique ID ' + w.uniqueId + ' is shared by ' + (w.models || []).length + ' models' : 'Lines without a Unique ID',
    sub: w.message }));

  const nr = (APP.needsReview || []).length;
  if (nr) items.push({ rank: 2, sev: 'mid', ico: '?', href: '#/needsreview',
    title: nr + ' line' + (nr === 1 ? '' : 's') + ' in China Master could not be read', sub: 'Their packaging codes need fixing in China Master.' });

  return items.sort((a, b) => b.rank - a.rank);
}

function attentionCard() {
  const items = attentionItems();
  const item = i => `
    <a class="att sev-${i.sev}" href="${i.href}">
      <span class="att-ico">${esc(i.ico)}</span>
      <div><div class="att-title">${esc(i.title)}</div><div class="att-sub">${esc(i.sub || '')}</div></div>
    </a>`;
  return `
    <div class="card">
      <h3 class="card-h">Needs attention</h3>
      <p class="card-sub">${items.length ? items.length + ' thing' + (items.length === 1 ? '' : 's') + ' to deal with, most serious first.' : 'Nothing needs attention.'}</p>
      ${items.slice(0, 8).map(item).join('')}
      ${items.length > 8 ? `<div id="att-more" class="hidden">${items.slice(8).map(item).join('')}</div>
        <button class="btn btn-sm" style="margin-top:10px;" id="att-toggle">Show all ${items.length}</button>` : ''}

}

function activityCard() {

/* ---------- Master search ---------- */

function msHit(href, title, meta) {
  return `<a class="ms-hit" href="${href}"><span>${title}</span><span class="h-meta">${meta}</span></a>`;
}
function msGroup(name, hits, total) {
  if (!hits.length) return '';
  return `<div class="ms-group"><h4>${esc(name)} · ${total}</h4>${hits.join('')}
    ${total > hits.length ? `<div class="ms-more">${total - hits.length} more — open the page to see them all.</div>` : ''}</div>`;
}

function runMasterSearch(q) {
  const el = document.getElementById('ms-results');
  if (!el) return;
  if (!q) { el.innerHTML = ''; return; }
  const has = (...vals) => vals.some(v => String(v == null ? '' : v).toLowerCase().indexOf(q) !== -1);
  const LIMIT = 5;

  const models = groupsAll().filter(g => has(g.consignmentGroup, g.factoryModel, g.signatureModel, (g.signatureModels || []).join(' '),
    g.modelName, g.supplier, g.product, (g.containers || []).join(' '), (g.uniqueIds || []).join(' '), g.pipeline, g.importStage, g.priority));
  const lines = [];
  groupsAll().forEach(g => allLinesOf(g).forEach(l => {
    if (has(l.packaging, l.uniqueId, l.status, l.container)) lines.push({ g, l });
  }));
  const dels = (APP.deliveries || []).filter(d => has(d.GroupKey, d.CustomerCode, d.Status, d.DeliveryID));
  const evs = (APP.events || []).filter(e => has(e.ConsignmentGroup, e.EventType, e.User, e.PartLetter));

  const total = models.length + lines.length + dels.length + evs.length;
  if (!total) { el.innerHTML = `<div class="empty" style="padding:22px;">Nothing matches “${esc(q)}”.</div>`; return; }

  el.innerHTML =
    msGroup('Models', models.slice(0, LIMIT).map(g => msHit('#/consignments?q=' + encodeURIComponent(g.consignmentGroup),
      prioTag(g) + modelLabel(g) + ' <span class="h-meta">' + esc(g.consignmentGroup) + '</span>',
      esc(g.supplier) + ' · ' + esc(g.pipeline) + ' · ' + g.buildableUnits + ' can build')), models.length) +
    msGroup('Lines', lines.slice(0, LIMIT).map(({ g, l }) => msHit('#/consignments?q=' + encodeURIComponent(l.packaging),
      '<code>' + esc(l.packaging) + '</code> ' + esc(plainModel(g)),
      esc(l.status) + (l.uniqueId ? ' · ' + esc(l.uniqueId) : '') + ' · ETA ' + esc(fmtDay(l.eta)))), lines.length) +
    msGroup('Deliveries', dels.slice(0, LIMIT).map(d => msHit(d.Status === 'pending' ? '#/acceptance' : '#/reports',
      esc(String(d.GroupKey).replace('::', ' · ')) + ' → ' + esc(d.CustomerCode),
      d.QtyOut + ' sent · ' + esc(d.Status) + ' · ' + esc(d.Timestamp || ''))), dels.length) +
    msGroup('Activity', evs.slice(0, LIMIT).map(e => msHit('#/reports',
      esc(e.EventType) + (e.Qty !== '' && e.Qty != null ? ' · ' + esc(e.Qty) : ''),
      esc(e.ConsignmentGroup || 'whole file') + ' · ' + esc(e.Timestamp || ''))), evs.length);
}

// Show a message in the card the button lives in.
function cardMsg(btn, text, bad) {
  const card = btn.closest('.model-block');
  const el = card ? card.querySelector('.card-status') : null;
  if (!el) { toast(text); return; }
  el.classList.remove('hidden');
  el.classList.toggle('note-bad', !!bad);
  el.innerText = text;
}

/* Save, then redraw straight from the data the save sent back. */
async function save(btn, busyLabel, action, payload, doneMsg) {
  const label = btn.innerText;
  btn.disabled = true;
  btn.innerText = busyLabel;
  const res = await apiCall(action, payload);
  if (res.ok) {
    if (!takeApp(res)) await reload();
    reRender();
    if (doneMsg) toast(doneMsg);
    return res;
  }
  if (!res.authFailed) {
    cardMsg(btn, res.error || 'Could not save.', true);
    btn.disabled = false;
    btn.innerText = label;
  }
  return res;
}

function showParkedSyncMessage() {
  if (!window.__syncMsg) return;
  const el = document.getElementById('dash-sync-status');
  if (!el) { toast(window.__syncMsg); window.__syncMsg = null; return; }
  el.classList.remove('hidden');
  el.innerText = window.__syncMsg;
  window.__syncMsg = null;
}

function wireSyncButtons() {
  const syncBtn = document.getElementById('dash-sync');
  const checkBtn = document.getElementById('dash-check');
  const el = document.getElementById('dash-sync-status');
  if (!el) return;

  if (checkBtn) checkBtn.onclick = async () => {
    checkBtn.disabled = true;
    el.classList.remove('hidden');
    el.innerText = 'Checking…';
    const res = await apiCall('testDropbox');
    if (!res.ok) el.innerText = res.error || "Couldn't reach the file.";
    else {
      const when = res.modified ? new Date(res.modified).toLocaleString() : 'unknown';
      const last = res.lastSync ? new Date(res.lastSync).toLocaleString() : 'never';
      el.innerText = 'Reading ' + res.path + ' (' + Math.round((res.size || 0) / 1024) + ' KB).\n' +
        'That file was last changed ' + when + '. You last synced ' + last + '.' +
        (res.fileUnchanged ? '\nIt has not changed since your last sync — anything new is not in this file yet.' : '');
    }
    checkBtn.disabled = false;
  };

  if (syncBtn) syncBtn.onclick = async () => {
    syncBtn.disabled = true;
    syncBtn.innerText = 'Syncing…';
    el.classList.remove('hidden');
    el.innerText = 'Reading China Master…';
    const res = await apiCall('syncFromDropbox');
    if (!res.ok) {
      el.innerText = 'Sync failed: ' + (res.error || 'unknown error');
      syncBtn.disabled = false;
      syncBtn.innerText = 'Sync China Master';
      return;
    }
    window.__syncMsg = res.message;
    if (!takeApp(res)) await reload();
    reRender();
    showParkedSyncMessage();
  };
}

function onEnter(input, btn) {
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
}

function wirePageHandlers(pageId) {
  wireSortBar();
  document.querySelectorAll('#content table.data-table').forEach(wireTableSort);

  if (pageId === 'dashboard') {
    wireSyncButtons();
    wireProductionChart();
    wireDeliveryChart();
    const ms = document.getElementById('ms-q');
    if (ms) {
      const go = () => runMasterSearch(ms.value.trim().toLowerCase());
      ms.oninput = go;
      ms.onkeydown = e => { if (e.key === 'Escape') { ms.value = ''; go(); } };
    }
    const t = document.getElementById('att-toggle');
    if (t) t.onclick = () => { document.getElementById('att-more').classList.remove('hidden'); t.remove(); };
  }

  if (pageId === 'consignments') {
    document.querySelectorAll('.prio-sel').forEach(sel => {
      sel.onchange = async () => {
        const was = sel.className;
        sel.disabled = true;
        const res = await apiCall('setPriority', { groupKey: sel.dataset.groupkey, priority: sel.value });
        if (res.ok) {
          if (!takeApp(res)) await reload();
          reRender();
          toast('Priority set to ' + sel.value + '.');
        } else if (!res.authFailed) {
          sel.disabled = false;
          sel.className = was;
          toast(res.error || 'Could not change the priority.');
        }
      };
    });
  }

  if (pageId === 'receiving') {
    document.querySelectorAll('.rcv-btn').forEach(btn => {
      const input = btn.closest('tr').querySelector('.rcv-qty');
      onEnter(input, btn);
      btn.onclick = () => {
        const qty = Number(input.value);
        const max = Number(input.max) || 0;
        if (!qty || qty <= 0) { cardMsg(btn, 'Type how many of ' + btn.dataset.pk + ' are on the floor.', true); input.focus(); return; }
        if (max && qty > max) { cardMsg(btn, 'That is more than the line total of ' + max + '.', true); return; }
        save(btn, 'Saving…', 'recordReceipt', { rowId: btn.dataset.rowid, qty },
          'Factory received ' + qty + ' on ' + btn.dataset.pk + '.');
      };
    });
  }

  if (pageId === 'assembly') {
    document.querySelectorAll('.asm-btn').forEach(btn => {
      const input = btn.closest('.model-block').querySelector('.asm-qty');
      onEnter(input, btn);
      btn.onclick = () => {
        const qty = Number(input.value), max = Number(btn.dataset.max);
        if (!qty || qty <= 0) { cardMsg(btn, 'Enter how many units to build.', true); return; }
        if (qty > max) { cardMsg(btn, 'Only ' + max + ' can be built from the parts on hand.', true); return; }
        save(btn, 'Building…', 'recordBuild', { groupKey: btn.dataset.groupkey, qty, remarks: '' }, qty + ' units recorded as built.');
      };
    });
  }

  if (pageId === 'delivery') {
    document.querySelectorAll('.dlv-form').forEach(form => {
      const leftEl = form.querySelector('.dlv-left');
      const max = Number(leftEl.dataset.available);
      const update = () => {
        const fr = Number(form.querySelector('.dlv-fr').value) || 0;
        const bb = Number(form.querySelector('.dlv-bb').value) || 0;
        const left = max - fr - bb;
        leftEl.innerText = left < 0 ? (fr + bb) + ' is more than the ' + max + ' on the floor' : left + ' of ' + max + ' left on the floor';
        leftEl.style.color = left < 0 ? 'var(--danger)' : '';
      };
      form.querySelectorAll('input').forEach(i => i.oninput = update);
    });
    document.querySelectorAll('.dlv-btn').forEach(btn => {
      btn.onclick = () => {
        const card = btn.closest('.model-block');
        const fr = Number(card.querySelector('.dlv-fr').value) || 0;
        const bb = Number(card.querySelector('.dlv-bb').value) || 0;
        const max = Number(btn.dataset.max);
        if (fr <= 0 && bb <= 0) { cardMsg(btn, 'Enter how many units are going to FR, to BB, or to both.', true); return; }
        if (fr < 0 || bb < 0) { cardMsg(btn, 'A quantity cannot be negative.', true); return; }
        if (fr + bb > max) { cardMsg(btn, 'That adds up to ' + (fr + bb) + ', and only ' + max + ' are on the floor.', true); return; }
        const lines = [];
        if (fr > 0) lines.push({ customerCode: 'FR', qty: fr });
        if (bb > 0) lines.push({ customerCode: 'BB', qty: bb });
        save(btn, 'Sending…', 'markOut', { groupKey: btn.dataset.groupkey, lines },
          'Sent ' + lines.map(l => l.qty + ' to ' + l.customerCode).join(' and ') + '. It now waits in Acceptance.');
      };
    });
  }

  if (pageId === 'acceptance') {
    document.querySelectorAll('.acc-btn').forEach(btn => {
      const input = btn.closest('tr').querySelector('.acc-qty');
      onEnter(input, btn);
      btn.onclick = () => {
        const q = Number(input.value), sent = Number(btn.dataset.sent);
        if (isNaN(q) || q < 0) { cardMsg(btn, 'Enter how many the customer accepted.', true); return; }
        if (q > sent) { cardMsg(btn, 'The customer cannot accept more than the ' + sent + ' that were sent.', true); return; }
        save(btn, 'Saving…', 'confirmDelivery', { deliveryId: btn.dataset.deliveryid, confirmedQty: q },
          q < sent ? 'Accepted ' + q + ' of ' + sent + ' — recorded as a discrepancy.' : 'Accepted ' + q + '. Marked delivered.');
      };
    });
  }

  if (pageId === 'needsreview') {
    document.querySelectorAll('.nr-resolve').forEach(btn => {
      btn.onclick = () => {
        const wrap = btn.closest('.row-form');
        save(btn, 'Saving…', 'resolveNeedsReview',
          { rowId: wrap.dataset.rowid, correctedSheetRowName: wrap.querySelector('.nr-fix').value }, 'Fixed.');
      };
    });
  }

  if (pageId === 'reports') {
    const b = document.getElementById('rp-filter');
    const i = document.getElementById('rp-search');
    onEnter(i, b);
    b.onclick = async () => {
      const res = await apiCall('getReports', { search: i.value });
      document.getElementById('rp-body').innerHTML = res.ok ? reportRows(res.events) : `<tr><td colspan="6">${esc(res.error)}</td></tr>`;
      wireTableSort(document.getElementById('rp-table'));
    };
  }
}
</script>
<!-- Google's sign-in library loads after the page's own script, so the
     functions it calls back into always exist when it arrives. -->
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"
onerror="handleGsiLoadError()"></script>
