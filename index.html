<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssembiX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"
onerror="handleGsiLoadError()"></script>
<style>
:root{
--primary:#F97316;
--primary-dark:#C2410C;
--secondary:#A8877D;
--accent:#FDBA74;
--dark:#7C2D12;
--dark-2:#9A3412;
--bg-page:#FFF4EC;
--surface:#FFFFFF;
--border:#F3DCC9;
--text:#431407;
--text-soft:#8B6F5E;
--text-faint:#D9BBA5;
--success:#15803D;
--success-bg:#DCFCE7;
--warning:#B45309;
--warning-bg:#FEF3C7;
--danger:#B91C1C;
--danger-bg:#FEE2E2;
--info:#1D4ED8;
--info-bg:#DBEAFE;
--fr:#C2410C;
--bb:#0F766E;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--bg-page);
font-family:"IBM Plex Sans",system-ui,sans-serif;
color:var(--text);
min-height:100vh;
}
h1,h2,h3,.brand-word,.btn,.nav-item,.content-h,.stat-value{font-family:"Plus Jakarta Sans",sans-serif;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.hidden{display:none !important;}

/* ===== LOGIN ===== */
.login-screen{
min-height:100vh;
display:flex;align-items:center;justify-content:center;
padding:24px;
background-image:
linear-gradient(rgba(67,20,7,0.72), rgba(67,20,7,0.86)),
url('login-bg.jpg');
background-size:cover;
background-position:center;
}
.login-card{
background:var(--surface);
border-radius:18px;
padding:36px 32px;
width:100%;max-width:400px;
box-shadow:0 24px 60px rgba(67,20,7,0.35);
text-align:center;
}
.login-card .brand{justify-content:center;margin-bottom:22px;}
.login-card h2{font-weight:800;font-size:20px;margin:0 0 6px;color:var(--dark);}
.login-card p{margin:0 0 24px;color:var(--text-soft);font-size:13.5px;line-height:1.6;}
#g_id_signin{display:flex;justify-content:center;}
#login-status{margin-top:16px;font-size:12.5px;color:var(--text-soft);min-height:18px;}

/* ===== APP SHELL ===== */
.app-shell{display:flex;align-items:stretch;min-height:100vh;}
.sidebar{
width:214px;flex-shrink:0;background:var(--dark);
display:flex;flex-direction:column;padding:20px 14px;gap:22px;
position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
width:32px;height:32px;flex-shrink:0;border-radius:9px;background:var(--primary);
display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
font-family:"Plus Jakarta Sans",sans-serif;
}
.brand-word{font-weight:800;font-size:17px;letter-spacing:0.02em;color:#FFF7ED;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-label{
font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;
color:#B98A6E;padding:12px 10px 5px;font-weight:700;
}
.nav-item{
display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
color:#EAD5C8;font-size:13.5px;font-weight:500;cursor:pointer;
text-decoration:none;transition:0.15s ease;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.who{padding:0 10px;font-size:12px;color:#C8A18A;line-height:1.4;}
.who b{display:block;color:#FFF7ED;font-size:13px;font-weight:600;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
background:var(--surface);border-bottom:1px solid var(--border);
padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.content-h{font-weight:700;font-size:19px;color:var(--dark);margin:0;}
.content{padding:28px;flex:1;}

/* ===== COMPONENTS ===== */
.btn{
border:1px solid var(--border);background:var(--surface);color:var(--text);
padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
display:inline-flex;align-items:center;gap:7px;transition:0.15s ease;white-space:nowrap;
}
.btn:hover{background:#FFF7ED;border-color:var(--accent);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:0.55;cursor:not-allowed;}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

.card{
background:var(--surface);border:1px solid var(--border);border-radius:13px;
padding:20px;box-shadow:0 1px 3px rgba(124,45,18,0.04);
}
.card + .card{margin-top:18px;}
.card-h{font-weight:700;font-size:15px;color:var(--dark);margin:0 0 4px;font-family:"Plus Jakarta Sans",sans-serif;}
.card-sub{font-size:12.5px;color:var(--text-soft);margin:0 0 16px;line-height:1.5;}

/* Receiving nests: consignment -> model -> parts */
.consign-block{margin-bottom:22px;}
.consign-head{
display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
padding:0 2px 10px;border-bottom:2px solid var(--border);margin-bottom:14px;
}
.consign-head h2{margin:0;font-size:17px;font-weight:800;color:var(--dark);}
.consign-head .meta{font-size:12.5px;color:var(--text-soft);}
.model-block{
border:1px solid var(--border);border-radius:11px;background:var(--surface);
padding:16px 18px;margin-bottom:12px;
}
.model-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.model-title{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14.5px;color:var(--dark);}
.model-meta{font-size:12px;color:var(--text-soft);}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
/* Five headline tiles stay on one line, then break cleanly rather than
   leaving a single orphan on a row of its own. */
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:1240px){.grid-5{grid-template-columns:repeat(3,1fr);}}
@media (max-width:760px){.grid-5{grid-template-columns:repeat(2,1fr);}}
@media (max-width:460px){.grid-5{grid-template-columns:1fr;}}

.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);font-weight:600;}
.stat-value{font-size:26px;font-weight:800;color:var(--dark);margin-top:5px;line-height:1;}

label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
color:var(--text-soft);margin-bottom:6px;}
input,select,textarea{
width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(249,115,22,0.13);}
.field{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;}

.chip{
display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
font-size:11.5px;font-weight:600;border:1px solid transparent;
}
.chip-ok{background:var(--success-bg);color:var(--success);}
.chip-warn{background:var(--warning-bg);color:var(--warning);}
.chip-bad{background:var(--danger-bg);color:var(--danger);}
.chip-info{background:var(--info-bg);color:var(--info);}
.chip-idle{background:#F5EBE3;color:var(--text-soft);}

table{width:100%;border-collapse:collapse;}
th{
text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);
font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);font-weight:700;
}
td{padding:12px;border-bottom:1px solid #F8EDE4;font-size:13.5px;}
tbody tr:last-child td{border-bottom:none;}

.empty{
border:1px dashed var(--border);border-radius:12px;padding:44px 20px;text-align:center;
color:var(--text-soft);font-size:13.5px;background:#FFFBF7;
}
.note{
background:#FFF7ED;border:1px solid var(--border);border-radius:10px;
padding:12px 15px;font-size:12.5px;color:var(--text-soft);line-height:1.55;
}
.note b{color:var(--text);}

.spinner{
width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);
border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;
}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-soft);font-size:13.5px;}
@keyframes spin{to{transform:rotate(360deg);}}
#login-status .spinner{margin-bottom:8px;}

/* ===== DASHBOARD ===== */
.dash-section{margin-bottom:26px;}
.dash-head{
display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;
}
.dash-head h2{
margin:0;font-size:15px;font-weight:700;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;
}
.dash-head .sub{font-size:12.5px;color:var(--text-soft);}

.tile{
background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:18px;display:flex;flex-direction:column;gap:6px;
border-left:4px solid var(--border);
}
a.tile,a.stage,a.arrive-tile{text-decoration:none;color:inherit;transition:border-color .15s ease,box-shadow .15s ease;}
a.tile:hover,a.stage:hover,a.arrive-tile:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(124,45,18,0.08);}
a.tile:hover .t-label,a.arrive-tile:hover .a-model{color:var(--primary-dark);}
.tile .t-label{font-size:12.5px;color:var(--text-soft);font-weight:600;}
.tile .t-value{font-size:30px;font-weight:800;line-height:1;color:var(--dark);font-family:"Plus Jakarta Sans",sans-serif;}
.tile .t-foot{font-size:11.5px;color:var(--text-soft);}
.tile-accent{border-left-color:var(--primary);}
.tile-good{border-left-color:var(--success);}
.tile-good .t-value{color:var(--success);}
.tile-warn{border-left-color:var(--warning);}
.tile-warn .t-value{color:var(--warning);}
.tile-fr{border-left-color:var(--fr);}
.tile-bb{border-left-color:var(--bb);}
/* Late is the one state worth shouting about, so it is the only tile that
   changes its whole background rather than just an edge. */
.tile-late{border-left-color:var(--danger);background:var(--danger-bg);border-color:#FBCFCF;}
.tile-late .t-value{color:var(--danger);}
.tile-late .t-label,.tile-late .t-foot{color:#8F2020;}

/* The two standing customers. */
.cust{
display:block;text-decoration:none;color:inherit;background:var(--surface);
border:1px solid var(--border);border-radius:13px;padding:18px 20px;
border-top:4px solid var(--border);transition:border-color .15s ease,box-shadow .15s ease;
}
.cust:hover{box-shadow:0 2px 10px rgba(124,45,18,0.09);}
.cust-fr{border-top-color:var(--fr);}
.cust-bb{border-top-color:var(--bb);}
.cust .c-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
.cust .c-code{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:19px;color:var(--dark);}
.cust-fr .c-code{color:var(--fr);}
.cust-bb .c-code{color:var(--bb);}
.cust .c-tag{font-size:11.5px;color:var(--text-soft);}
.cust .c-main{display:flex;gap:34px;flex-wrap:wrap;}
.cust .c-num{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:31px;line-height:1;color:var(--dark);}
.cust .c-num-soft{color:var(--success);}
.cust .c-lab{font-size:11.5px;color:var(--text-soft);margin-top:6px;max-width:190px;line-height:1.45;}
.cust .c-foot{
margin-top:15px;padding-top:12px;border-top:1px solid var(--border);
font-size:11.5px;color:var(--text-soft);
}

.arrive-late{border-color:#FBCFCF;background:#FFF8F7;}

.stage-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.stage{
background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px;
text-align:left;position:relative;
}
.stage .s-count{font-size:24px;font-weight:800;color:var(--dark);line-height:1;font-family:"Plus Jakarta Sans",sans-serif;}
.stage .s-name{font-size:12px;color:var(--text-soft);margin-top:5px;font-weight:600;}
.stage-empty .s-count{color:var(--text-faint);}
.stage-done{background:var(--success-bg);border-color:#BBF7D0;}
.stage-done .s-count{color:var(--success);}
.stage-done .s-name{color:var(--success);}

.arrive-tile{
background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px 16px;
display:flex;flex-direction:column;gap:7px;
}
.arrive-tile .a-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.arrive-tile code{font-size:12.5px;font-weight:700;color:var(--dark);}
.arrive-tile .a-model{font-size:13px;font-weight:600;color:var(--text);}
.arrive-tile .a-meta{font-size:11.5px;color:var(--text-soft);}
.arrive-tile .a-parts{display:flex;gap:5px;flex-wrap:wrap;}

/* Bars: FR vs BB, and demand vs built vs delivered */
.bar-row{margin-bottom:15px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:7px;display:flex;justify-content:space-between;gap:10px;}
.bar-label span:last-child{color:var(--text-soft);font-weight:500;font-size:11.5px;}
.bar-track{background:#FBF1E9;border-radius:5px;height:15px;margin-bottom:5px;}
.bar-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;
padding-right:6px;color:#fff;font-size:10.5px;font-weight:700;position:relative;}
/* Sits just past the end of its own bar, not at the end of the track. */
.bar-out{position:absolute;left:100%;top:0;height:15px;line-height:15px;margin-left:6px;
font-size:10.5px;font-weight:700;color:var(--text-soft);white-space:nowrap;}

/* One track per model: the whole order is the track, built fills it, and
   confirmed sits inside the built portion. */
.prog-track{background:#FBF1E9;border-radius:5px;height:17px;position:relative;overflow:hidden;}
.prog-landed{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;}
.prog-built{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:5px;}
.prog-conf{position:absolute;inset:0 auto 0 0;background:var(--success);border-radius:5px;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;color:var(--text-soft);}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px;}

/* Search */
.search-wrap{position:relative;display:inline-flex;align-items:center;}
.search-wrap input{
padding:7px 30px 7px 32px;font-size:13px;border-radius:8px;width:230px;
}
.search-wrap .s-icon{position:absolute;left:10px;width:15px;height:15px;stroke:var(--text-soft);
fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.search-wrap .s-clear{
position:absolute;right:6px;border:none;background:none;cursor:pointer;color:var(--text-soft);
font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;
}
.search-wrap .s-clear:hover{background:#FBF1E9;color:var(--text);}
.search-count{font-size:11.5px;color:var(--text-soft);margin-left:10px;white-space:nowrap;}

.master-search{
background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:16px 18px;margin-bottom:22px;
}
.master-search .ms-input{position:relative;display:flex;align-items:center;}
.master-search .ms-input input{padding:11px 14px 11px 38px;font-size:14.5px;}
.master-search .ms-input svg{position:absolute;left:13px;width:17px;height:17px;
stroke:var(--text-soft);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.ms-results{margin-top:16px;}
.ms-group{margin-bottom:18px;}
.ms-group:last-child{margin-bottom:0;}
.ms-group h4{
margin:0 0 9px;font-size:12.5px;font-weight:700;color:var(--dark);
font-family:"Plus Jakarta Sans",sans-serif;
}
.ms-hit{
display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;
padding:9px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;
font-size:13px;text-decoration:none;color:var(--text);background:#FFFBF7;
}
.ms-hit:hover{border-color:var(--accent);background:#FFF7ED;}
.ms-hit .h-meta{font-size:11.5px;color:var(--text-soft);}
.ms-more{font-size:11.5px;color:var(--text-soft);padding:3px 2px;}

.act-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F8EDE4;font-size:13px;}
.act-item:last-child{border-bottom:none;}
.act-when{color:var(--text-soft);font-size:11.5px;white-space:nowrap;flex:0 0 110px;}
.act-what b{font-weight:600;}
.act-where{color:var(--text-soft);font-size:11.5px;}

.sync-bar{
display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin-bottom:22px;
}
.sync-bar .s-text{font-size:13px;color:var(--text-soft);}
.sync-bar .s-text b{color:var(--text);font-weight:600;}

@media (prefers-reduced-motion: reduce){
*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}

@media (max-width:820px){
.app-shell{flex-direction:column;}
.sidebar{width:100%;height:auto;position:static;flex-direction:column;}
.nav{flex-direction:row;flex-wrap:wrap;}
.nav-item{width:auto;}
.nav-label{display:none;}
.sidebar-foot{margin-top:14px;}
.content{padding:18px;}
.topbar{padding:14px 18px;}
.act-when{flex:0 0 90px;}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="scr-login" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-word" style="color:var(--dark)">AssembiX</div>
    </div>
    <h2>Sign in</h2>
    <p>Use your authorised Google account to continue.</p>
    <div id="g_id_signin"></div>
    <div id="login-status"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app-shell hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div class="brand-word">AssembiX</div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="who"><b id="who-name">—</b><span id="who-role">—</span></div>
      <button class="nav-item" onclick="doLogout()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><path d="M21 12H9"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1 class="content-h" id="page-title">Dashboard</h1></div>
      <div id="page-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* Fill APPS_SCRIPT_URL after deploying the AssembiX Apps Script project. */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDAt4paCuEsZ0HZG4eWyWAMX_AVevyEBNVdUPyM6t6EJoMi8r1fpEc-R3epfe5XmMv/exec";
const GOOGLE_CLIENT_ID = "766825494798-2vq54u2u9kmfegir98uig2ubr9gr6hj4.apps.googleusercontent.com";

/* `filter` decides whether the topbar filter box appears.

   It is off on two pages on purpose. The Dashboard has the master search,
   which searches everything rather than just what is on screen — two boxes
   ten pixels apart fought each other, and typing in the topbar one silently
   emptied the master results. Reports has its own Search button that queries
   the server, which finds events the page has not loaded; a box that only
   hides visible rows sitting next to it was worse than no box. */
const PAGES = [
  { id: 'dashboard',    label: 'Dashboard',      group: 'Overview',  filter: false },
  { id: 'consignments', label: 'Consignments',   group: 'Incoming',  filter: true  },
  { id: 'receiving',    label: 'Receiving',      group: 'Warehouse', filter: true  },
  { id: 'assembly',     label: 'Assembly',       group: 'Warehouse', filter: true  },
  { id: 'delivery',     label: 'Delivery',       group: 'Output',    filter: true  },
  { id: 'needsreview',  label: 'Needs review',   group: 'Output',    filter: true  },
  { id: 'reports',      label: 'Reports',        group: 'Output',    filter: false },
  { id: 'models',       label: 'Models & parts', group: 'Setup',     filter: false }
];

/* The storage key still says assembix_ on purpose. Renaming it would sign
   everybody out once for no gain — it is internal and never shown. */
let idToken = localStorage.getItem('assembix_idToken') || null;
let user = null;
let currentPage = 'dashboard';

/* FIX 6 — one backend call holds everything every page needs.
   The old page fired listConsignments, getConsignmentRows, listDeliveries and
   getDashboard back to back, each 3-6s, stacking into 20-30s. Now: a single
   getAppData round-trip, and every page renders from this object. */
let APP = null;

let sessionExpired = false;

function handleSessionExpiry() {
  if (sessionExpired) return;
  sessionExpired = true;
  idToken = null;
  localStorage.removeItem('assembix_idToken');
  user = null;
  APP = null;

  const app = document.getElementById('app');
  const login = document.getElementById('scr-login');
  if (app) app.classList.add('hidden');
  if (login) {
    login.classList.remove('hidden');
    const statusEl = document.getElementById('login-status');
    if (statusEl) statusEl.innerText = 'Your session expired. Please sign in again.';
  }
  try {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.disableAutoSelect();
      google.accounts.id.prompt();
    }
  } catch (e) { /* the sign-in button is still on screen regardless */ }
}

const AUTH_ERRORS = ['Missing idToken', 'Email not allowlisted or invalid token', 'User is not active'];

async function apiCall(action, payload = {}) {
  if (!idToken) { handleSessionExpiry(); return { ok: false, error: 'Session expired', authFailed: true }; }
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, idToken, ...payload })
    });
    const data = await res.json();
    if (!data.ok && AUTH_ERRORS.indexOf(String(data.error)) !== -1) {
      handleSessionExpiry();
      return { ok: false, error: 'Session expired', authFailed: true };
    }
    return data;
  } catch (e) {
    return { ok: false, error: 'Could not reach the server. Check your connection and try again.' };
  }
}

async function loadApp() {
  const res = await apiCall('getAppData');
  if (res.ok) APP = res;
  return res;
}

/* =========================
   AUTH
   ========================= */

function initGoogleSignIn() {
  if (typeof google === 'undefined') { handleGsiLoadError(); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large', width: 260 });
  if (idToken) completeLogin();
  else google.accounts.id.prompt();
}

function handleGsiLoadError() {
  document.getElementById('login-status').innerText = "Could not load Google Sign-In. The page must be served over https:// with a working connection.";
}

function handleCredentialResponse(response) {
  sessionExpired = false;
  idToken = response.credential;
  localStorage.setItem('assembix_idToken', idToken);
  completeLogin();
}

async function completeLogin() {
  const statusEl = document.getElementById('login-status');
  statusEl.innerHTML = `<div class="spinner"></div>Signing you in…`;
  try {
    const result = await loadApp();
    if (!result.ok) {
      statusEl.innerText = result.error || "Authorization failed";
      idToken = null;
      localStorage.removeItem('assembix_idToken');
      if (google && google.accounts) google.accounts.id.prompt();
      return;
    }

    user = result.user;
    statusEl.innerText = "";
    document.getElementById('scr-login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('who-name').innerText = user.name;
    document.getElementById('who-role').innerText = roleLabel(user.level);

    renderNav();
    window.addEventListener('hashchange', route);
    route();
  } catch (e) {
    statusEl.innerText = "Could not reach the server. Try signing in again.";
    idToken = null;
    localStorage.removeItem('assembix_idToken');
    if (google && google.accounts) google.accounts.id.prompt();
  }
}

function roleLabel(level) {
  if (level === 0) return 'Director';
  if (level === 1) return 'Manager';
  return 'Staff';
}

function doLogout() {
  idToken = null;
  localStorage.removeItem('assembix_idToken');
  user = null;
  google.accounts.id.disableAutoSelect();
  location.reload();
}

/* =========================
   SHELL
   ========================= */

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = "";
  let lastGroup = null;
  PAGES.forEach(p => {
    if (p.group !== lastGroup) {
      nav.insertAdjacentHTML('beforeend', `<div class="nav-label">${p.group}</div>`);
      lastGroup = p.group;
    }
    nav.insertAdjacentHTML('beforeend', `<a class="nav-item${p.id === currentPage ? ' active' : ''}" href="#/${p.id}">${p.label}</a>`);
  });
}

// Every page renders synchronously from APP — no per-page fetches.
// A hash may carry a filter: #/receiving?q=Short%20load
function route() {
  if (!user || !idToken || !APP) return;
  const raw = window.location.hash.replace(/^#\/?/, '') || 'dashboard';
  const qIdx = raw.indexOf('?');
  const id = (qIdx === -1 ? raw : raw.slice(0, qIdx)) || 'dashboard';
  let preset = '';
  if (qIdx !== -1) {
    const m = /(?:^|&)q=([^&]*)/.exec(raw.slice(qIdx + 1));
    if (m) { try { preset = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { preset = m[1]; } }
  }

  const page = PAGES.find(p => p.id === id);
  if (!page) { window.location.hash = '#/dashboard'; return; }

  currentPage = page.id;
  document.getElementById('page-title').innerText = page.label;
  document.getElementById('page-actions').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${page.filter ? `
      <div class="search-wrap">
        <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="page-search" placeholder="Filter this page" autocomplete="off">
        <button class="s-clear hidden" id="page-search-clear" title="Clear" aria-label="Clear search">×</button>
      </div>
      <span class="search-count" id="page-search-count"></span>` : ''}
      <button class="btn btn-sm" id="page-refresh">Refresh</button>
    </div>`;
  document.getElementById('page-refresh').onclick = async () => {
    const b = document.getElementById('page-refresh');
    b.disabled = true; b.innerText = 'Refreshing…';
    await reload();
  };
  renderNav();

  document.getElementById('content').innerHTML = RENDERERS[page.id]();
  wirePageHandlers(page.id);
  wirePageSearch();

  const input = document.getElementById('page-search');
  if (preset && input) {
    input.value = preset;
    document.getElementById('page-search-clear').classList.remove('hidden');
    applyPageFilter(preset.toLowerCase());
  }
}

/* Redraw the current page without going back to the server, then put the
   filter back over it. Anything that rebuilds the content — changing the
   sort, say — must come through here. Re-rendering on its own used to bring
   every hidden row back while the box still held the search text and the
   counter still claimed a filter was on. */
function reRender() {
  document.getElementById('content').innerHTML = RENDERERS[currentPage]();
  wirePageHandlers(currentPage);
  const input = document.getElementById('page-search');
  const q = input ? input.value.trim().toLowerCase() : '';
  if (q) applyPageFilter(q);
}

/* =========================
   PER-PAGE FILTER

   Hides anything on the current page that doesn't contain the typed text:
   table rows first, then the cards and tiles, then any consignment heading
   left with nothing under it. Purely visual — it never refetches.
   ========================= */

function wirePageSearch() {
  const input = document.getElementById('page-search');
  const clear = document.getElementById('page-search-clear');
  if (!input) return;

  const run = () => {
    const q = input.value.trim().toLowerCase();
    clear.classList.toggle('hidden', !q);
    applyPageFilter(q);
    // Drop the filter out of the URL so a refresh doesn't bring it back.
    if (!q && window.location.hash.indexOf('?') !== -1) {
      const clean = window.location.hash.split('?')[0];
      history.replaceState(null, '', clean);
    }
  };

  input.oninput = run;
  input.onkeydown = e => { if (e.key === 'Escape') { input.value = ''; run(); } };
  clear.onclick = () => { input.value = ''; run(); input.focus(); };
}

function applyPageFilter(q) {
  const content = document.getElementById('content');
  const countEl = document.getElementById('page-search-count');
  if (!content) return;

  // Summary tiles at the top of a page describe the whole page, so they are
  // never filtered — only the rows and blocks that list individual things.
  const blockSel = '.model-block, .arrive-tile';
  const all = [
    ...content.querySelectorAll('tbody tr'),
    ...content.querySelectorAll(blockSel)
  ];

  if (!q) {
    all.forEach(el => el.classList.remove('hidden'));
    content.querySelectorAll('.consign-block, .card, .dash-section').forEach(el => el.classList.remove('hidden'));
    const msg = content.querySelector('#page-search-empty');
    if (msg) msg.remove();
    if (countEl) countEl.innerText = '';
    return;
  }

  const hits = [];
  all.forEach(el => {
    const hit = el.textContent.toLowerCase().indexOf(q) !== -1;
    el.classList.toggle('hidden', !hit);
    if (hit) hits.push(el);
  });

  /* Count only the innermost matches. A model block on Receiving contains the
     part rows, so both matched and two visible rows were reported as "4
     matches". Anything that contains another match is a container, not a
     result. */
  const shown = hits.filter(el => !hits.some(other => other !== el && el.contains(other))).length;

  // A consignment heading with every model hidden under it is just noise.
  content.querySelectorAll('.consign-block').forEach(block => {
    const kids = block.querySelectorAll('.model-block');
    const anyVisible = [...kids].some(k => !k.classList.contains('hidden'));
    block.classList.toggle('hidden', kids.length > 0 && !anyVisible);
  });

  // Same for a card or dashboard section whose rows have all gone.
  content.querySelectorAll('.card, .dash-section').forEach(card => {
    const kids = card.querySelectorAll('tbody tr, ' + blockSel);
    if (!kids.length) return;
    const anyVisible = [...kids].some(k => !k.classList.contains('hidden'));
    card.classList.toggle('hidden', !anyVisible);
  });

  let msg = content.querySelector('#page-search-empty');
  if (!shown) {
    if (!msg) {
      msg = document.createElement('div');
      msg.id = 'page-search-empty';
      msg.className = 'empty';
      content.prepend(msg);
    }
    msg.innerText = 'Nothing on this page matches “' + q + '”.';
  } else if (msg) {
    msg.remove();
  }

  if (countEl) countEl.innerText = shown ? shown + ' match' + (shown === 1 ? '' : 'es') : '';
}

async function reload() {
  document.getElementById('content').innerHTML = `<div class="loading-wrap"><div class="spinner"></div>Loading…</div>`;
  const res = await loadApp();
  if (!res.ok) {
    document.getElementById('content').innerHTML = `<div class="empty">Could not load: ${esc(res.error)}</div>`;
    return;
  }
  route();
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function chip(status) {
  const map = {
    'Fully Pending': 'chip-idle', 'Partial Pending': 'chip-warn', 'Assembly Pending': 'chip-info',
    'Ready to Deliver': 'chip-info', 'Delivered': 'chip-ok', 'Delivery discrepancy': 'chip-bad'
  };
  let cls = map[status];
  if (!cls) cls = String(status).indexOf('Towards') === 0 ? 'chip-warn' : 'chip-idle';
  return `<span class="chip ${cls}">${esc(status)}</span>`;
}

function importChip(status) {
  const map = {
    'Production': 'chip-idle', 'Loaded': 'chip-info', 'F-Bank': 'chip-info',
    'L-Bank': 'chip-info', 'Clearance': 'chip-warn', 'Received': 'chip-ok'
  };
  return `<span class="chip ${map[status] || 'chip-idle'}">${esc(status || '—')}</span>`;
}

/* FIX 4 — dates arrive as plain yyyy-MM-dd strings and are parsed as local
   calendar dates. Nothing goes through UTC, so nothing shifts a day at UTC+5. */
function parseYmd(v) {
  if (!v) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function fmtDay(v) {
  const d = parseYmd(v);
  if (!d) return '—';
  return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
}

/* The ETA chip.

   Two rules, both learned from looking at the live page. A line that has
   already arrived gets no chip at all — "168 days ago" next to a received
   container was the loudest thing in the column and meant nothing. A line
   that is late gets a red one that says so in plain words, because overdue
   used to render in the same calm blue as "in 9 days", which buried the
   single most expensive state in the business. */
function etaChip(r) {
  if (!r.eta || r.arrived) return '';
  const rel = relDays(r.eta);
  if (!rel) return '';
  if (r.overdue) {
    return `<div><span class="chip chip-bad" style="margin-top:4px;">${Math.abs(rel.days)} days late</span></div>`;
  }
  return `<div><span class="chip ${rel.cls}" style="margin-top:4px;">${esc(rel.text)}</span></div>`;
}

function relDays(v) {
  const d = parseYmd(v);
  if (!d) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 86400000);
  if (days === 0) return { days, text: 'today', cls: 'chip-warn' };
  if (days === 1) return { days, text: 'tomorrow', cls: 'chip-warn' };
  if (days > 1) return { days, text: 'in ' + days + ' days', cls: days <= 7 ? 'chip-warn' : 'chip-idle' };
  if (days === -1) return { days, text: 'yesterday', cls: 'chip-info' };
  return { days, text: Math.abs(days) + ' days ago', cls: 'chip-info' };
}

function modelLabel(g) {
  const sig = g.signatureModel || g.modelName || '';
  const fac = g.factoryModel || '';
  if (sig && fac) return esc(sig) + ' <span style="color:var(--text-soft);font-weight:500;">(' + esc(fac) + ')</span>';
  return esc(sig || fac || '—');
}

function plainModel(g) {
  return g.signatureModel || g.factoryModel || g.modelName || '—';
}

// FIX 7 — Receiving and Assembly nest: consignment heading, each model under
// it, that model's parts and dates under the model. A container carrying more
// than one product no longer collapses into one flat block.
function byConsignment(groups) {
  const order = [];
  const map = {};
  groups.forEach(g => {
    const c = g.consignmentGroup;
    if (!map[c]) { map[c] = []; order.push(c); }
    map[c].push(g);
  });
  return order.map(c => ({ consignment: c, models: map[c] }));
}

/* =========================
   DASHBOARD
   ========================= */

const STAGES = ['Production', 'Loaded', 'F-Bank', 'L-Bank', 'Clearance', 'Received'];

/* One bar. A zero draws an empty track rather than a two-pixel stub with a
   "0" crammed into it, and the value only sits inside the fill when there is
   room for it. */
function barTrack(value, max, color) {
  const pct = max > 0 && value > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
  const inside = pct >= 12;
  return `
    <div class="bar-track">
      <div class="bar-fill" style="width:${pct}%;background:${color};">${
        inside ? value : (value > 0 ? `<span class="bar-out">${value}</span>` : '')}</div>
    </div>`;
}

function renderDashboard() {
  const groups = APP.consignments || [];
  const stats = (APP.dashboard && APP.dashboard.stats) || {};
  const byStage = (APP.dashboard && APP.dashboard.byStage) || {};

  const syncBar = (user && user.level <= 1) ? `
    <div class="sync-bar">
      <div class="s-text">
        China Master last synced <b>${APP.lastSync ? esc(new Date(APP.lastSync).toLocaleString()) : 'never'}</b>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" id="dash-check">Check connection</button>
        <button class="btn btn-primary btn-sm" id="dash-sync">Sync China Master</button>
      </div>
    </div>
    <div id="dash-sync-status" class="note hidden" style="margin:-12px 0 22px;"></div>` : '';

  const masterSearch = `
    <div class="master-search">
      <div class="ms-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="ms-q" autocomplete="off"
          placeholder="Search everything — consignment, model, supplier, part, customer, person">
      </div>
      <div class="ms-results" id="ms-results"></div>
    </div>`;

  if (!groups.length) {
    return syncBar + `<div class="empty">Nothing loaded yet. Sync China Master to bring in consignments.</div>`;
  }

  /* --- Grid 1: five numbers, in the order a day actually runs.
         Arriving, late, to count, to build, to send. Each opens the page the
         number came from, carrying a filter where one narrows it usefully. --- */
  const tiles = `
    <div class="grid grid-5">
      <a class="tile tile-accent" href="#/receiving">
        <div class="t-label">Arriving</div>
        <div class="t-value">${stats.totalArriving || 0}</div>
        <div class="t-foot">models still waiting on parts</div>
      </a>
      <a class="tile ${stats.overdueParts ? 'tile-late' : ''}" href="#/consignments">
        <div class="t-label">Overdue</div>
        <div class="t-value">${stats.overdueParts || 0}</div>
        <div class="t-foot">${stats.overdueParts
          ? 'past ETA, still not here — worst is ' + stats.worstDaysLate + ' days'
          : 'nothing is late'}</div>
      </a>
      <a class="tile ${stats.shortLoadsToCount ? 'tile-warn' : ''}" href="#/receiving?q=${encodeURIComponent('Short load')}">
        <div class="t-label">Short loads to count</div>
        <div class="t-value">${stats.shortLoadsToCount || 0}</div>
        <div class="t-foot">need a count from the floor</div>
      </a>
      <a class="tile ${stats.canBuildNow ? 'tile-good' : ''}" href="#/assembly">
        <div class="t-label">Can build now</div>
        <div class="t-value">${stats.canBuildNow || 0}</div>
        <div class="t-foot">units from parts on hand</div>
      </a>
      <a class="tile ${stats.readyToSend ? 'tile-good' : ''}" href="#/delivery">
        <div class="t-label">Assembled, ready to send</div>
        <div class="t-value">${stats.readyToSend || 0}</div>
        <div class="t-foot">built and still on the floor</div>
      </a>
    </div>`;

  /* --- The two customers, side by side.

         This replaces a pair of tiles that read "FR still owed 1622". That
         number was every unit ever ordered, including four models being made
         in China — nothing anybody could act on. What a person actually needs
         is what is built and waiting to go out, then what is owed on stock
         that has landed, with the full order kept underneath for reference. --- */
  const custBox = (code, cls) => {
    const c = (APP.dashboard && APP.dashboard.customer && APP.dashboard.customer[code]) || {};
    const ready = groups.reduce((s, g) => s + (g.readyToSend || 0), 0);
    return `
      <a class="cust ${cls}" href="#/delivery?q=${encodeURIComponent(code)}">
        <div class="c-top">
          <span class="c-code">${esc(code)}</span>
          <span class="c-tag">${c.awaiting ? c.awaiting + ' awaiting confirmation' : 'nothing in transit'}</span>
        </div>
        <div class="c-main">
          <div>
            <div class="c-num">${c.deliverable || 0}</div>
            <div class="c-lab">to deliver from stock that has landed</div>
          </div>
          <div>
            <div class="c-num c-num-soft">${c.confirmed || 0}</div>
            <div class="c-lab">confirmed received</div>
          </div>
        </div>
        <div class="c-foot">${c.ordered || 0} ordered in total${ready ? ' · ' + ready + ' assembled and waiting to be split' : ''}</div>
      </a>`;
  };

  const customers = `
    <div class="dash-section">
      <div class="dash-head">
        <h2>FR and BB</h2>
        <span class="sub">what is assembled and to be delivered</span>
      </div>
      <div class="grid grid-2">${custBox('FR', 'cust-fr')}${custBox('BB', 'cust-bb')}</div>
    </div>`;

  /* --- Grid 2: where everything sits on the import journey.
         Opens Consignments filtered to that stage. Note the tile counts
         models while Consignments lists packaging lines, so the number of
         rows there will be higher. --- */
  const stageStrip = STAGES.map(s => {
    const n = byStage[s] || 0;
    const cls = s === 'Received' && n ? 'stage stage-done' : (n ? 'stage' : 'stage stage-empty');
    if (!n) return `<div class="${cls}"><div class="s-count">0</div><div class="s-name">${esc(s)}</div></div>`;
    return `<a class="${cls}" href="#/consignments?q=${encodeURIComponent(s)}"><div class="s-count">${n}</div><div class="s-name">${esc(s)}</div></a>`;
  }).join('');

  /* --- Grid 3: what is still coming. Late ones first, and each opens
         Receiving on that consignment. --- */
  const arriving = groups.filter(g => !g.allArrived)
    .sort((a, b) => {
      if (!!b.overdueParts !== !!a.overdueParts) return b.overdueParts - a.overdueParts;
      if (a.overdueParts && b.overdueParts) return b.worstDaysLate - a.worstDaysLate;
      return String(a.nextEta || '9999').localeCompare(String(b.nextEta || '9999'));
    });

  const arriveTiles = arriving.length ? arriving.map(g => {
    const late = g.overdueParts > 0;
    const rel = relDays(g.nextEta);
    const waiting = g.parts.filter(p => !p.arrived);
    // The model leads, not the consignment code — ACE-49-50 carries two
    // different products and the repeated code read as a duplicate tile.
    return `
      <a class="arrive-tile${late ? ' arrive-late' : ''}" href="#/receiving?q=${encodeURIComponent(g.consignmentGroup)}">
        <div class="a-top">
          <span class="a-model">${modelLabel(g)}</span>
          ${late ? `<span class="chip chip-bad">${g.worstDaysLate} days late</span>` : importChip(g.importStage)}
        </div>
        <div class="a-meta"><code>${esc(g.consignmentGroup)}</code> · ${esc(g.supplier)} · ${g.totalQty || '—'} expected</div>
        <div class="a-parts">
          ${g.parts.map(p => `<span class="chip ${p.arrived ? 'chip-ok' : (p.overdue ? 'chip-bad' : (p.needsCount ? 'chip-warn' : 'chip-idle'))}">${esc(p.partLetter)}${p.arrived ? ' in' : (p.needsCount ? ' count' : (p.overdue ? ' late' : ''))}</span>`).join('')}
        </div>
        <div class="a-meta">
          ${g.nextEta
            ? (late ? `Due ${esc(fmtDay(g.nextEta))}, still not here`
                    : `Next part due ${esc(fmtDay(g.nextEta))}${rel ? ` · ${esc(rel.text)}` : ''}`)
            : `${waiting.length} part${waiting.length === 1 ? '' : 's'} with no ETA`}
        </div>
      </a>`;
  }).join('') : `<div class="empty">Every model has fully arrived.</div>`;

  /* --- Charts.

         The old "ordered, built, delivered" panel drew three bars per model,
         and since almost nothing is built yet, twenty-one bars were empty
         track with captions repeating the legend directly above them. One
         track per model now: the full order is the track, built fills it,
         confirmed sits inside that, and the numbers are read off the right. --- */
  const demandMax = Math.max(1, ...groups.map(g => Math.max(g.frQty || 0, g.bbQty || 0)));
  const frbbChart = groups.map(g => `
    <div class="bar-row">
      <div class="bar-label"><span>${modelLabel(g)}</span><span>${esc(g.consignmentGroup)}</span></div>
      <div class="bar-fr">${barTrack(g.frQty || 0, demandMax, 'var(--fr)')}</div>
      <div class="bar-bb">${barTrack(g.bbQty || 0, demandMax, 'var(--bb)')}</div>
    </div>`).join('');

  /* Parts landed comes first in the track because on this data it is the only
     layer with anything in it — showing built and confirmed alone drew seven
     empty rows that each said "0 built of 250". Landed is measured across all
     of a model's parts, so a model with one part of two fully in reads 50%,
     which is the true picture of how far the consignment has got. */
  const progressChart = groups.map(g => {
    const target = g.totalQty || ((g.frQty || 0) + (g.bbQty || 0));
    const expected = g.parts.reduce((s, p) => s + (p.qtyExpected || 0), 0);
    const landed = g.parts.reduce((s, p) => s + (p.qtyReceived || 0), 0);
    const landedPct = expected > 0 ? Math.min(100, (landed / expected) * 100) : 0;
    const built = g.totalBuilt || 0;
    const conf = g.totalConfirmed || 0;
    const pct = n => target > 0 ? Math.min(100, (n / target) * 100) : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">
          <span>${modelLabel(g)}</span>
          <span>${Math.round(landedPct)}% of parts in${built ? ' · ' + built + ' built' : ''}${conf ? ' · ' + conf + ' confirmed' : ''}</span>
        </div>
        <div class="prog-track" role="img"
             aria-label="${esc(plainModel(g))}: ${Math.round(landedPct)} percent of parts landed, ${built} built and ${conf} confirmed out of ${target} ordered">
          <div class="prog-landed" style="width:${landedPct}%;"></div>
          <div class="prog-built" style="width:${pct(built)}%;"></div>
          <div class="prog-conf" style="width:${pct(conf)}%;"></div>
        </div>
      </div>`;
  }).join('');

  /* --- Recent activity, this person only --- */
  const mine = (APP.events || []).filter(e => String(e.User || '').toLowerCase() === String(user.email).toLowerCase()).slice(0, 12);
  const activity = mine.length ? mine.map(e => `
    <div class="act-item">
      <div class="act-when">${esc(e.Timestamp || '—')}</div>
      <div class="act-what">
        <b>${esc(e.EventType)}</b>${e.Qty !== '' && e.Qty != null ? ' · ' + esc(e.Qty) : ''}
        <div class="act-where">${esc(e.ConsignmentGroup || 'whole file')}${e.PartLetter ? ' · part ' + esc(e.PartLetter) : ''}</div>
      </div>
    </div>`).join('') : `<div class="empty">You haven't recorded anything yet.</div>`;

  return `
    ${syncBar}
    ${masterSearch}

    <div class="dash-section">
      ${tiles}
    </div>

    ${customers}

    <div class="dash-section">
      <div class="dash-head">
        <h2>Where every model sits</h2>
        <span class="sub">counted by consignment and factory model, at its furthest-behind part</span>
      </div>
      <div class="stage-strip">${stageStrip}</div>
    </div>

    <div class="dash-section">
      <div class="dash-head">
        <h2>Still to arrive</h2>
        <span class="sub">${arriving.length} model${arriving.length === 1 ? '' : 's'}${
          stats.overdueParts ? ' · ' + stats.overdueModels + ' with a late part' : ''}</span>
      </div>
      <div class="grid grid-3">${arriveTiles}</div>
    </div>

    <div class="grid grid-2 dash-section">
      <div class="card">
        <h3 class="card-h">Who each model is for</h3>
        <p class="card-sub">Units owed to each standing customer.</p>
        <div class="legend">
          <span><i style="background:var(--fr);"></i>FR</span>
          <span><i style="background:var(--bb);"></i>BB</span>
        </div>
        ${frbbChart}
      </div>

      <div class="card">
        <h3 class="card-h">How far each model has got</h3>
        <p class="card-sub">Parts landing, then units built, then what the customer has confirmed.</p>
        <div class="legend">
          <span><i style="background:var(--accent);"></i>Parts landed</span>
          <span><i style="background:var(--primary);"></i>Built</span>
          <span><i style="background:var(--success);"></i>Confirmed</span>
        </div>
        ${progressChart}
      </div>
    </div>

    <div class="card">
      <h3 class="card-h">Your recent activity</h3>
      <p class="card-sub">What you have recorded, newest first.</p>
      ${activity}
    </div>`;
}

/* =========================
   CONSIGNMENTS
   ========================= */

function renderConsignments() {
  const rows = APP.rows || [];
  if (!rows.length) {
    return `<div class="empty">No consignments yet. Sync China Master from the
      <a href="#/dashboard">Dashboard</a>.</div>`;
  }

  const arriving = rows.filter(r => !r.arrived);
  const overdue = rows.filter(r => r.overdue);
  const soon = arriving.filter(r => { const rel = relDays(r.eta); return rel && rel.days >= 0 && rel.days <= 14; });
  const shortLoads = rows.filter(r => r.shortLoad);

  const sortBy = window.__consignSort || 'urgency';
  const dir = (a, b) => String(a).localeCompare(String(b));
  const sorted = rows.slice().sort((a, b) => {
    if (sortBy === 'eta')         return dir(a.eta || '9999', b.eta || '9999');
    if (sortBy === 'consignment') return dir(a.consignmentGroup, b.consignmentGroup);
    if (sortBy === 'model')       return dir(a.signatureModel, b.signatureModel);
    if (sortBy === 'status')      return dir(a.importStatus, b.importStatus);
    return 0; // 'urgency' — the server already sorted it that way
  });

  const body = sorted.map(r => `
      <tr${r.overdue ? ' style="background:#FFF6F5;"' : (r.shortLoad ? ' style="background:#FFFBF5;"' : '')}>
        <td><code>${esc(r.packaging)}</code></td>
        <td>${esc(r.supplier)}</td>
        <td>${esc(r.product)}</td>
        <td><b>${esc(r.signatureModel)}</b><div style="color:var(--text-soft);font-size:11.5px;">${esc(r.factoryModel || '—')}</div></td>
        <td style="text-align:right;">${r.frQty || '—'}</td>
        <td style="text-align:right;">${r.bbQty || '—'}</td>
        <td style="text-align:right;"><b>${r.totalQty || '—'}</b></td>
        <td>${r.shortLoad ? '<span class="chip chip-warn">Short load</span>' : importChip(r.importStatus)}</td>
        <td>${esc(fmtDay(r.etd))}</td>
        <td>${esc(fmtDay(r.eta))}${etaChip(r)}</td>
        <td>${esc(r.mgr || '—')}</td>
      </tr>`).join('');

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat"><div class="stat-label">Lines in total</div><div class="stat-value">${rows.length}</div></div>
      <div class="stat"><div class="stat-label">Lines still to arrive</div><div class="stat-value">${arriving.length}</div></div>
      <div class="stat"><div class="stat-label">Overdue</div>
        <div class="stat-value" style="color:${overdue.length ? 'var(--danger)' : 'var(--dark)'};">${overdue.length}</div></div>
      <div class="stat"><div class="stat-label">Due within 14 days</div><div class="stat-value">${soon.length}</div></div>
      <div class="stat"><div class="stat-label">Short loads</div><div class="stat-value">${shortLoads.length}</div></div>
    </div>

    <div style="display:flex;gap:10px;align-items:end;margin-bottom:14px;">
      <div style="flex:0 0 220px;">
        <label>Sort by</label>
        <select id="cn-sort">
          <option value="urgency">Urgency</option>
          <option value="eta">ETA</option>
          <option value="consignment">Consignment</option>
          <option value="model">Model</option>
          <option value="status">Status</option>
        </select>
      </div>
      <div style="font-size:12px;color:var(--text-soft);padding-bottom:11px;">
        These are packaging lines. The dashboard counts models, so its number is smaller.
      </div>
    </div>

    <div class="card">
      <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Packaging</th><th>Supplier</th><th>Product</th><th>Model</th>
            <th style="text-align:right;">FR</th><th style="text-align:right;">BB</th><th style="text-align:right;">Total</th>
            <th>Status</th><th>ETD</th><th>ETA</th><th>MGR</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

/* =========================
   RECEIVING
   FIX 8 — anything the sheet marks Received skips this page entirely and
   shows up in Assembly, ready to build. Receiving carries only what has not
   arrived yet, and short loads that need a real count.
   ========================= */

function renderReceiving() {
  const groups = (APP.consignments || []).filter(g => g.parts.some(p => !p.arrived || p.needsCount));
  if (!groups.length) return `<div class="empty">Everything has arrived. Head to Assembly to build.</div>`;

  const blocks = byConsignment(groups).map(block => {
    const models = block.models.map(g => {
      const parts = g.parts.filter(p => !p.arrived || p.needsCount);
      const partRows = parts.map(p => {
        const outstanding = Math.max(0, p.qtyExpected - p.qtyReceived);
        // ModelParts calls part A "Part A", so printing both the letter and
        // the name put "Part A" twice on every single row. Only show the name
        // when somebody has actually given the part a real one.
        const named = p.partName && p.partName !== 'Part ' + p.partLetter;
        return `
          <tr${p.overdue ? ' style="background:#FFF6F5;"' : (p.needsCount ? ' style="background:#FFFBF5;"' : '')}>
            <td><b>Part ${esc(p.partLetter)}</b>${named ? `<div style="color:var(--text-soft);font-size:11.5px;">${esc(p.partName)}</div>` : ''}</td>
            <td>${importChip(p.importStatus)}${p.needsCount ? ' <span class="chip chip-warn">Short load</span>' : ''}</td>
            <td>${esc(fmtDay(p.etd))}</td>
            <td>${esc(fmtDay(p.eta))}${etaChip(p)}</td>
            <td style="text-align:right;">${p.qtyExpected || '—'}</td>
            <td style="text-align:right;"><b>${p.qtyReceived}</b></td>
            <td style="text-align:right;${outstanding > 0 ? 'color:var(--warning);font-weight:600;' : ''}">${outstanding || '—'}</td>
            <td style="white-space:nowrap;">
              <input type="number" min="1" max="${p.qtyExpected || ''}" class="rcv-qty" placeholder="count" style="width:80px;display:inline-block;">
              <button class="btn btn-sm rcv-btn" data-rowid="${esc(p.rowId || '')}" ${p.rowId ? '' : 'disabled'}>Receive</button>
            </td>
          </tr>`;
      }).join('');

      return `
        <div class="model-block">
          <div class="model-head">
            <div class="model-title">${modelLabel(g)}</div>
            <div class="model-meta">${esc(g.supplier)} · ${esc(g.product || '—')} · FR ${g.frQty || 0} · BB ${g.bbQty || 0} · total ${g.totalQty || '—'}</div>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr>
                <th>Part</th><th>Status</th><th>ETD</th><th>ETA</th>
                <th style="text-align:right;">Expected</th><th style="text-align:right;">Received</th>
                <th style="text-align:right;">Outstanding</th><th style="width:190px;"></th>
              </tr></thead>
              <tbody>${partRows}</tbody>
            </table>
          </div>
          <div class="rcv-status note hidden" style="margin-top:12px;"></div>
        </div>`;
    }).join('');

    return `
      <div class="consign-block">
        <div class="consign-head">
          <h2>${esc(block.consignment)}</h2>
          <span class="meta">${block.models.length} model${block.models.length === 1 ? '' : 's'}</span>
        </div>
        ${models}
      </div>`;
  }).join('');

  return `
    <div class="note" style="margin-bottom:18px;">
      The count you type <b>replaces</b> what is on the line — it is how many are physically on the floor,
      not how many more turned up. Type the full count each time.
    </div>
    ${blocks}`;
}

/* =========================
   ASSEMBLY
   ========================= */

function renderAssembly() {
  const active = (APP.consignments || []).filter(g => g.parts.some(p => p.qtyReceived > 0));
  if (!active.length) return `<div class="empty">Nothing has arrived yet. Parts show up here once they land.</div>`;

  const totalBuildable = active.reduce((s, g) => s + g.buildableUnits, 0);
  const blocked = active.filter(g => g.buildableUnits <= 0).length;

  const partBar = p => {
    const per = p.qtyPerUnit || 1;
    const units = Math.floor(p.qtyReceived / per);
    // With one part per unit the count and the unit count are the same number,
    // so saying "537" and then "537 units" underneath told nobody anything.
    // The second line earns its place only when a unit takes more than one.
    return `
      <div style="border:1px solid var(--border);border-radius:10px;padding:12px;">
        <div style="font-size:11.5px;color:var(--text-soft);font-weight:700;">Part ${esc(p.partLetter)}</div>
        <div style="font-size:22px;font-weight:800;color:var(--dark);margin-top:4px;line-height:1;">${p.qtyReceived}</div>
        <div style="font-size:11.5px;color:var(--text-soft);margin-top:5px;">
          ${per > 1 ? `${per} per unit · makes ${units}` : 'on the floor'}
        </div>
      </div>`;
  };

  const blocks = byConsignment(active).map(block => {
    const models = block.models.map(g => {
      const canBuild = g.buildableUnits > 0;
      // FIX 3 — buildable is the minimum across parts, never the sum.
      return `
        <div class="model-block">
          <div class="model-head">
            <div>
              <div class="model-title">${modelLabel(g)}</div>
              <div class="model-meta">${esc(g.supplier)} · ${esc(g.product || '—')} · ${g.totalBuilt} built</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:11.5px;color:var(--text-soft);font-weight:700;">Can build</div>
              <div style="font-size:28px;font-weight:800;line-height:1;color:${canBuild ? 'var(--success)' : 'var(--text-soft)'};">${g.buildableUnits}</div>
            </div>
          </div>

          <div class="grid grid-4" style="margin:14px 0;">${g.parts.map(partBar).join('')}</div>

          ${canBuild ? `
            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
              <div style="flex:0 0 150px;">
                <label>Units to build</label>
                <input type="number" class="asm-qty" min="1" max="${g.buildableUnits}" value="${g.buildableUnits}">
              </div>
              <button class="btn btn-primary asm-btn" data-groupkey="${esc(g.groupKey)}" data-max="${g.buildableUnits}">Build units</button>
            </div>
          ` : (g.blockingPart
              ? `<div class="note">Part ${esc(g.blockingPart.partLetter)} is ${g.blockingPart.shortfallUnits} unit${g.blockingPart.shortfallUnits === 1 ? '' : 's'} behind.</div>`
              : '')}
          <div class="asm-status note hidden" style="margin-top:12px;"></div>
        </div>`;
    }).join('');

    return `
      <div class="consign-block">
        <div class="consign-head">
          <h2>${esc(block.consignment)}</h2>
          <span class="meta">${block.models.length} model${block.models.length === 1 ? '' : 's'}</span>
        </div>
        ${models}
      </div>`;
  }).join('');

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat"><div class="stat-label">Ready to build</div><div class="stat-value">${totalBuildable}</div></div>
      <div class="stat"><div class="stat-label">Waiting on parts</div><div class="stat-value">${blocked}</div></div>
      <div class="stat"><div class="stat-label">Built to date</div><div class="stat-value">${active.reduce((s, g) => s + g.totalBuilt, 0)}</div></div>
    </div>
    ${blocks}`;
}

/* =========================
   DELIVERY
   FIX 9 — FR and BB per model. "We owe FR 200 of AC12", not one combined total.
   ========================= */

function renderDelivery() {
  const groups = APP.consignments || [];
  const deliveries = APP.deliveries || [];

  const rows = groups.map(g => {
    const fr = (g.deliveredTo && g.deliveredTo.FR) || { out: 0, confirmed: 0 };
    const bb = (g.deliveredTo && g.deliveredTo.BB) || { out: 0, confirmed: 0 };
    return `
      <tr>
        <td><code>${esc(g.consignmentGroup)}</code></td>
        <td>${modelLabel(g)}</td>
        <td style="text-align:right;">${g.frQty || 0}</td>
        <td style="text-align:right;">${fr.out}</td>
        <td style="text-align:right;${Math.max(0, (g.frQty || 0) - fr.confirmed) ? 'color:var(--warning);font-weight:600;' : ''}">${Math.max(0, (g.frQty || 0) - fr.confirmed)}</td>
        <td style="text-align:right;">${g.bbQty || 0}</td>
        <td style="text-align:right;">${bb.out}</td>
        <td style="text-align:right;${Math.max(0, (g.bbQty || 0) - bb.confirmed) ? 'color:var(--warning);font-weight:600;' : ''}">${Math.max(0, (g.bbQty || 0) - bb.confirmed)}</td>
      </tr>`;
  }).join('');

  const ready = groups.filter(g => g.totalBuilt - g.totalOut > 0);
  const readyBlocks = ready.length ? byConsignment(ready).map(block => `
    <div class="consign-block">
      <div class="consign-head"><h2>${esc(block.consignment)}</h2></div>
      ${block.models.map(g => {
        const available = g.totalBuilt - g.totalOut;
        return `
        <div class="model-block">
          <div class="model-head">
            <div>
              <div class="model-title">${modelLabel(g)}</div>
              <div class="model-meta">${available} built · FR ${g.frQty || 0} · BB ${g.bbQty || 0}</div>
            </div>
          </div>
          <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:0 0 130px;">
              <label>Customer</label>
              <select class="dlv-cust"><option value="FR">FR</option><option value="BB">BB</option></select>
            </div>
            <div style="flex:0 0 130px;">
              <label>Units out</label>
              <input type="number" class="dlv-qty" min="1" max="${available}" value="${available}">
            </div>
            <button class="btn btn-primary dlv-btn" data-groupkey="${esc(g.groupKey)}" data-max="${available}">Mark out</button>
          </div>
          <div class="dlv-status note hidden" style="margin-top:12px;"></div>
        </div>`;
      }).join('')}
    </div>`).join('') : `<div class="empty">No built units waiting to go out.</div>`;

  const pending = deliveries.filter(d => d.Status === 'pending');
  const groupName = key => {
    const g = groups.find(x => x.groupKey === key);
    return g ? (g.consignmentGroup + ' · ' + plainModel(g)) : String(key).replace('::', ' · ');
  };

  const pendingTable = pending.length ? `
    <div class="card">
      <h3 class="card-h">Awaiting confirmation</h3>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Consignment · model</th><th>Customer</th><th style="text-align:right;">Sent</th><th>When</th><th style="width:220px;"></th></tr></thead>
        <tbody>
          ${pending.map(d => `
            <tr>
              <td>${esc(groupName(d.GroupKey))}</td>
              <td><b>${esc(d.CustomerCode)}</b></td>
              <td style="text-align:right;">${esc(d.QtyOut)}</td>
              <td>${esc(fmtDay(d.TimestampDay))}</td>
              <td style="white-space:nowrap;">
                <input type="number" class="cfm-qty" min="0" value="${esc(d.QtyOut)}" style="width:88px;display:inline-block;">
                <button class="btn btn-sm cfm-btn" data-deliveryid="${esc(d.DeliveryID)}">Confirm</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <div id="cfm-status" class="note hidden" style="margin-top:12px;"></div>
    </div>` : '';

  return `
    <div class="card">
      <h3 class="card-h">Owed per model</h3>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th>Consignment</th><th>Model</th>
          <th style="text-align:right;">FR owed</th><th style="text-align:right;">FR sent</th><th style="text-align:right;">FR left</th>
          <th style="text-align:right;">BB owed</th><th style="text-align:right;">BB sent</th><th style="text-align:right;">BB left</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>
    ${readyBlocks}
    ${pendingTable}`;
}

    <div class="card">
      <table>
        <thead><tr><th>Packaging</th><th>Reason</th><th>Corrected</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr data-rowid="${esc(r.RowID)}">

   REPORTS

function renderReports() {
  return `
    <div class="card">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <input id="rp-search" type="text" placeholder="Search consignment, part or event" style="max-width:320px;">
        <button class="btn" id="rp-filter">Search</button>

      <div style="overflow-x:auto;">
